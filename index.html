/**
 * Restaura un respaldo SUBIÉNDOLO a la nube.
 * En la v1 solo escribía en el navegador y el siguiente sync lo borraba en silencio.
 */
function importarDatos(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let datos;
    try{ datos = JSON.parse(e.target.result); }
    catch(err){ input.value=''; return toastErr('El archivo no es un JSON válido'); }
    input.value = '';   // permite reintentar con el mismo archivo

    const arr = v => Array.isArray(v) ? v : [];
    const cl = arr(datos.clientes), pr = arr(datos.prestamos), ab = arr(datos.abonos);
    const ga = arr(datos.gastos), ca = arr(datos.capital), ci = arr(datos.cierres);
    if(!cl.length && !pr.length) return toastErr('El archivo no contiene clientes ni préstamos');

    const total = cl.length+pr.length+ab.length+ga.length+ca.length+ci.length;
    if(!confirm(
      'RESTAURAR COPIA del '+String(datos.fecha_exportacion||'').slice(0,10)+'\n\n'+
      cl.length+' clientes\n'+pr.length+' préstamos\n'+ab.length+' abonos\n'+
      ga.length+' gastos\n'+ca.length+' movimientos de capital\n'+ci.length+' cierres\n\n'+
      'Se SUBIRÁN a Google Sheets como registros nuevos, junto a los que ya existan.\n'+
      'Si la hoja ya tiene datos quedarán duplicados: vacíala antes si vas a reemplazar todo.\n\n'+
      '¿Continuar?')) return;
    if(!navigator.onLine) return toastErr('Necesitas conexión para restaurar en la nube');

    closeDrawer();
    const screen = document.getElementById('screen');
    const pintar = function(hechos){ if(screen) screen.innerHTML =
      '<div class="empty" style="padding-top:90px">'+
      '<div class="prog" style="max-width:240px;margin:0 auto 20px"><div class="prog-f" style="width:'+Math.round(hechos/total*100)+'%;background:var(--gold)"></div></div>'+
      '<div class="empty-title">Restaurando copia de seguridad</div>'+
      '<div class="empty-sub">'+hechos+' de '+total+' registros enviados. No cierres la app.</div></div>'; };
    pintar(0);

    let hechos=0, fallos=[];
    const mapCliente = {}, mapPrestamo = {};
    const enviar = async function(tabla, payload, etiqueta){
      try{ const r = await gsWrite(tabla,'create',payload); hechos++; pintar(hechos); return r; }
      catch(err){ fallos.push(etiqueta+': '+err.message); hechos++; pintar(hechos); return null; }
    };
    for(const c of cl){ const {id, ...rest} = c; const r = await enviar('clientes', rest, 'Cliente '+(c.nombre||'')); if(r&&r.id) mapCliente[id]=r.id; }
    for(const p of pr){ const {id, ...rest} = p; rest.cliente_id = mapCliente[p.cliente_id] || p.cliente_id;
                        const r = await enviar('prestamos', rest, 'Préstamo '+(p.monto_prestado||'')); if(r&&r.id) mapPrestamo[id]=r.id; }
    for(const a of ab){ const {id, ...rest} = a; rest.prestamo_id = mapPrestamo[a.prestamo_id] || a.prestamo_id; await enviar('abonos', rest, 'Abono'); }
    for(const g of ga){ const {id, ...rest} = g; await enviar('gastos', rest, 'Gasto'); }
    for(const m of ca){ const {id, ...rest} = m; await enviar('capitalMovimientos', rest, 'Capital'); }
    for(const k of ci){ const {id, ...rest} = k; await enviar('cierres', rest, 'Cierre'); }

    await syncData(true);
    navigate('dashboard', null, false);
    if(fallos.length) toastErr('Restauración parcial: '+fallos.length+' de '+total+' fallaron');
    else toastOk('Copia restaurada en la nube · '+total+' registros');
  };
  reader.readAsText(file);
}

function mostrarToast(msg, tipo){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    t.style.cssText='position:fixed;bottom:112px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--bg3);border:1px solid var(--border2);color:var(--txt);padding:11px 18px;border-radius:var(--r3);font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;line-height:1.35';
    document.body.appendChild(t);
  }
  const col = tipo==='error'?'var(--red)':tipo==='ok'?'var(--green)':'var(--txt2)';
  const nom = tipo==='error'?'alert':tipo==='ok'?'checkCircle':'info';
  t.innerHTML = '<span style="color:'+col+';display:flex">'+ico(nom,15)+'</span>';
  const sp = document.createElement('span'); sp.textContent = String(msg||''); t.appendChild(sp);
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(10px)'; }, tipo==='error'?4200:2600);
}
const toastOk  = m=>mostrarToast(m,'ok');
const toastErr = m=>mostrarToast(m,'error');

// SCORE DE COMPORTAMIENTO
// ═══════════════════════════════════════
function calcScore(clienteId){
  const ps = DB.prestamos().filter(p=>p.cliente_id===clienteId && p.estado!=='anulado');
  if(!ps.length) return {score:0,label:'Sin historial',color:'var(--txt3)',estrellas:0,vecesEnMora:0,diasMoraTotal:0,prestadosPagados:0,pagosATiempo:0,totalPagos:0,limiteSugerido:0};

  let base = 60;              // punto de partida neutro
  let bonoHistorial = 0;      // con tope: el pasado no borra la mora de hoy
  let castigo = 0;
  let cuotasPuntuales=0, cuotasTarde=0, diasMoraTotal=0, prestadosPagados=0, vecesEnMora=0;
  let montoHistorico=0, enMoraHoy=false, diasAtrasoHoy=0;

  ps.forEach(p=>{
    const est = estadoPrestamo(p);
    const pl = planPrestamo(p);
    montoHistorico += Number(p.monto_prestado)||0;
    if(est==='pagado'){ prestadosPagados++; bonoHistorial += 8; }
    if(est==='mora'){ enMoraHoy = true; vecesEnMora++; diasAtrasoHoy = Math.max(diasAtrasoHoy, pl.diasAtraso); }
    pl.cuotas.forEach(c=>{
      if(c.pagada){
        if(c.diasRetraso > 3){ cuotasTarde++; diasMoraTotal += c.diasRetraso; castigo += Math.min(6, c.diasRetraso*0.35); }
        else { cuotasPuntuales++; bonoHistorial += 2.5; }
      } else if(c.vencida){
        castigo += Math.min(14, 5 + c.diasRetraso*0.3);
      }
    });
  });

  bonoHistorial = Math.min(35, bonoHistorial);        // ← tope que faltaba
  let puntos = base + bonoHistorial - castigo;
  if(enMoraHoy) puntos = Math.min(puntos, diasAtrasoHoy>60?34:diasAtrasoHoy>30?49:64);  // techo si hay mora vigente
  puntos = Math.max(0, Math.min(100, puntos));

  const estrellas = puntos>=85?5:puntos>=70?4:puntos>=55?3:puntos>=35?2:1;
  const label = puntos>=85?'Excelente':puntos>=70?'Bueno':puntos>=55?'Regular':puntos>=35?'Riesgoso':'Crítico';
  const color = puntos>=70?'var(--green)':puntos>=45?'var(--amber)':'var(--red)';
  // Cupo sugerido: mayor préstamo histórico ajustado por comportamiento
  const mayor = Math.max.apply(null, ps.map(p=>Number(p.monto_prestado)||0));
  const factor = puntos>=85?1.5:puntos>=70?1.2:puntos>=55?1:puntos>=35?0.6:0;
  const limiteSugerido = Math.round((mayor*factor)/50000)*50000;

  return {score:Math.round(puntos), label, color, estrellas,
          vecesEnMora, diasMoraTotal, prestadosPagados,
          pagosATiempo:cuotasPuntuales, totalPagos:cuotasPuntuales+cuotasTarde,
          cuotasTarde, montoHistorico, limiteSugerido, enMoraHoy};
}

function renderEstrellas(n, color){
  return [1,2,3,4,5].map(i=>`<span style="color:${i<=n?color:'var(--bg4)'}">★</span>`).join('');
}

// ═══════════════════════════════════════
function calcFlujoCaja(){
  const ps = DB.prestamos().filter(p=>['activo','mora'].includes(estadoPrestamo(p)));
  const clientes = DB.clientes();
  const nombreDe = id => (clientes.find(x=>x.id===id)||{}).nombre || '—';
  const hoy = today();
  const semanas = [];

  // Bloque 0: lo YA vencido y sin pagar — antes desaparecía de la proyección
  const vencido = [];
  ps.forEach(p=>{
    planPrestamo(p).cuotas.filter(c=>c.vencida).forEach(c=>{
      vencido.push({cliente:nombreDe(p.cliente_id), monto:c.total-c.pagado, fecha:c.fecha, cuota:c.numero, prestamo_id:p.id, dias:c.diasRetraso});
    });
  });
  if(vencido.length){
    vencido.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    semanas.push({label:'Vencido sin cobrar', vencido:true, inicio:'', fin:'',
                  vencen:vencido, total:vencido.reduce((s,v)=>s+v.monto,0)});
  }

  for(let w=0; w<8; w++){
    const isoInicio = fechaMas(w*7, hoy);
    const isoFin    = fechaMas(w*7+6, hoy);
    const vencen = [];
    ps.forEach(p=>{
      planPrestamo(p).cuotas
        .filter(c=>!c.pagada && !c.vencida && c.fecha>=isoInicio && c.fecha<=isoFin)
        .forEach(c=>vencen.push({cliente:nombreDe(p.cliente_id), monto:c.total-c.pagado, fecha:c.fecha, cuota:c.numero, prestamo_id:p.id}));
    });
    vencen.sort((a,b)=>a.fecha.localeCompare(b.fecha));
    semanas.push({
      label: w===0?'Esta semana':w===1?'Próxima semana':'Semana '+(w+1),
      inicio:isoInicio, fin:isoFin, vencen,
      total: vencen.reduce((s,v)=>s+v.monto,0)
    });
  }
  return semanas;
}

function calcRecordatorios(){
  return _memo('recordatorios', function(){
    const ps = DB.prestamos().filter(p=>['activo','mora'].includes(estadoPrestamo(p)));
    const clientes = DB.clientes();
    const hoy = today();
    const mananaStr = fechaMas(1, hoy);
    const en3Str = fechaMas(3, hoy);
    const cobrosHoy=[], cobrosMañana=[], cobrosProximos=[], enMora=[];

    ps.forEach(p=>{
      const cli = clientes.find(x=>x.id===p.cliente_id) || {};
      const pl = planPrestamo(p);
      const base = {nombre:cli.nombre||'—', telefono:cli.telefono||'', saldo:pl.saldo,
                    prestamo_id:p.id, cliente_id:p.cliente_id};

      if(pl.cuotasVencidas > 0){
        enMora.push({...base, diasMora:pl.diasAtraso, monto:pl.montoVencido, cuotas:pl.cuotasVencidas, recargoMora:pl.recargoMora});
      }
      pl.cuotas.filter(c=>!c.pagada && !c.vencida).forEach(c=>{
        const item = {...base, monto:c.total-c.pagado, fecha:c.fecha, cuota:c.numero};
        if(c.fecha===hoy) cobrosHoy.push(item);
        else if(c.fecha===mananaStr) cobrosMañana.push(item);
        else if(c.fecha>hoy && c.fecha<=en3Str) cobrosProximos.push(item);
      });
    });
    enMora.sort((a,b)=>b.diasMora-a.diasMora);
    return {cobrosHoy, cobrosMañana, cobrosProximos, enMora};
  });
}

function getMovimientosTodos(){
  const clientes = DB.clientes();
  const prestamos = DB.prestamos();
  const movs = [];

  // Abonos
  DB.abonos().forEach(function(a){
    const p = prestamos.find(function(x){ return x.id===a.prestamo_id; });
    const c = p ? clientes.find(function(x){ return x.id===p.cliente_id; }) : null;
    movs.push({
      fecha: a.fecha_abono,
      tipo: 'abono',
      tipoLabel: 'Abono',
      descripcion: (c?c.nombre:'—') + ' · ' + (a.tipo_abono==='total'?'Pago total':a.tipo_abono==='capital'?'Capital':a.tipo_abono==='interes'?'Interés':'Mixto'),
      monto: a.monto,
      signo: '+',
      color: 'var(--green)',
      ref: a.prestamo_id,
      obs: a.observaciones||''});
  });

  // Préstamos desembolsados
  prestamos.forEach(function(p){
    const c = clientes.find(function(x){ return x.id===p.cliente_id; });
    movs.push({
      fecha: p.fecha_inicio,
      tipo: 'prestamo',
      tipoLabel: 'Préstamo',
      descripcion: 'Préstamo a ' + (c?c.nombre:'—') + ' · ' + p.tasa_interes_mensual + '% fijo mensual',
      monto: p.monto_prestado,
      signo: '−',
      color: 'var(--amber)',
      ref: p.id,
      obs: p.observaciones||''});
  });

  // Capital
  DB.capital().forEach(function(m){
    movs.push({
      fecha: m.fecha,
      tipo: 'capital',
      tipoLabel: m.tipo==='retiro'?'Retiro':'Capital',
      descripcion: m.tipo==='retiro'?'Retiro de capital':m.tipo==='ganancia_reinvertida'?'Ganancia reinvertida':'Inyección de capital',
      monto: m.monto,
      signo: m.tipo==='retiro'?'−':'+',
      color: m.tipo==='retiro'?'var(--red)':'var(--blue)',
      ref: m.id,
      obs: m.descripcion||''});
  });

  // Gastos
  DB.gastos().forEach(function(g){
    movs.push({
      fecha: g.fecha,
      tipo: 'gasto',
      tipoLabel: 'Gasto',
      descripcion: g.concepto + ' · ' + g.categoria,
      monto: g.monto,
      signo: '−',
      color: 'var(--red)',
      ref: g.id,
      obs: ''});
  });

  return movs.sort(function(a,b){ return b.fecha.localeCompare(a.fecha) || b.tipo.localeCompare(a.tipo); });
}

function filtrarMovimientos(){
  const desde = document.getElementById('mov-desde')?.value||'';
  const hasta = document.getElementById('mov-hasta')?.value||'';
  const tipoActivo = (function(){
    let t = 'todos';
    document.querySelectorAll('#mov-tipos button').forEach(function(b){
      if(b.style.background.includes('gold')||b.style.background==='var(--gold)') t = b.dataset.tipo;
    });
    return t;
  })();

  let movs = getMovimientosTodos();
  if(desde) movs = movs.filter(function(m){ return m.fecha >= desde; });
  if(hasta) movs = movs.filter(function(m){ return m.fecha <= hasta; });
  if(tipoActivo !== 'todos'){
    const mapa = {abonos:'abono',préstamos:'prestamo',capital:'capital',gastos:'gasto'};
    const t = mapa[tipoActivo]||tipoActivo;
    movs = movs.filter(function(m){ return m.tipo===t||m.tipo.startsWith(t); });
  }

  const container = document.getElementById('mov-resultados');
  if(!container) return;

  if(movs.length===0){
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--txt3);font-size:13px">Sin movimientos en el rango seleccionado</div>';
    return;
  }

  // Totales
  const totalEntradas = movs.filter(function(m){ return m.signo==='+'; }).reduce(function(s,m){ return s+m.monto; },0);
  const totalSalidas  = movs.filter(function(m){ return m.signo==='−'; }).reduce(function(s,m){ return s+m.monto; },0);

  let html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Movimientos</div><div style="font-size:16px;font-weight:500">'+movs.length+'</div></div>' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Entradas</div><div style="font-size:14px;font-weight:500;color:var(--green)">+'+fmt(totalEntradas)+'</div></div>' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Salidas</div><div style="font-size:14px;font-weight:500;color:var(--red)">−'+fmt(totalSalidas)+'</div></div>' +
  '</div>';

  // Lista agrupada por fecha
  const porFecha = {};
  movs.forEach(function(m){
    if(!porFecha[m.fecha]) porFecha[m.fecha]=[];
    porFecha[m.fecha].push(m);
  });

  html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">';
  Object.keys(porFecha).sort(function(a,b){ return b.localeCompare(a); }).forEach(function(fecha){
    html += '<div style="padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--txt2)">'+fmtDate(fecha)+'</div>';
    porFecha[fecha].forEach(function(m){
      html +=
        '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)">' +
          '<div style="width:7px;height:7px;border-radius:50%;background:'+m.color+';flex-shrink:0"></div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(m.descripcion)+'</div>' +
            '<div style="font-size:11px;color:var(--txt3);margin-top:1px">'+m.tipoLabel+(m.obs?' · '+m.obs:'')+'</div>' +
          '</div>' +
          '<div style="font-size:13px;font-weight:500;color:'+m.color+';flex-shrink:0">'+m.signo+fmt(m.monto)+'</div>' +
        '</div>';
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

function exportarMovimientosCSV(){
  const desde = document.getElementById('mov-desde')?.value||'';
  const hasta = document.getElementById('mov-hasta')?.value||'';
  let movs = getMovimientosTodos();
  if(desde) movs = movs.filter(function(m){ return m.fecha >= desde; });
  if(hasta) movs = movs.filter(function(m){ return m.fecha <= hasta; });

  const rows = [['Fecha','Tipo','Descripción','Monto','Entrada/Salida','Observaciones']];
  movs.forEach(function(m){
    rows.push([m.fecha, m.tipoLabel, m.descripcion, m.monto, m.signo==='+' ? 'Entrada':'Salida', m.obs]);
  });
  const csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='movimientos_'+(desde||'inicio')+'_'+(hasta||'hoy')+'.csv';
  a.click(); URL.revokeObjectURL(url);
  mostrarToast('CSV descargado — ábrelo en Excel');
}

// ═══════════════════════════════════════
// EXPORTAR A EXCEL (múltiples reportes)
// ═══════════════════════════════════════
function exportarReporteExcel(tipo){
  const clientes = DB.clientes();
  const prestamos = DB.prestamos();
  let rows = [], filename = '';

  if(tipo==='clientes_activos'){
    filename = 'clientes_activos.csv';
    rows = [['Nombre','Teléfono','Tipo','Préstamos Activos','Saldo Total','Mora']];
    clientes.forEach(function(c){
      const ps = prestamos.filter(function(p){ return p.cliente_id===c.id && ['activo','mora'].includes(estadoPrestamo(p)); });
      if(ps.length===0) return;
      const saldo = ps.reduce(function(s,p){ return s+saldoPrestamo(p); },0);
      const mora = ps.some(function(p){ return estadoPrestamo(p)==='mora'; });
      rows.push([c.nombre, c.telefono||'', c.tipo_cliente, ps.length, saldo, mora?'Sí':'No']);
    });
  } else if(tipo==='clientes_mora'){
    filename = 'clientes_mora.csv';
    rows = [['Nombre','Teléfono','Préstamo','Monto Prestado','Saldo','Días Mora','Vencimiento']];
    prestamos.filter(function(p){ return estadoPrestamo(p)==='mora'; }).forEach(function(p){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      const dias = diffDays(p.fecha_vencimiento, today());
      rows.push([c?c.nombre:'—', c?c.telefono||'':'', p.id, p.monto_prestado, saldoPrestamo(p), dias, p.fecha_vencimiento]);
    });
  } else if(tipo==='cartera_completa'){
    filename = 'cartera_completa.csv';
    rows = [['Cliente','Teléfono','Monto Prestado','Tasa %','Cuotas','F. Inicio','F. Vencimiento','Total Pagar','Abonado','Saldo','Estado']];
    prestamos.forEach(function(p){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      const abonado = DB.abonos().filter(function(a){ return a.prestamo_id===p.id; }).reduce(function(s,a){ return s+a.monto; },0);
      rows.push([c?c.nombre:'—', c?c.telefono||'':'', p.monto_prestado, p.tasa_interes_mensual, p.num_cuotas, p.fecha_inicio, p.fecha_vencimiento, p.total_a_pagar, abonado, saldoPrestamo(p), estadoPrestamo(p)]);
    });
  } else if(tipo==='gastos'){
    filename = 'gastos.csv';
    rows = [['Fecha','Concepto','Categoría','Monto']];
    DB.gastos().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); }).forEach(function(g){
      rows.push([g.fecha, g.concepto, g.categoria, g.monto]);
    });
  }

  if(rows.length<=1){ mostrarToast('Sin datos para exportar'); return; }
  const csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  mostrarToast(''+(rows.length-1)+' registros exportados — abre en Excel');
}

// ═══════════════════════════════════════
// LECTOR DE CSV — respeta celdas vacías, comillas escapadas y separador ; o ,
// ═══════════════════════════════════════
function detectarSeparador(linea){
  const contar = t => { let q=false,n=0; for(let i=0;i<linea.length;i++){ const ch=linea[i];
      if(ch==='"') q=!q; else if(!q && ch===t) n++; } return n; };
  return contar(';') > contar(',') ? ';' : ',';
}
function parseFilaCSV(linea, sep){
  const out=[]; let cur='', q=false;
  for(let i=0;i<linea.length;i++){
    const ch = linea[i];
    if(q){
      if(ch==='"'){ if(linea[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur += ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===sep){ out.push(cur); cur=''; }   // una celda vacía SÍ produce columna
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(function(v){ return v.trim(); });
}
function partirFilasCSV(texto){
  const filas=[]; let cur='', q=false;
  for(let i=0;i<texto.length;i++){
    const ch=texto[i];
    if(ch==='"'){ q=!q; cur+=ch; continue; }
    if(!q && (ch==='\n' || ch==='\r')){
      if(ch==='\r' && texto[i+1]==='\n') i++;
      if(cur.trim()) filas.push(cur);
      cur=''; continue;
    }
    cur+=ch;
  }
  if(cur.trim()) filas.push(cur);
  return filas;
}
/** Quita encabezados de grupo e instrucciones SIN descartar datos reales */
function limpiarFilasCSV(filas, columnasClave){
  return filas.filter(function(l){
    const low = l.toLowerCase();
    const cels = l.split(/[,;]/).map(function(x){ return x.replace(/"/g,'').trim(); }).filter(Boolean);
    const esGrupo = cels.length <= 2 && !columnasClave.some(function(k){ return low.indexOf(k)>=0; });
    const esInstruccion = /^\s*"?\s*(instrucci|\*\s*obligatorio|solo n[uú]meros)/i.test(l);
    return !(esGrupo || esInstruccion);
  });
}
/** Fecha desde texto: AAAA-MM-DD, DD/MM/AAAA, DD-MM-AA o serial de Excel */
function normFecha(f){
  if(!f) return '';
  const t = String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let d=Number(m[1]), mo=Number(m[2]), y=m[3];
    if(y.length===2) y = (Number(y) > 70 ? '19' : '20') + y;
    if(mo>12 && d<=12){ const tmp=d; d=mo; mo=tmp; }
    if(mo<1||mo>12||d<1||d>31) return '';
    const iso = y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dt = new Date(iso+'T12:00:00');
    return (dt.getMonth()+1===mo && dt.getDate()===d) ? iso : '';
  }
  m = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  if(/^\d{5}$/.test(t)){
    const d = new Date(Date.UTC(1899,11,30) + Number(t)*86400000);
    return d.toISOString().slice(0,10);
  }
  return '';
}

function procesarCSVClientes(file){
  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result.replace(/^﻿/,'');
    const lines = partirFilasCSV(text);
    if(lines.length < 2){ toastErr('El archivo está vacío o no tiene datos'); return; }
    const filtradas = limpiarFilasCSV(lines, ['nombre','telefono','identificacion','monto_prestado']);
    if(!filtradas.length){ toastErr('No se encontró la fila de encabezados'); return; }
    if(filtradas[0].toLowerCase().indexOf('nombre') < 0){
      toastErr('La primera fila debe tener los encabezados (nombre, telefono, ...)'); return;
    }
    const sep = detectarSeparador(filtradas[0]);
    const headers = parseFilaCSV(filtradas[0], sep).map(function(h){ return h.replace(/"/g,'').trim().toLowerCase(); });
    const filaReal = function(i){ return lines.indexOf(filtradas[i+1]) + 1; };

    const col = function(name){ return headers.indexOf(name); };
    const iNombre   = col('nombre');
    const iTel      = col('telefono');
    const iTipo     = col('tipo_cliente');
    const iId       = col('identificacion');
    const iObs      = col('observaciones_cliente') >= 0 ? col('observaciones_cliente') : col('observaciones');
    const iMonto    = col('monto_prestado');
    const iTasa     = col('tasa_interes');
    const iCuotas   = col('num_cuotas');
    const iFreq     = col('frecuencia_dias');
    const iFInicio  = col('fecha_inicio');
    const iFVence   = col('fecha_vencimiento');
    const iObsP     = col('observaciones_prestamo');

    const errores = [], validosClientes = [], validosPrestamos = [];
    const tiposValidos = ['Fidelizado','R.Bajo','R.Alto','Nuevo'];

    const clean = function(s){ return (s||'').replace(/^"|"$/g,'').replace(/""/g,'"').trim(); };

    filtradas.slice(1).forEach(function(line, i){
      if(!line.trim()) return;
      const cols = parseFilaCSV(line, sep);

      const nombre   = clean(cols[iNombre>=0?iNombre:0]);
      const telefono = clean(cols[iTel>=0?iTel:1]);
      const tipo     = clean(cols[iTipo>=0?iTipo:2])||'Fidelizado';
      const identi   = clean(cols[iId>=0?iId:3]);
      const obsC     = clean(cols[iObs>=0?iObs:4]);

      const nFila = filaReal(i);
      if(!nombre){ errores.push('Fila '+nFila+': nombre vacío'); return; }
      if(!tiposValidos.includes(tipo)){ errores.push('Fila '+nFila+': tipo "'+tipo+'" no válido'); return; }
      const yaExiste = DB.clientes().filter(function(x){return x.estado!=='inactivo';}).find(function(x){
        return String(x.nombre||'').toLowerCase().trim() === nombre.toLowerCase().trim()
            || (identi && String(x.identificacion||'').trim() === identi); });
      if(yaExiste){ errores.push('Fila '+nFila+': "'+nombre+'" ya existe — omitido'); return; }
      if(validosClientes.some(function(x){return x.nombre.toLowerCase().trim()===nombre.toLowerCase().trim();})){
        errores.push('Fila '+nFila+': "'+nombre+'" repetido en el archivo — omitido'); return; }

      const clienteId = uid();
      validosClientes.push({id:clienteId, nombre, telefono, tipo_cliente:tipo, identificacion:identi, observaciones:obsC, estado:'activo', created_at:Date.now()});

      // ¿Tiene datos de préstamo?
      const montoTxt = iMonto>=0 ? clean(cols[iMonto]) : '';
      const tasaTxt  = iTasa>=0  ? clean(cols[iTasa])  : '';
      const monto = montoTxt ? parseNum(montoTxt) : 0;
      const tasa  = tasaTxt  ? parseNum(tasaTxt)  : 0;
      if((montoTxt || tasaTxt) && !(monto > 0 && tasa > 0)){
        errores.push('Fila '+nFila+': "'+nombre+'" creado, pero su préstamo se omitió (monto o tasa inválidos)');
      }
      if(monto > 0 && tasa > 0){
        const cuotas = iCuotas>=0 ? Math.max(1, Math.min(60, parseInt(clean(cols[iCuotas]),10)||1)) : 1;
        const fq = iFreq>=0 ? parseInt(clean(cols[iFreq]),10) : 30;
        const freq = ([7,15,30].indexOf(fq)>=0) ? fq : 30;
        const fInicio  = normFecha(iFInicio>=0 ? clean(cols[iFInicio]) : '') || today();
        const fVence   = normFecha(iFVence>=0  ? clean(cols[iFVence])  : '');
        const obsP     = iObsP>=0    ? clean(cols[iObsP])    : '';
        const calc     = calcPrestamo(monto, tasa, cuotas, freq);

        // Calcular fecha vencimiento si no viene
        const fv = fVence || fechaMas(freq*cuotas, fInicio);

        validosPrestamos.push({
          id:uid(), cliente_id:clienteId,
          monto_prestado:monto, tasa_interes_mensual:tasa,
          frecuencia_cobro:freq, num_cuotas:cuotas,
          valor_cuota:calc.valorCuota, interes_total:calc.intTotal,
          total_a_pagar:calc.total,
          fecha_inicio:fInicio, fecha_vencimiento:fv,
          estado:'activo', observaciones:obsP,
          created_at:Date.now()
          // num_credito se asigna al importar
        });
      }
    });

    // Mostrar preview
    const preview = document.getElementById('import-preview');
    if(!preview) return;

    let html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px">';
    html += '<div style="font-size:13px;font-weight:500;margin-bottom:10px">Vista previa</div>';

    if(errores.length>0){
      html += '<div style="background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:8px;padding:10px;margin-bottom:10px">';
      html += '<div style="font-size:12px;font-weight:500;color:var(--red);margin-bottom:6px">'+errores.length+' error(es):</div>';
      errores.forEach(function(er){ html += '<div style="font-size:11px;color:var(--red)">'+er+'</div>'; });
      html += '</div>';
    }

    if(validosClientes.length>0){
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
      html += '<div style="background:rgba(91,141,238,.1);border:1px solid rgba(91,141,238,.25);border-radius:8px;padding:10px;text-align:center">';
      html += '<div style="font-size:20px;font-weight:500;color:var(--blue)">'+validosClientes.length+'</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">Clientes</div></div>';
      html += '<div style="background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.25);border-radius:8px;padding:10px;text-align:center">';
      html += '<div style="font-size:20px;font-weight:500;color:var(--green)">'+validosPrestamos.length+'</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">Con préstamo</div></div>';
      html += '</div>';

      html += '<div style="max-height:180px;overflow-y:auto;margin-bottom:12px">';
      validosClientes.slice(0,8).forEach(function(c,idx){
        const p = validosPrestamos.find(function(x){ return x.cliente_id===c.id; });
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">';
        html += '<span>'+c.nombre+'</span>';
        html += '<span style="color:'+(p?'var(--green)':'var(--txt3)')+';">'+(p?fmt(p.monto_prestado)+' · '+p.tasa_interes_mensual+'%':'Solo cliente')+'</span>';
        html += '</div>';
      });
      if(validosClientes.length>8) html += '<div style="font-size:11px;color:var(--txt3);padding-top:4px">...y '+(validosClientes.length-8)+' más</div>';
      html += '</div>';

      html += '<button id="btn-confirmar-import" style="width:100%;background:var(--gold);color:#1a1200;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:500;cursor:pointer">Importar '+validosClientes.length+' clientes'+(validosPrestamos.length>0?' + '+validosPrestamos.length+' préstamos':'')+'</button>';
    } else if(errores.length===0){
      html += '<div style="text-align:center;color:var(--txt3);font-size:13px;padding:16px">No se encontraron datos válidos</div>';
    }
    html += '</div>';
    preview.innerHTML = html;

    const btnConf = document.getElementById('btn-confirmar-import');
    if(btnConf){
      btnConf.addEventListener('click', async function(){
        if(this.disabled) return;
        this.disabled = true;
        const btnRef = this;
        const totalOps = validosClientes.length + validosPrestamos.length;
        let hechas = 0, okClientes = 0, okPrestamos = 0;
        const fallos = [];
        const avance = function(){ btnRef.textContent = 'Importando... '+hechas+'/'+totalOps; };
        avance();

        // ── Clientes ──
        const idsCreados = {};
        for(const c of validosClientes){
          const payload = {nombre:c.nombre, telefono:c.telefono||null,
            tipo_cliente:c.tipo_cliente, identificacion:c.identificacion||null,
            observaciones:c.observaciones||null, estado:'activo'};
          try{
            const data = await gsWrite('clientes','create',payload);
            if(!data || !data.id) throw new Error('el servidor no devolvió el id');
            idsCreados[c.id] = data.id;
            okClientes++;
          } catch(e){ fallos.push('Cliente "'+c.nombre+'": '+e.message); }
          hechas++; avance();
        }

        // ── Préstamos: solo si su cliente se creó (antes quedaban huérfanos) ──
        for(const p of validosPrestamos){
          const realId = idsCreados[p.cliente_id];
          if(!realId){
            fallos.push('Préstamo de '+fmt(p.monto_prestado)+': su cliente no se pudo crear');
            hechas++; avance(); continue;
          }
          const payload = {cliente_id:realId,
            monto_prestado:p.monto_prestado, tasa_interes_mensual:p.tasa_interes_mensual,
            frecuencia_cobro:p.frecuencia_cobro, num_cuotas:p.num_cuotas,
            valor_cuota:p.valor_cuota, interes_total:p.interes_total,
            total_a_pagar:p.total_a_pagar, fecha_inicio:p.fecha_inicio,
            fecha_vencimiento:p.fecha_vencimiento, estado:'activo',
            observaciones:p.observaciones||null};
          try{ await gsWrite('prestamos','create',payload); okPrestamos++; }
          catch(e){ fallos.push('Préstamo de '+fmt(p.monto_prestado)+': '+e.message); }
          hechas++; avance();
        }

        await syncData(true);
        navigate('clientes', null, false);
        setTimeout(function(){
          let msg = okClientes+' cliente'+(okClientes!==1?'s':'');
          if(okPrestamos) msg += ' y '+okPrestamos+' préstamo'+(okPrestamos!==1?'s':'');
          msg += ' importados';
          if(fallos.length){
            toastErr(msg+' · '+fallos.length+' con error');
            setTimeout(function(){ alert('No se pudieron importar:\n\n'+fallos.slice(0,15).join('\n')+(fallos.length>15?'\n... y '+(fallos.length-15)+' más':'')); }, 600);
          } else toastOk(msg);
        }, 60);
      });
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// SYNC: Google Sheets ↔ localStorage

let _syncInProgress = false;
let _lastSync = 0;
let _syncIntentos = 0;
const MAX_INTENTOS = 3;

async function syncData(force){
  const ahora = Date.now();
  if(_syncInProgress) return false;                       // el semáforo ahora aplica también a force
  if(!force && (ahora - _lastSync) < 10000) return false;
  if(!navigator.onLine){ _syncEstado.error='offline'; pintarNetbar(); return false; }
  _syncInProgress = true; _syncEstado.cargando = true;
  let exito = false;
  try{
    const data = await gsSyncAll();
    if(!data || typeof data !== 'object') throw new Error('Respuesta vacía del servidor');
    // Nunca vaciar la caché por una respuesta incompleta
    const set = (k, v) => { if(Array.isArray(v)) DB._set(k, v); };
    set('clientes',  data.clientes);
    set('prestamos', data.prestamos);
    set('abonos',    data.abonos);
    set('gastos',    data.gastos);
    set('capital_movimientos', data.capitalMovimientos);
    if(data.capitalDistribucion && typeof data.capitalDistribucion==='object') DB._set('capital_distribucion', data.capitalDistribucion);
    if(Array.isArray(data.cierres)) DB._set('cierres_financieros', data.cierres);
    _lastSync = Date.now(); _syncEstado.ultimo = _lastSync; _syncEstado.error = null; _syncIntentos = 0;
    invalidarCache();
    exito = true;
  } catch(e){
    _syncIntentos++;
    _syncEstado.error = e.message || 'Error de sincronización';
    console.error('Sync error:', e);
  } finally {
    _syncInProgress = false; _syncEstado.cargando = false; pintarNetbar();
  }
  return exito;
}

function hayDatosLocales(){ return DB.clientes().length > 0 || DB.prestamos().length > 0; }

function pantallaCargando(titulo){
  return '<div class="fade-in" style="padding:20px">'+
    '<div class="sk" style="height:26px;width:52%;margin-bottom:18px"></div>'+
    '<div class="sk" style="height:104px;margin-bottom:12px;border-radius:var(--r)"></div>'+
    '<div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div>'+

function pantallaSinDatos(){
  return '<div class="empty" style="padding-top:80px">'+
    '<div style="color:var(--red);display:flex;justify-content:center;margin-bottom:14px">'+ico('wifiOff',48)+'</div>'+
    '<div class="empty-title">No pudimos cargar tus datos</div>'+
    '<div class="empty-sub">'+(navigator.onLine?'El servidor no respondió. Revisa tu conexión e intenta de nuevo.':'Estás sin conexión. Conéctate para descargar tu cartera.')+'</div>'+

async function reintentarCarga(){
  _syncIntentos = 0;
  document.getElementById('screen').innerHTML = pantallaCargando('Reintentando...');
  const ok = await syncData(true);
  if(ok) navigate(currentPage||'dashboard', null, false);
  else document.getElementById('screen').innerHTML = pantallaSinDatos();
}

/** Guarda de carga inicial: sin bucle infinito y con salida clara. */
function necesitaCargaInicial(reintentar){
  if(hayDatosLocales() || _lastSync > 0) return false;
  const screen = document.getElementById('screen');
  if(_syncIntentos >= MAX_INTENTOS || !navigator.onLine){
    if(screen) screen.innerHTML = pantallaSinDatos();
    return true;
  }
  if(screen) screen.innerHTML = pantallaCargando();
  syncData(true).then(function(ok){
    if(ok) reintentar();
    else if(_syncIntentos >= MAX_INTENTOS){ const sc=document.getElementById('screen'); if(sc) sc.innerHTML = pantallaSinDatos(); }
    else setTimeout(reintentar, 1200 * _syncIntentos);   // espera creciente
  });
  return true;
}

async function iniciarApp(){
  pintarNetbar();
  document.getElementById('screen').innerHTML = pantallaCargando();
  const ok = await syncData(true);
  navigate('dashboard', null, false);
  if(ok){ if(colaLeer().length) colaProcesar(); }
  else if(hayDatosLocales()) mostrarToast('Sin conexión — mostrando datos guardados ('+haceCuanto(_syncEstado.ultimo)+')');
  else toastErr('No se pudo conectar con la nube');
}

document.addEventListener('visibilitychange', function(){

function procesarCSVAbonos(file){
  const reader = new FileReader();
  reader.onload = async function(e){
    const text = e.target.result.replace(/^\uFEFF/,'');
    if(!DB.prestamos().length){ await syncData(true); }   // sin préstamos en caché todo fallaría
    const lines = partirFilasCSV(text);
    if(lines.length < 2){ toastErr('El archivo está vacío'); return; }

    const filtradas = limpiarFilasCSV(lines, ['num_credito','monto','fecha_abono']);
    if(!filtradas.length){ toastErr('No se encontró la fila de encabezados'); return; }
    const headerLine = filtradas[0].toLowerCase();
    if(headerLine.indexOf('num_credito') < 0 && headerLine.indexOf('monto') < 0){
      toastErr('La primera fila debe tener los encabezados (num_credito, monto, ...)'); return;
    }
    const sep = detectarSeparador(filtradas[0]);
    const headers = parseFilaCSV(filtradas[0], sep).map(function(h){ return h.replace(/"/g,'').trim().toLowerCase(); });
    const filaReal = function(i){ return lines.indexOf(filtradas[i+1]) + 1; };

    const col = function(n){ return headers.indexOf(n); };
    const iNum   = col('num_credito');
    const iMonto = col('monto');
    const iTipo  = col('tipo_abono');
    const iFecha = col('fecha_abono');
    const iObs   = col('observaciones');

    const clean = function(v){ return (v||'').replace(/^"|"$/g,'').replace(/""/g,'"').trim(); };
    const tiposValidos = ['mixto','capital','interes','total'];
    const prestamos = DB.prestamos();
    const abonosExistentes = DB.abonos();
    const errores = [], validos = [];

    filtradas.slice(1).forEach(function(line, i){
      if(!line.trim()) return;
      const cols = parseFilaCSV(line, sep);
      const nFila = filaReal(i);
      const numCredito = parseInt(clean(cols[iNum>=0?iNum:0]), 10);
      const monto      = parseNum(clean(cols[iMonto>=0?iMonto:2]));
      const tipo       = (clean(cols[iTipo>=0?iTipo:3]) || 'mixto').toLowerCase();
      const fecha      = normFecha(clean(cols[iFecha>=0?iFecha:4])) || today();
      const obs        = clean(cols[iObs>=0?iObs:5]);

      if(!numCredito || isNaN(numCredito)){ errores.push('Fila '+nFila+': número de crédito inválido'); return; }
      if(!isFinite(monto) || monto<=0){ errores.push('Fila '+nFila+': monto inválido ("'+clean(cols[iMonto>=0?iMonto:2])+'")'); return; }
      if(tiposValidos.indexOf(tipo)<0){ errores.push('Fila '+nFila+': tipo_abono debe ser mixto/capital/interes/total'); return; }
      if(fecha > today()){ errores.push('Fila '+nFila+': la fecha es futura'); return; }

      const prestamo = prestamos.find(function(p){ return Number(p.num_credito) === Number(numCredito); });
      if(!prestamo){ errores.push('Fila '+nFila+': no existe el crédito #'+numCredito); return; }

      const dup = abonosExistentes.find(function(a){
        return a.prestamo_id===prestamo.id && a.fecha_abono===fecha && Math.abs(Number(a.monto)-monto) < 1; });
      if(dup){ errores.push('Fila '+nFila+': ese abono ya existe (#'+numCredito+', '+fmt(monto)+') — omitido'); return; }
      if(validos.some(function(v){ return v.prestamo_id===prestamo.id && v.fecha_abono===fecha && Math.abs(v.monto-monto)<1; })){
        errores.push('Fila '+nFila+': repetido dentro del archivo — omitido'); return; }

      validos.push({ prestamo_id: prestamo.id, num_credito: numCredito, monto, tipo_abono:tipo, fecha_abono:fecha, observaciones:obs });
    });

    // Mostrar preview
    const preview = document.getElementById('abonos-import-preview');
    if(!preview) return;
    let html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px">';
    html += '<div style="font-size:13px;font-weight:500;margin-bottom:10px">Vista previa</div>';

    if(errores.length > 0){
      html += '<div style="background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:8px;padding:10px;margin-bottom:10px">';
      html += '<div style="font-size:12px;font-weight:500;color:var(--red);margin-bottom:6px">'+errores.length+' error(es):</div>';
      errores.forEach(function(er){ html += '<div style="font-size:11px;color:var(--red)">'+er+'</div>'; });
      html += '</div>';
    }

    if(validos.length > 0){
      html += '<div style="font-size:12px;color:var(--green);margin-bottom:10px">'+validos.length+' abono(s) listos para importar</div>';
      html += '<div style="max-height:180px;overflow-y:auto;margin-bottom:12px">';
      validos.slice(0,8).forEach(function(a){
        const p = prestamos.find(function(x){ return x.id===a.prestamo_id; });
        const c = DB.clientes().find(function(x){ return x.id===p?.cliente_id; });
        html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">';
        html += '<span>Cred #'+a.num_credito+' · '+(c?c.nombre:'—')+'</span>';
        html += '<span style="color:var(--green)">+'+fmt(a.monto)+' ('+a.tipo_abono+')</span></div>';
      });
      if(validos.length > 8) html += '<div style="font-size:11px;color:var(--txt3);padding-top:4px">...y '+(validos.length-8)+' más</div>';
      html += '</div>';
      html += '<button id="btn-confirmar-import-abonos" style="width:100%;background:var(--gold);color:#1a1200;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:500;cursor:pointer">Importar '+validos.length+' abonos</button>';
    }
    html += '</div>';
    preview.innerHTML = html;

    const btnC = document.getElementById('btn-confirmar-import-abonos');
    if(btnC){
      btnC.addEventListener('click', async function(){
        this.disabled=true; this.textContent='Importando...';
        let ok=0, err=0;
        for(let i=0; i<validos.length; i++){
          const a = validos[i];
          try{
            await gsWrite('abonos','create',{
              prestamo_id:a.prestamo_id, monto:a.monto, tipo_abono:a.tipo_abono,
              fecha_abono:a.fecha_abono, observaciones:a.observaciones||null
            });
            ok++;
          } catch(e){ err++; console.error(e.message); }
        }
        await syncData(true);
        
        navigate('prestamos',null,false);
        setTimeout(function(){ mostrarToast(''+ok+' abonos importados'+(err>0?' ('+err+' errores)':'')); },50);
      });
    }
  };
  reader.readAsText(file,'UTF-8');
}

async function confirmarEliminarCliente(clienteId){
  const c = DB.clientes().find(function(x){ return x.id===clienteId; });
  const ps = DB.prestamos().filter(function(p){ return p.cliente_id===clienteId; });
  const activos = ps.filter(function(p){ return ['activo','mora'].includes(estadoPrestamo(p)); });

  if(activos.length > 0){
    mostrarToast('No puedes eliminar: este cliente tiene '+activos.length+' préstamo(s) activo(s)');
    return;
  }

  const msg = ps.length > 0
    ? '¿Eliminar a "'+c.nombre+'"?\n\nTiene '+ps.length+' préstamo(s) pagado(s) en el historial.\nEl historial se conservará pero el cliente quedará inactivo.': '¿Eliminar a "'+c.nombre+'"?\n\nEsta acción marcará el cliente como eliminado.';

  if(!confirm(msg)) return;

  try{
    await gsWrite('clientes','update',{id:clienteId, estado:'inactivo', updated_at:new Date().toISOString()});
    await syncData(true);
  } catch(e){ mostrarToast('Error al eliminar: '+e.message); return; }
  
  navigate('clientes', null, false);
  setTimeout(function(){ mostrarToast('Cliente eliminado: '+c.nombre); }, 50);
}

function calcProyeccion(){
  const monto   = parseFloat(document.getElementById('proj-monto')?.value)||0;
  const tasa    = parseFloat(document.getElementById('proj-tasa')?.value)||0;
  const cuotas  = parseInt(document.getElementById('proj-cuotas')?.value)||1;
  const freq    = parseInt(document.getElementById('proj-freq')?.value)||30;
  const fechaIni = document.getElementById('proj-fecha')?.value || today();
  const prev    = document.getElementById('proj-preview');
  if(!prev) return;
  if(monto <= 0 || tasa <= 0){ prev.style.display='none'; return; }

  const calc = calcPrestamo(monto, tasa, cuotas, freq);
  const freqLabel = freq===30?'mes':freq===15?'quincena':'semana';

  // Calcular fecha de cada cuota
  function fechaCuota(n){
    const d = new Date(fechaIni+'T12:00:00');
    d.setDate(d.getDate() + freq * n);
    return d;
  }

  // Tabla de cuotas con fechas
  let tablaHTML = '';
  for(let i=1; i<=cuotas; i++){
    const fc = fechaCuota(i);
    const fechaStr = fc.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
    tablaHTML +=
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px">' +
        '<div>' +
          '<span style="color:var(--txt2);font-weight:500">Cuota '+i+'</span>' +
          '<span style="color:var(--txt3);margin-left:8px">'+fechaStr+'</span>' +
        '</div>' +
        '<span style="color:var(--green);font-weight:500">'+fmt(calc.valorCuota)+'</span>' +
      '</div>';
  }

  // Fecha de vencimiento final
  const fechaVence = fechaCuota(cuotas).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});

  prev.style.display = 'block';
  prev.innerHTML =
    '<div style="font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Resumen de la proyección</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;text-align:center">' +
      '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Valor cuota</div><div style="font-size:14px;font-weight:500;color:var(--green)">'+fmt(calc.valorCuota)+'</div></div>' +
      '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Interés total</div><div style="font-size:14px;font-weight:500;color:var(--gold)">'+fmt(calc.intTotal)+'</div></div>' +
      '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Total a pagar</div><div style="font-size:14px;font-weight:500">'+fmt(calc.total)+'</div></div>' +
    '</div>' +
    '<div style="font-size:11px;color:var(--txt3);margin-bottom:8px;text-align:center">Vencimiento final: <strong style="color:var(--txt2)">'+fechaVence+'</strong></div>' +
    '<div style="font-size:11px;color:var(--txt3);margin-bottom:6px;font-weight:500">Plan de pagos:</div>' +
    tablaHTML;
}

function enviarProyeccionWsp(){
  const monto   = parseFloat(document.getElementById('proj-monto')?.value)||0;
  const tasa    = parseFloat(document.getElementById('proj-tasa')?.value)||0;
  const cuotas  = parseInt(document.getElementById('proj-cuotas')?.value)||1;
  const freq    = parseInt(document.getElementById('proj-freq')?.value)||30;
  const fechaIni = document.getElementById('proj-fecha')?.value || today();
  const nombre  = document.getElementById('proj-nombre')?.value.trim()||'';
  const cel     = document.getElementById('proj-cel')?.value.trim()||'';

  if(monto <= 0 || tasa <= 0){ mostrarToast('Ingresa monto y tasa'); return; }

  const calc = calcPrestamo(monto, tasa, cuotas, freq);
  const freqLabel = freq===30?'mensual':freq===15?'quincenal':'semanal';

  let msg = nombre ? 'Hola '+nombre+',\n\n' : 'Hola,\n\n';
  msg += '*Proyección de préstamo*\n';
  msg += '--------------------\n';
  const fechaIniStr = new Date(fechaIni+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});
  msg += '• Capital: ' + fmt(monto) + '\n';
  msg += '• Tasa: ' + tasa + '% mensual\n';
  msg += '• Fecha de inicio: ' + fechaIniStr + '\n';
  msg += '• Plazo: ' + cuotas + ' cuota' + (cuotas>1?'s':'') + ' ' + freqLabel + (cuotas>1?'s':'') + '\n';
  msg += '• Valor por cuota: *' + fmt(calc.valorCuota) + '*\n';
  msg += '• Interés total: ' + fmt(calc.intTotal) + '\n';
  msg += '• Total a pagar: *' + fmt(calc.total) + '*\n\n';

  // Calcular fechas de cuotas
  function fechaCuotaWsp(n){
    const d = new Date(fechaIni+'T12:00:00');
    d.setDate(d.getDate() + freq * n);
    return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
  }

  msg += '*Plan de pagos:*\n';
  for(let i=1; i<=cuotas; i++){
    msg += 'Cuota '+i+' · '+fechaCuotaWsp(i)+': *'+fmt(calc.valorCuota)+'*\n';
  }
  msg += '\n';

  msg += 'Cualquier duda puedes comunicarte conmigo. Feliz Dia!';

  if(cel){
    const url = 'https://wa.me/'+cel.replace(/\D/g,'')+'?text='+encodeURIComponent(msg);
    window.open(url,'_blank');
  } else {
    // Copiar al portapapeles
    navigator.clipboard?.writeText(msg).then(function(){
      mostrarToast('Proyección copiada — pégala en WhatsApp');
    }).catch(function(){
      mostrarToast('Agrega un número para enviar por WhatsApp');
    });
  }
  const _ov=document.getElementById('overlay'); const _dr=document.getElementById('drawer');
  if(_ov){_ov.classList.remove('show');_ov.style.pointerEvents='none';_ov.style.opacity='0';}
  if(_dr) _dr.classList.remove('show');
}

  y += 3;
  pdfCajaSaldo(doc, y, 'Valor por cuota', fmt(calc.valorCuota));

  const blob = doc.output('blob');

// HELPER: métricas de un período específico
// ═══════════════════════════════════════
function calcMetricasPeriodo(fechaDesde, fechaHasta){
  // fechaDesde y fechaHasta son strings AAAA-MM-DD
  const ps       = DB.prestamos();
  const clientes = DB.clientes();
  const abonos   = DB.abonos();
  const gastos   = DB.gastos();
  const cap      = capitalDisponible();

  // Abonos del período
  const abonosPeriodo = abonos.filter(function(a){
    return a.fecha_abono >= fechaDesde && a.fecha_abono <= fechaHasta;
  });
  const cobradoPeriodo = abonosPeriodo.reduce(function(s,a){ return s+a.monto; },0);

  // Intereses cobrados del período (abonos - capital recuperado en pagos totales)
  // Aproximación: de préstamos que se pagaron en el período
  let interesesPeriodo = 0;
  ps.forEach(function(p){
    const abonosP = abonos.filter(function(a){ return a.prestamo_id===p.id && a.fecha_abono>=fechaDesde && a.fecha_abono<=fechaHasta; });
    const montoAb = abonosP.reduce(function(s,a){ return s+a.monto; },0);
    // Interés proporcional al abono
    if(p.total_a_pagar > 0 && p.monto_prestado > 0){
      const pctInteres = (p.interes_total||0) / p.total_a_pagar;
      interesesPeriodo += montoAb * pctInteres;
    }
  });

  // Gastos del período
  const gastosPeriodo = gastos.filter(function(g){
    return g.fecha >= fechaDesde && g.fecha <= fechaHasta;
  }).reduce(function(s,g){ return s+g.monto; },0);

  // Nuevos préstamos del período
  const prestadoPeriodo = ps.filter(function(p){
    return p.fecha_inicio >= fechaDesde && p.fecha_inicio <= fechaHasta;
  }).reduce(function(s,p){ return s+p.monto_prestado; },0);

  const countNuevosPrestamos = ps.filter(function(p){
    return p.fecha_inicio >= fechaDesde && p.fecha_inicio <= fechaHasta;
  }).length;

  // Estado actual de la cartera
  const activos = ps.filter(function(p){ return estadoPrestamo(p)==='activo'; });
  const enMora  = ps.filter(function(p){ return estadoPrestamo(p)==='mora'; });
  const capitalEnCalle = activos.concat(enMora).reduce(function(s,p){ return s+p.monto_prestado; },0);
  const clientesActivos = new Set(activos.concat(enMora).map(function(p){ return p.cliente_id; })).size;
  const pctMora = capitalEnCalle>0 ? ((enMora.reduce(function(s,p){ return s+saldoPrestamo(p);},0)/capitalEnCalle)*100).toFixed(1) : 0;
  const roiPeriodo = capitalEnCalle>0 ? ((interesesPeriodo/capitalEnCalle)*100).toFixed(1) : 0;
  const utilidadNeta = interesesPeriodo - gastosPeriodo;

  return {
    fechaDesde, fechaHasta,
    cobradoPeriodo,
    interesesPeriodo: Math.round(interesesPeriodo),
    gastosPeriodo,
    prestadoPeriodo,
    countNuevosPrestamos,
    utilidadNeta: Math.round(utilidadNeta),
    roiPeriodo,
    capitalLibreFinal: cap.libre,
    capitalEnCalle,
    capitalTotal: cap.baseCapital,
    clientesActivos,
    countActivo: activos.length,
    countMora: enMora.length,
    pctMora,
    interesesPendientes: Math.round(ps.filter(function(p){return ['activo','mora'].includes(estadoPrestamo(p));}).reduce(function(s,p){return s+((p.interes_total||0)*(saldoPrestamo(p)/(p.total_a_pagar||1)));},0))
  };
}

function calcProyeccionFinanciera(meses){
  const ps      = DB.prestamos();
  const clientes= DB.clientes();
  const hoy     = new Date();
  const hoySt   = today();
  const resultado = [];

  for(let m=0; m<meses; m++){
    const fechaIni = new Date(hoy.getFullYear(), hoy.getMonth()+m, 1);
    const fechaFin = new Date(hoy.getFullYear(), hoy.getMonth()+m+1, 0);
    const isoIni   = fechaIni.toISOString().slice(0,10);
    const isoFin   = fechaFin.toISOString().slice(0,10);
    const mesLabel = fechaIni.toLocaleDateString('es-CO',{month:'short',year:'numeric'});
    const esPasado = isoFin < hoySt;
    const esActual = isoIni <= hoySt && isoFin >= hoySt;

    // Intereses CONFIRMADOS: cuotas de préstamos activos que vencen en este mes
    let intConfirmado = 0;
    let intPendiente  = 0; // de cuotas no pagadas
    const detalleClientes = [];

    ps.filter(function(p){ return ['activo','mora'].includes(estadoPrestamo(p)); })
      .forEach(function(p){
        const cuotas = calcAmortizacion(p);
        const c = clientes.find(function(x){ return x.id===p.cliente_id; });
        let intMes = 0;
        cuotas.forEach(function(cu){
          if(cu.fecha >= isoIni && cu.fecha <= isoFin){
            const intCuota = cu.interes;
            if(cu.pagada){
              intConfirmado += intCuota;
            } else {
              intPendiente  += intCuota;
              intMes        += intCuota;
            }
          }
        });
        if(intMes > 0) detalleClientes.push({nombre:c?c.nombre:'—', interes:intMes, prestamo_id:p.id});
      });

    // Capital proyectado al final del mes
    // = capital actual + cobros confirmados del mes - gastos promedio
    const gastosMesesAnteriores = DB.gastos();
    const promedioGastos3m = (function(){
      let total = 0, count = 0;
      for(let i=1; i<=3; i++){
        const f = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
        const ini = f.toISOString().slice(0,10).slice(0,7);
        const gastosMes = gastosMesesAnteriores.filter(function(g){ return g.fecha.startsWith(ini); })
          .reduce(function(s,g){ return s+g.monto; },0);
        if(gastosMes > 0){ total += gastosMes; count++; }
      }
      return count > 0 ? total/count : 0;
    })();

    resultado.push({
      mes: mesLabel,
      isoIni, isoFin,
      esPasado, esActual,
      intConfirmado,
      intPendiente,
      intTotal: intConfirmado + intPendiente,
      promedioGastos: promedioGastos3m,
      detalleClientes: detalleClientes.sort(function(a,b){ return b.interes-a.interes; })
    });
  }
  return resultado;
}

  const cap   = capitalDisponible();

  const totalPendiente  = datos.reduce(function(s,d){ return s+d.intPendiente; },0);
  const totalProyectado = totalConfirmado + totalPendiente;
  const promedioMes     = totalProyectado / meses;
  const maxInt = Math.max.apply(null, datos.map(function(d){ return d.intTotal; })) || 1;

  // ── KPIs ───────────────────────────────────────────────────
  let html =
    '<div style="padding:4px 20px 0">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
      '<span class="section-title">Horizonte</span>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="chip ' + (meses===6?'active':'')  + '" id="btn-proj-6">6 meses</button>' +
        '<button class="chip ' + (meses===12?'active':'') + '" id="btn-proj-12">12 meses</button>' +
      '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">' +
      '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:10px;text-align:center">' +
        '<div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Total ' + meses + ' meses</div>' +
        '<div style="font-size:18px;font-weight:500;color:var(--gold)">' + fmt(totalProyectado) + '</div>' +
      '</div>' +
      '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:10px;text-align:center">' +
        '<div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Promedio/mes</div>' +
        '<div style="font-size:18px;font-weight:500;color:var(--green)">' + fmt(promedioMes) + '</div>' +
      '</div>' +
    '</div>' +

    // ── Barras por mes ─────────────────────────────────────
    '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px">' +
      '<div style="font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">Intereses proyectados por mes</div>';

  datos.forEach(function(d){
    const pct = Math.round((d.intTotal / maxInt) * 100);
    const pctConf = d.intTotal > 0 ? Math.round((d.intConfirmado/d.intTotal)*100) : 0;
    const color = d.esPasado ? 'var(--txt3)' : d.esActual ? 'var(--green)' : 'var(--amber)';
    const etiqueta = d.esPasado ? 'pasado' : d.esActual ? 'actual' : 'proyectado';

    html +=
      '<div style="margin-bottom:10px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:4px">' +
          '<span style="font-size:12px;color:' + (d.esActual?'var(--txt)':'var(--txt2)') + ';font-weight:' + (d.esActual?'500':'400') + '">' + d.mes + '</span>' +
          '<span style="font-size:12px;font-weight:500;color:' + color + '">' + fmt(d.intTotal) + '</span>' +
        '</div>' +
        '<div style="background:var(--bg3);border-radius:4px;height:8px;overflow:hidden">' +
          '<div style="height:100%;width:' + pct + '%;background:' + color + ';border-radius:4px;opacity:' + (d.esPasado?'.4':'.9') + '"></div>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--txt3);margin-top:2px">' + etiqueta + (d.intConfirmado>0?' · confirmado: '+fmt(d.intConfirmado):'') + '</div>' +
      '</div>';
  });

  // ── Leyenda ────────────────────────────────────────────
  html +=
    '<div style="display:flex;gap:12px;margin-top:4px;flex-wrap:wrap">' +
      '<div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--green)"></div><span style="font-size:11px;color:var(--txt3)">Mes actual</span></div>' +
      '<div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--amber)"></div><span style="font-size:11px;color:var(--txt3)">Proyectado</span></div>' +
    '</div>' +
    '</div>';

  // ── Detalle por cliente (mes actual y siguiente) ───────
  const mesActualDetalle = datos.find(function(d){ return d.esActual; });
  if(mesActualDetalle && mesActualDetalle.detalleClientes.length > 0){
    html +=
      '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px">' +
        '<div style="font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Interés pendiente por cobrar — ' + mesActualDetalle.mes + '</div>';
    mesActualDetalle.detalleClientes.forEach(function(dc){
      html +=
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="navigate(\'prestamo-detalle\',\''+dc.prestamo_id+'\')">' +
          '<div style="font-size:13px;font-weight:500">' + dc.nombre + '</div>' +
          '<div style="font-size:13px;font-weight:500;color:var(--amber)">' + fmt(dc.interes) + '</div>' +
        '</div>';
    });
    html += '</div>';
  }

  html += '</div>'; // padding wrapper
  return html;
}

</script>
</body>
</html>
