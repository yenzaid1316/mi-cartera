<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cartera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;
  --bg2:#1a1a1a;
  --bg3:#242424;
  --bg4:#2e2e2e;
  --border:#333;
  --border2:#444;
  --txt:#f0ede8;
  --txt2:#c8c2bb;
  --txt3:#9a948d;
  --gold:#c9a96e;
  --gold2:#e8c99a;
  --green:#4caf7d;
  --green2:#2d7a52;
  --red:#e05c5c;
  --red2:#a03030;
  --amber:#d4a017;
  --blue:#5b8dee;
  --r:12px;
  --r2:8px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--txt);font-size:16px;min-height:100dvherflow-x:hidden}
h1,h2,h3{font-weight:400}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;position:relative}
#screen{flex:1;overflow-y:auto;padding-bottom:80px}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(6,1fr);z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;background:none;border:none;color:var(--txt3);cursor:pointer;transition:color .2s;font-size:11px;font-family:'DM Sans',sans-serif}
.nav-btn svg{width:22px;height:22px;stroke-width:1.6}
.nav-btn.active{color:var(--gold)}
.nav-btn.active svg{stroke:var(--gold)}

/* ── HEADER ── */
.page-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.page-title{font-size:26px;line-height:1.1}
.page-subtitle{font-size:14px;color:var(--txt2);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi-label{font-size:12px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi-value{font-size:24px;line-height:1}
.kpi-sub{font-size:12px;color:var(--txt2);margin-top:4px}
.kpi.gold{border-color:rgba(201,169,110,.3);background:rgba(201,169,110,.06)}
.kpi.green{border-color:rgba(76,175,125,.3);background:rgba(76,175,125,.06)}
.kpi.red{border-color:rgba(224,92,92,.3);background:rgba(224,92,92,.06)}
.kpi.amber{border-color:rgba(212,160,23,.3);background:rgba(212,160,23,.06)}

/* ── SECTIONS ── */
.section{padding:0 20px;margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:13px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r2);cursor:pointer;font-size:15px;font-weight:500;transition:all .15s;padding:13px 20px}
.btn-primary{background:var(--gold);color:#1a1200}
.btn-primary:active{background:var(--gold2);transform:scale(.97)}
.btn-secondary{background:var(--bg3);color:var(--txt);border:1px solid var(--border2)}
.btn-secondary:active{background:var(--bg4);transform:scale(.97)}
.btn-danger{background:rgba(224,92,92,.15);color:var(--red);border:1px solid rgba(224,92,92,.3)}
.btn-success{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.3)}
.btn-full{width:100%;padding:14px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--txt2)}

/* ── FAB ── */
.fab{position:fixed;right:20px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#1a1200;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(201,169,110,.4);z-index:99;transition:all .2s}
.fab:active{transform:scale(.93)}
.fab svg{width:24px;height:24px;stroke-width:2.2}

/* ── LISTA ITEMS ── */
.item-list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:12px}
.item:active{border-color:var(--border2);background:var(--bg3)}
.item-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold);flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-detail{font-size:13px;color:var(--txt2);margin-top:2px}
.item-right{text-align:right;flex-shrink:0}
.item-amount{font-size:15px;font-weight:500}
.item-status{font-size:12px;margin-top:3px}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500}
.badge-green{background:rgba(76,175,125,.15);color:var(--green)}
.badge-red{background:rgba(224,92,92,.15);color:var(--red)}
.badge-amber{background:rgba(212,160,23,.15);color:var(--amber)}
.badge-blue{background:rgba(91,141,238,.15);color:var(--blue)}
.badge-gray{background:var(--bg3);color:var(--txt2)}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--txt);font-size:16px;padding:13px 14px;transition:border-color .15s;-webkit-appearance:none}
.form-input:focus{outline:none;border-color:var(--gold)}
.form-input::placeholder{color:var(--txt3)}
select.form-input{cursor:pointer}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--txt3);margin-top:4px}

/* ── MODAL / DRAWER ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;opacity:0;pointer-events:none!important;transition:opacity .25s;backdrop-filter:blur(4px)}
.overlay.show{opacity:1;pointer-events:all!important}
.drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--bg2);border-radius:20px 20px 0 0;z-index:201;transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;padding-bottom:24px}
.drawer.show{transform:translateX(-50%) translateY(0)}
.drawer-handle{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:12px auto 4px}
.drawer-title{font-size:24px;padding:8px 20px 16px}
.drawer-body{padding:0 20px}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:16px 0}

/* ── SEARCH ── */
.search-bar{position:relative;margin:12px 20px}
.search-bar input{padding-left:40px;background:var(--bg3);border:1px solid var(--border)}
.search-bar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--txt3)}

/* ── CAPITAL BANNER ── */
.capital-banner{margin:16px 20px 0;background:linear-gradient(135deg,rgba(201,169,110,.12),rgba(201,169,110,.04));border:1px solid rgba(201,169,110,.25);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.capital-label{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.capital-amount{font-size:30px;color:var(--gold2)}

/* ── DETAIL PAGE ── */
.detail-hero{padding:20px;background:var(--bg2);border-bottom:1px solid var(--border);margin-bottom:16px}
.detail-name{font-size:28px;margin-bottom:4px}
.detail-meta{font-size:13px;color:var(--txt2)}

/* ── TOGGLE ── */
.toggle-group{display:flex;background:var(--bg3);border-radius:var(--r2);padding:3px;gap:2px;margin-bottom:16px}
.toggle-btn{flex:1;padding:8px;border:none;border-radius:6px;background:none;color:var(--txt2);font-size:14px;cursor:pointer;transition:all .15s}
.toggle-btn.active{background:var(--bg2);color:var(--txt);border:1px solid var(--border2)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 24px}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;opacity:.3}
.empty-title{font-size:17px;color:var(--txt2);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--txt3)}

/* ── ALERT ── */
.alert{border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;font-size:13px}
.alert-red{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.25);color:var(--red)}
.alert-green{background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.25);color:var(--green)}
.alert-amber{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.25);color:var(--amber)}

/* ── MOVIMIENTO ITEM ── */
.mov-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.mov-item:last-child{border-bottom:none}
.mov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mov-dot.green{background:var(--green)}
.mov-dot.red{background:var(--red)}
.mov-dot.amber{background:var(--amber)}
.mov-info{flex:1}
.mov-desc{font-size:14px;font-weight:500}
.mov-date{font-size:12px;color:var(--txt3);margin-top:1px}
.mov-monto{font-size:14px;font-weight:500}

/* ── ANIMACIONES ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease forwards}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:0}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── NUMERIC DISPLAY ── */
.num-big{font-family:'DM Serif Display',serif}
</style>
</head>

  <div id="screen"></div>
  <nav id="navbar">
    <button class="nav-btn active" onclick="navigate('dashboard')" id="nav-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

<script>
// ═══════════════════════════════════════
// GOOGLE SHEETS BACKEND (Apps Script)
// ═══════════════════════════════════════
const GS_URL = "https://script.google.com/macros/s/AKfycbzggkYkCi4PACSwZzgFomADEpkdMkoNWu9OBA62EoT84wiY3gL0wW_U-KGDX9-qSgHj2Q/exec";
const GS_SECRET = "Ymls1316*";
let _supabase = true; // bandera "nube activa" — se conserva el nombre para no tocar el resto del código

async function gsSyncAll(){
  const res = await fetch(GS_URL + '?secret=' + encodeURIComponent(GS_SECRET) + '&action=syncAll');
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error de sincronización');
  return json.data;
}

async function gsWrite(table, action, data){
  const res = await fetch(GS_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS en Apps Script
    body: JSON.stringify({secret:GS_SECRET, table, action, data})
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Error al guardar');
  return json.data;
}

// ═══════════════════════════════════════
// STORAGE — Google Sheets vía Apps Script (con caché local)
// ═══════════════════════════════════════
const DB = {
  // ── LocalStorage helpers (caché) ──────────────────
  _get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } },
  _set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },

  // ── CLIENTES ─────────────────────────────────────────────────
  async getClientes(){ return this._get('clientes')||[]; },
  async saveCliente(c){
    try{
      const esNuevo = !c.id || c._nuevo;
      const payload = {...c}; delete payload._nuevo;
      const data = esNuevo
        ? await gsWrite('clientes','create',payload)
        : await gsWrite('clientes','update',payload);
      await syncData(true);
      return data;
    } catch(e){ console.error(e); mostrarToast('❌ '+e.message); return null; }
  },
  _localSaveCliente(c){
    const lista = this._get('clientes')||[];
    if(c.id && !c._nuevo){ const i=lista.findIndex(x=>x.id===c.id); if(i>=0) lista[i]=c; }
    else { c.id=uid(); c.created_at=new Date().toISOString(); lista.push(c); }
    this._set('clientes',lista); return c;
  },

  // ── PRÉSTAMOS ────────────────────────────────────────────────
  async getPrestamos(){ return this._get('prestamos')||[]; },
  async savePrestamo(p){
    try{
      const payload = {...p}; delete payload.id;
      const data = await gsWrite('prestamos','create',payload);
      await syncData(true);
      return data;
    } catch(e){ console.error(e); mostrarToast('❌ '+e.message); return null; }
  },

  // ── ABONOS ───────────────────────────────────────────────────
  async getAbonos(prestamo_id){
    const all = this._get('abonos')||[];
    return prestamo_id ? all.filter(a=>a.prestamo_id===prestamo_id) : all;
  },
  async getAllAbonos(){ return this._get('abonos')||[]; },
  async saveAbono(a){
    try{
      const payload = {...a}; delete payload.id;
      const data = await gsWrite('abonos','create',payload);
      await syncData(true);
      return data;
    } catch(e){ console.error(e); mostrarToast('❌ '+e.message); return null; }
  },

  // ── GASTOS ───────────────────────────────────────────────────
  async getGastos(){ return this._get('gastos')||[]; },
  async saveGasto(g){
    try{
      const payload = {...g}; delete payload.id;
      const data = await gsWrite('gastos','create',payload);
      await syncData(true);
      return data;
    } catch(e){ console.error(e); mostrarToast('❌ '+e.message); return null; }
  },

  // ── CAPITAL ──────────────────────────────────────────────────
  async getCapital(){ return this._get('capital_movimientos')||[]; },
  async saveCapitalMov(m){
    try{
      const payload = {...m}; delete payload.id;
      const data = await gsWrite('capitalMovimientos','create',payload);
      await syncData(true);
      return data;
    } catch(e){ console.error(e); mostrarToast('❌ '+e.message); return null; }
  },
  distribucion(){ return this._get('capital_distribucion')||{efectivo:0,banco:0,notas:''}; },
  async saveDistribucion(d){
    const current = this.distribucion();
    const payload = {...current, ...d};
    this._set('capital_distribucion', payload);
    try{
      if(payload.id){
        await gsWrite('capitalDistribucion','update', payload);
      } else {
        const created = await gsWrite('capitalDistribucion','create', payload);
        this._set('capital_distribucion', created);
      }
      return true;
    } catch(e){ console.error('Dist save error:', e); return false; }
  },

  // ── COMPAT: sync helpers para código existente ───────────────
  clientes(){ return this._get('clientes')||[]; },
  prestamos(){ return this._get('prestamos')||[]; },
  abonos(){ return this._get('abonos')||[]; },
  gastos(){ return this._get('gastos')||[]; },
  capital(){ return this._get('capital_movimientos')||[]; },
  saveClientes(d){ return this._set('clientes',d); },
  savePrestamos(d){ return this._set('prestamos',d); },
  saveAbonos(d){ return this._set('abonos',d); },
  saveGastos(d){ return this._set('gastos',d); },
  saveCapital(d){ return this._set('capital_movimientos',d); },

  // ── CIERRES ──────────────────────────────────────────────
  cierres(){ return this._get('cierres_financieros')||[]; },
  saveCierres(d){ return this._set('cierres_financieros',d); },

  test(){
    try{ localStorage.setItem('_test','1'); localStorage.removeItem('_test'); return true; }
    catch(e){ return false; }
  }
};

// ═══════════════════════════════════════
// SESIÓN — app de un solo usuario, sin login
// ═══════════════════════════════════════
let _sesion = {user:{id:'local',email:'ydelarosa@argos.com.co'}, perfil:{rol:'admin',nombre:'Yenzaid',activo:true}};

async function cargarSesion(){ return _sesion; }

function puedoEscribir(){ return true; }
function soyAdmin(){ return true; }
function nombreUsuario(){ return _sesion.perfil.nombre; }

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}):'—';
const today=()=>new Date().toISOString().slice(0,10);
const diffDays=(a,b)=>Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
const initials=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

function nextNumPrestamo(){
  const ps = DB.prestamos();
  if(ps.length === 0) return 1;
  const nums = ps.map(function(p){ return p.num_credito||0; });
  return Math.max.apply(null, nums) + 1;
}

function calcPrestamo(monto, tasa, cuotas, frecDias){
  // frecDias: días por cuota (7=semanal, 15=quincenal, 30=mensual)
  // Si no se pasa frecDias, se asume mensual (30 días)
  const freq = frecDias || 30;
  // Interés proporcional al período de cada cuota
  const intPorCuota  = monto * (tasa/100) * (freq/30);
  const intTotal     = intPorCuota * cuotas;
  const total        = monto + intTotal;
  const valorCuota   = total / cuotas;
  const intMensual   = monto * (tasa/100); // referencia mensual (para mostrar)
  return {intMensual, intPorCuota, intTotal, total, valorCuota};
}

function estadoPrestamo(p){
  const hoy = today();
  if(p.estado === 'pagado') return 'pagado';
  if(p.estado === 'anulado') return 'anulado';
  const abonos = DB.abonos().filter(a=>a.prestamo_id===p.id);
  const totalAbonado = abonos.reduce((s,a)=>s+a.monto,0);
  if(totalAbonado >= p.total_a_pagar) return 'pagado';
  if(hoy > p.fecha_vencimiento) return 'mora';
  return 'activo';
}

function saldoPrestamo(p){
  const abonos = DB.abonos().filter(a=>a.prestamo_id===p.id);
  const totalAbonado = abonos.reduce((s,a)=>s+a.monto,0);
  return Math.max(0, p.total_a_pagar - totalAbonado);
}

function capitalDisponible(){
  const movs = DB.capital();
  const totalInyectado = movs.reduce((s,m)=>m.tipo==='retiro'?s-m.monto:s+m.monto, 0);
  const prestado = DB.prestamos()
    .filter(p=>estadoPrestamo(p)==='activo'||estadoPrestamo(p)==='mora')
    .reduce((s,p)=>s+p.monto_prestado, 0);
  const gastosTotal = DB.gastos().reduce((s,g)=>s+g.monto, 0);
  // Intereses cobrados = todos los abonos - capital recuperado de préstamos pagados
  // Forma simple: suma de (abonos totales - capital prestado) de préstamos pagados
  const interesesCobrados = DB.prestamos()
    .filter(p=>estadoPrestamo(p)==='pagado')
    .reduce((s,p)=>{
      const abonado = DB.abonos().filter(a=>a.prestamo_id===p.id).reduce((t,a)=>t+a.monto,0);
      const interes = Math.max(0, abonado - p.monto_prestado);
      return s + interes;
    }, 0);
  const baseCapital = totalInyectado + interesesCobrados;
  const libre = Math.max(0, baseCapital - prestado - gastosTotal);
  const pctUtilizado = baseCapital>0 ? Math.round((prestado/baseCapital)*100) : 0;
  return {total:totalInyectado, interesesCobrados, baseCapital, prestado, gastosTotal, libre, pctUtilizado};
}

function resumenCartera(){
  const ps = DB.prestamos();
  const clientes = DB.clientes();
  const todosAbonos = DB.abonos();
  let capitalActivo=0, capitalMora=0, interesesCausados=0, interesesPendientes=0;
  let countActivo=0, countMora=0, countPagado=0, totalPrestado=0, totalRecuperado=0;

  // Mes actual
  const ahora = new Date();
  const mesActual = ahora.getMonth();
  const anioActual = ahora.getFullYear();

  let interesesMes=0, abonosMes=0;

  ps.forEach(p=>{
    const est = estadoPrestamo(p);
    const saldo = saldoPrestamo(p);
    const abonosP = todosAbonos.filter(a=>a.prestamo_id===p.id);
    const totalAb = abonosP.reduce((s,a)=>s+a.monto,0);
    totalPrestado += p.monto_prestado;
    totalRecuperado += totalAb;
    if(est==='activo'){capitalActivo+=p.monto_prestado;countActivo++;}
    if(est==='mora'){capitalMora+=saldo;countMora++;}
    if(est==='pagado'){countPagado++;interesesCausados+=p.interes_total||0;}
    else{interesesPendientes+=(p.interes_total||0)*(saldo/p.total_a_pagar);}
    // abonos del mes
    abonosP.forEach(a=>{
      const fa = new Date(a.fecha_abono+'T12:00:00');
      if(fa.getMonth()===mesActual && fa.getFullYear()===anioActual){
        abonosMes += a.monto;
      }
    });
  });

  const gastosTotal = DB.gastos().reduce((s,g)=>s+g.monto,0);
  const gastosMes = DB.gastos().filter(g=>{
    const fg = new Date(g.fecha+'T12:00:00');
    return fg.getMonth()===mesActual && fg.getFullYear()===anioActual;
  }).reduce((s,g)=>s+g.monto,0);

  const utilidadNeta = interesesCausados - gastosTotal;
  const utilidadMes = abonosMes - gastosMes;
  const pctMora = (capitalActivo+capitalMora)>0 ? ((capitalMora/(capitalActivo+capitalMora))*100).toFixed(1) : 0;
  const tasaRecuperacion = totalPrestado>0 ? Math.round((totalRecuperado/totalPrestado)*100) : 0;
  const roi = (capitalActivo+capitalMora)>0 ? ((interesesCausados/(capitalActivo+capitalMora))*100).toFixed(1) : 0;

  // Top 3 deudores
  const saldosPorCliente = {};
  ps.filter(p=>['activo','mora'].includes(estadoPrestamo(p))).forEach(p=>{
    saldosPorCliente[p.cliente_id] = (saldosPorCliente[p.cliente_id]||0) + saldoPrestamo(p);
  });
  const top3 = Object.entries(saldosPorCliente)
    .sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([cid,saldo])=>({nombre:clientes.find(c=>c.id===cid)?.nombre||'—',saldo}));

  // Mejor pagador del mes (más abonos en el mes)
  const abonosPorCliente = {};
  todosAbonos.forEach(a=>{
    const fa = new Date(a.fecha_abono+'T12:00:00');
    if(fa.getMonth()===mesActual && fa.getFullYear()===anioActual){
      const p = ps.find(x=>x.id===a.prestamo_id);
      if(p){abonosPorCliente[p.cliente_id]=(abonosPorCliente[p.cliente_id]||0)+a.monto;}
    }
  });
  const mejorPagador = Object.entries(abonosPorCliente).sort((a,b)=>b[1]-a[1])[0];
  const mejorPagadorNombre = mejorPagador ? clientes.find(c=>c.id===mejorPagador[0])?.nombre||'—' : null;
  const mejorPagadorMonto = mejorPagador ? mejorPagador[1] : 0;

  // Vencen próximos 7 días
  const proximos7 = ps.filter(p=>{
    if(estadoPrestamo(p)!=='activo') return false;
    const d = diffDays(today(), p.fecha_vencimiento);
    return d>=0 && d<=7;
  });

  // Clientes activos (con préstamo vivo)
  const clientesActivos = new Set(ps.filter(p=>['activo','mora'].includes(estadoPrestamo(p))).map(p=>p.cliente_id)).size;

  return {
    capitalActivo,capitalMora,interesesCausados,interesesPendientes,
    countActivo,countMora,countPagado,
    gastosTotal,gastosMes,utilidadNeta,utilidadMes,
    pctMora,tasaRecuperacion,roi,
    totalPrestado,totalRecuperado,
    top3,mejorPagadorNombre,mejorPagadorMonto,
    proximos7,clientesActivos,abonosMes
  };
}

let currentPage = 'dashboard';
let pageHistory = [];

function navigate(page, data=null, pushHistory=true){
  if(pushHistory && currentPage !== page) pageHistory.push(currentPage);
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+page.split('-')[0]);
  if(nb) nb.classList.add('active');
  const screen = document.getElementById('screen');
  screen.scrollTop = 0;
  // Sincronizar datos desde Supabase antes de renderizar (no bloquea)
  syncData(false);
  // Conectar btn-sync-manual si existe
  setTimeout(function(){
    const btnSync = document.getElementById('btn-sync-manual');
    if(btnSync && !btnSync._syncListener){
      btnSync._syncListener = true;
      btnSync.addEventListener('click', async function(){
        const svg = this.querySelector('svg');
        if(svg) svg.style.animation='spin 1s linear infinite';
        await syncData(true);
        if(svg) svg.style.animation='';
        navigate(currentPage, null, false);
        mostrarToast('✅ Datos actualizados');
      });
    }
  }, 100);

  const pages = {
    dashboard: renderDashboard,
    clientes: renderClientes,
    prestamos: renderPrestamos,
    capital: renderCapital,
    gastos: renderGastos,
    flujo: renderFlujoCaja,
    recordatorios: renderRecordatorios,
    movimientos: renderMovimientos,
    importar: renderImportarClientes,
    importar_abonos: renderImportarAbonos,
    cierres: renderCierres,
  };

  if(page === 'cliente-detalle') renderClienteDetalle(data);
  else if(page === 'prestamo-detalle') renderPrestamoDetalle(data);
  else if(page === 'nuevo-cliente') renderFormCliente(null);
  else if(page === 'editar-cliente') renderFormCliente(data);
  else if(page === 'editar-prestamo') renderFormPrestamo(data);
  else if(pages[page]) pages[page]();
}

function goBack(){
  const prev = pageHistory.pop();
  if(prev) navigate(prev, null, false);
}

function buildClientesList(query){
  // Solo construye y retorna el HTML de la lista — no toca el input
  // Filtrar clientes eliminados (estado inactivo)
  let clientes = DB.clientes().filter(function(c){ return c.estado !== 'inactivo'; });
  if(query) clientes = clientes.filter(function(c){
    return c.nombre.toLowerCase().includes(query.toLowerCase()) ||
           (c.telefono||'').includes(query);
  });

  if(clientes.length === 0){
    return '<div class="empty">' +
      '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="1.2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>' +
      '<div class="empty-title">Sin resultados</div>' +
      '<div class="empty-sub">' + (query ? 'Ningún cliente coincide' : 'Toca el botón + para agregar') + '</div>' +
    '</div>';
  }

  let html = '<div class="item-list">';
  clientes.forEach(function(c){
    const ps = DB.prestamos().filter(function(p){ return p.cliente_id===c.id; });
    const activos = ps.filter(function(p){ return ['activo','mora'].includes(estadoPrestamo(p)); });
    const saldoTotal = activos.reduce(function(s,p){ return s+saldoPrestamo(p); },0);
    const hasMora = activos.some(function(p){ return estadoPrestamo(p)==='mora'; });
    const badge = hasMora
      ? '<span class="badge badge-red">Mora</span>'
      : activos.length > 0
        ? '<span class="badge badge-amber">Activo</span>'
        : '<span class="badge badge-gray">Al día</span>';
    html +=
      '<div class="item" data-cid="' + c.id + '">' +
        '<div class="item-avatar">' + initials(c.nombre) + '</div>' +
        '<div class="item-body">' +
          '<div class="item-name">' + c.nombre + '</div>' +
          '<div class="item-detail">' + (c.telefono||'Sin teléfono') + ' · ' + c.tipo_cliente + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="item-amount" style="color:' + (saldoTotal>0?'var(--txt)':'var(--txt3)') + '">' + fmt(saldoTotal) + '</div>' +
          '<div class="item-status">' + badge + '</div>' +
        '</div>' +
      '</div>';
  });
  return html + '</div>';
}

function attachClienteListeners(){
  document.querySelectorAll('.item[data-cid]').forEach(function(el){
    el.addEventListener('click', function(){
      navigate('cliente-detalle', this.getAttribute('data-cid'));
    });
  });
}

function renderClientes(query){
  // Si hay Supabase y el cache está vacío, sincronizar primero (solo si nunca hemos sincronizado)
  if(_supabase && _lastSync === 0 && DB.clientes().length === 0){
    mostrarToast('🔄 Cargando...');
    syncData(true).then(function(){
      renderClientes(query);
    });
    return;
  }
  // Primera vez: construir toda la pantalla
  const yaExiste = !!document.getElementById('search-clientes');

  if(!yaExiste){
    // Construir estructura completa solo la primera vez
    document.getElementById('screen').innerHTML =
      '<div>' +
        '<div class="page-header">' +
          '<div>' +
            '<h1 class="page-title">Clientes</h1>' +
            '<p class="page-subtitle" id="clientes-count">' + DB.clientes().length + ' registrados</p>' +
          '</div>' +
          '<button id="btn-importar-clientes" style="padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap">&#128228; Importar</button>' +
        '</div>' +
        '<div class="search-bar">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' +
          '<input class="form-input" id="search-clientes" placeholder="Buscar cliente..." style="width:100%">' +
        '</div>' +
        '<div class="section" id="clientes-lista"></div>' +
      '</div>';

    // Evento del buscador: solo actualiza la lista, NO rerenderiza todo
    document.getElementById('search-clientes').addEventListener('input', function(){
      const q = this.value;
      document.getElementById('clientes-lista').innerHTML = buildClientesList(q);
      attachClienteListeners();
    });
  }

  // Siempre actualizar la lista (primera vez y al volver de crear cliente)
  const q = query || (document.getElementById('search-clientes') ? document.getElementById('search-clientes').value : '');
  document.getElementById('clientes-lista').innerHTML = buildClientesList(q);
  attachClienteListeners();

  // Actualizar contador
  const cnt = document.getElementById('clientes-count');
  if(cnt) cnt.textContent = DB.clientes().length + ' registrados';

  // Botón importar
  const btnImp = document.getElementById('btn-importar-clientes');
  if(btnImp) btnImp.addEventListener('click', function(){ navigate('importar'); });

  // FAB
  let fab = document.querySelector('.fab');
  if(!fab){
    fab = document.createElement('button');
    fab.className = 'fab';
    document.getElementById('app').appendChild(fab);
  }
  if(puedoEscribir()){
    fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    fab.onclick = openDrawerNuevoCliente;
    fab.style.display = '';
  } else {
    fab.style.display = 'none';
  }
}

var _prestFiltroActual = 'todos';
var _prestQueryActual  = '';

function filtrarListaPrestamos(query){
  if(query !== undefined) _prestQueryActual = query;
  const q = (_prestQueryActual||'').toLowerCase();
  const ps = DB.prestamos();
  const clientes = DB.clientes();
  const colores = {activo:'var(--amber)',mora:'var(--red)',pagado:'var(--green)',anulado:'var(--txt3)'};
  const labels  = {activo:'Activo',mora:'Mora',pagado:'Pagado',anulado:'Anulado'};

  let lista = ps.filter(function(p){
    if(_prestFiltroActual !== 'todos'){
      const mapa = {activos:'activo',mora:'mora',pagados:'pagado'};
      if(estadoPrestamo(p) !== (mapa[_prestFiltroActual]||_prestFiltroActual)) return false;
    }
    if(q){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      if(!c || !c.nombre.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const listaEl = document.getElementById('prest-lista');
  const countEl = document.getElementById('prest-count');
  if(!listaEl) return;
  if(countEl) countEl.textContent = lista.length + ' resultado' + (lista.length!==1?'s':'');

  if(lista.length === 0){
    listaEl.innerHTML = '<div class="empty"><div class="empty-title">Sin resultados</div><div class="empty-sub">'+(q?'Ningún préstamo coincide con "'+q+'"':'Sin préstamos en este estado')+'</div></div>';
    return;
  }

  let htmlL = '<div class="item-list">';
  lista.forEach(function(p){
    const c   = clientes.find(function(x){ return x.id===p.cliente_id; });
    const est = estadoPrestamo(p);
    const saldo = saldoPrestamo(p);
    const col = colores[est]||'var(--txt3)';
    const lbl = labels[est]||est;
    const diasMora = est==='mora' ? diffDays(p.fecha_vencimiento, today()) : 0;
    const moraStr = diasMora > 0 ? ' · <span style="color:var(--red)">'+diasMora+'d mora</span>' : '';
    htmlL +=
      '<div class="item" data-pid="' + p.id + '">' +
        '<div class="item-avatar">' + initials(c?.nombre||'?') + '</div>' +
        '<div class="item-body">' +
          '<div class="item-name">' + (p.num_credito?'<span style="color:var(--txt3);font-size:12px">#'+p.num_credito+' </span>':'') + (c?.nombre||'Cliente eliminado') + '</div>' +
          '<div class="item-detail">' + fmt(p.monto_prestado) + ' · ' + p.tasa_interes_mensual + '% · ' + fmtDate(p.fecha_vencimiento) + moraStr + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="item-amount" style="color:' + (est==='pagado'?'var(--txt3)':'var(--txt)') + '">' + fmt(saldo) + '</div>' +
          '<div class="item-status"><span class="badge" style="background:'+col+'22;color:'+col+'">'+lbl+'</span></div>' +
        '</div>' +
      '</div>';
  });
  htmlL += '</div>';
  listaEl.innerHTML = htmlL;
  document.querySelectorAll('#prest-lista .item[data-pid]').forEach(function(el){
    el.addEventListener('click', function(){ navigate('prestamo-detalle', this.getAttribute('data-pid')); });
  });
}

function renderFormCliente(id){
  const fab = document.querySelector('.fab');
  if(fab) fab.remove();
  const c = id ? DB.clientes().find(x=>x.id===id) : null;
  const esEdicion = !!c;

  const screen = document.getElementById('screen');
  screen.innerHTML = '';

  // Header
  const header = document.createElement('div');
  header.style.cssText = 'padding:16px 20px 0;display:flex;align-items:center;gap:12px;margin-bottom:8px';
  header.innerHTML =
    '<button id="btn-back-form" style="width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>'+
    '</button>'+
    '<h1 style="font-size:24px;font-weight:400">'+(esEdicion?'Editar cliente':'Nuevo cliente')+'</h1>';
  screen.appendChild(header);
  document.getElementById('btn-back-form').addEventListener('click', function(){ navigate('clientes'); });

  // Form container
  const form = document.createElement('div');
  form.style.cssText = 'padding:16px 20px';

  // Campo nombre
  function campo(labelTxt, inputId, tipo, placeholder, valor, extra){
    const g = document.createElement('div');
    g.style.marginBottom = '16px';
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em';
    lbl.textContent = labelTxt;
    g.appendChild(lbl);
    let inp;
    if(tipo === 'select'){
      inp = document.createElement('select');
      const opts = extra || [];
      opts.forEach(function(o){
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        if(o === (valor || opts[0])) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if(tipo === 'textarea'){
      inp = document.createElement('textarea');
      inp.placeholder = placeholder;
      inp.textContent = valor || '';
      inp.style.minHeight = '80px';
      inp.style.resize = 'vertical';
    } else {
      inp = document.createElement('input');
      inp.type = tipo;
      inp.placeholder = placeholder;
      inp.value = valor || '';
    }
    inp.id = inputId;
    inp.style.cssText = 'width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--txt);font-size:15px;padding:12px 14px;box-sizing:border-box';
    g.appendChild(inp);
    return g;
  }

  form.appendChild(campo('Nombre completo *', 'f-nombre', 'text', 'Ej: María García', c?.nombre));
  form.appendChild(campo('Teléfono', 'f-tel', 'tel', '310 000 0000', c?.telefono));

  // Row 2 campos
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px';
  const tipoGrp = campo('Tipo cliente', 'f-tipo', 'select', '', c?.tipo_cliente||'Fidelizado', ['Fidelizado','R.Bajo','R.Alto','Nuevo']);
  tipoGrp.style.margin = '0';
  const idGrp = campo('Identificación', 'f-id', 'text', 'CC / NIT', c?.identificacion);
  idGrp.style.margin = '0';
  row.appendChild(tipoGrp);
  row.appendChild(idGrp);
  form.appendChild(row);

  form.appendChild(campo('Observaciones', 'f-obs', 'textarea', 'Notas sobre el cliente...', c?.observaciones));

  // Botón guardar
  const btn = document.createElement('button');
  btn.textContent = esEdicion ? 'Guardar cambios' : 'Crear cliente';
  btn.style.cssText = 'width:100%;background:var(--gold);color:#1a1200;border:none;border-radius:8px;font-size:15px;font-weight:500;padding:14px;cursor:pointer;margin-top:8px';

  btn.addEventListener('click', async function(){
    const nombre = document.getElementById('f-nombre').value.trim();
    if(!nombre){
      alert('El nombre es obligatorio');
      document.getElementById('f-nombre').focus();
      return;
    }
    const datos = {
      nombre: nombre,
      telefono: document.getElementById('f-tel').value.trim(),
      tipo_cliente: document.getElementById('f-tipo').value,
      identificacion: document.getElementById('f-id').value.trim(),
      observaciones: document.getElementById('f-obs').value.trim(),
    };
    if(_supabase){
      // Guardar en Google Sheets
      let result;
      try{
        if(esEdicion){
          result = await gsWrite('clientes','update',{...datos,id});
        } else {
          result = await gsWrite('clientes','create',datos);
          if(result) id = result.id;
        }
      } catch(e){ result = null; console.error(e); }
      if(!result){ mostrarToast('❌ Error al guardar en la nube'); return; }
      // Actualizar caché local
      await syncData(true);
    } else {
      // Modo local
      const lista = DB.clientes().filter(function(c){ return c.estado !== 'inactivo'; });

      // Verificar duplicados al crear
      if(!esEdicion){
        const nombreNorm = nombre.toLowerCase().trim();
        const exacto = lista.find(function(c){ return c.nombre.toLowerCase().trim() === nombreNorm; });
        if(exacto){ mostrarToast('⚠️ Ya existe un cliente con ese nombre: '+exacto.nombre); return; }
        const prefijo = nombreNorm.slice(0,5);
        const similar = lista.find(function(c){ return c.nombre.toLowerCase().slice(0,5)===prefijo && c.nombre.toLowerCase().trim()!==nombreNorm; });
        if(similar && !confirm('Posible duplicado: ya existe "'+similar.nombre+'". ¿Crear "'+nombre+'" de todas formas?')){ return; }
      }

      if(esEdicion){
        const idx = lista.findIndex(function(x){ return x.id === id; });
        if(idx >= 0) Object.assign(lista[idx], datos);
        DB.saveClientes(lista);
      } else {
        datos.id = uid();
        datos.estado = 'activo';
        datos.created_at = new Date().toISOString();
        lista.push(datos);
        DB.saveClientes(lista);
      }
    }
    if(esEdicion){
      navigate('cliente-detalle', id, false);
    } else {
      navigate('clientes', null, false);
    }
    setTimeout(function(){
      mostrarToast('✅ Cliente ' + (esEdicion?'actualizado':'creado') + ': ' + nombre);
    }, 50);
  });

  form.appendChild(btn);
  screen.appendChild(form);

  // Focus en nombre
  setTimeout(function(){ 
    const n = document.getElementById('f-nombre');
    if(n) n.focus();
  }, 100);
}

function openDrawerEditarCliente(id){ navigate('editar-cliente', id); }

function guardarCliente(id){
  // null, undefined, '' → nuevo cliente
  const esEdicion = !!(id && id !== '' && id !== 'undefined' && id !== 'null');
  if(!puedoEscribir()){ mostrarToast('⚠️ No tienes permisos para modificar datos'); return; }

  const campoNombre = document.getElementById('f-nombre');
  if(!campoNombre){
    alert('Error: formulario no encontrado. Intenta cerrar y abrir de nuevo.');
    return;
  }
  const nombre = campoNombre.value.trim();
  if(!nombre){
    campoNombre.focus();
    campoNombre.style.borderColor = 'var(--red)';
    setTimeout(()=>campoNombre.style.borderColor='', 2000);
    alert('El nombre del cliente es obligatorio');
    return;
  }

  const telefono = (document.getElementById('f-tel')?.value||'').trim();
  const tipo_cliente = document.getElementById('f-tipo')?.value||'Fidelizado';
  const identificacion = (document.getElementById('f-id')?.value||'').trim();
  const observaciones = (document.getElementById('f-obs')?.value||'').trim();

  const clientes = DB.clientes();

  if(esEdicion){
    const idx = clientes.findIndex(x=>x.id===id);
    if(idx>=0){
      clientes[idx]={...clientes[idx],nombre,telefono,tipo_cliente,identificacion,observaciones,updated_at:Date.now()};
    }
  } else {
    const nuevo = {id:uid(),nombre,telefono,tipo_cliente,identificacion,observaciones,estado:'activo',created_at:Date.now()};
    clientes.push(nuevo);
  }

  const ok = DB.saveClientes(clientes);
  if(!ok) return;

  const nombreGuardado = nombre;
  const idGuardado = esEdicion ? id : null;

  // Cerrar drawer primero
  const _ov = document.getElementById('overlay');
  const _dr = document.getElementById('drawer');
  const _dc = document.getElementById('drawer-content');
  if(_ov){ _ov.classList.remove('show'); _ov.style.pointerEvents='none'; _ov.style.opacity='0'; }
  if(_dr){ _dr.classList.remove('show'); }
  if(_dc){ _dc.innerHTML = ''; }

  // Navegar inmediatamente sin esperar animación
  if(esEdicion){
    navigate('cliente-detalle', idGuardado, false);
  } else {
    navigate('clientes', null, false);
  }

  // Toast después del render para que sea visible
  setTimeout(function(){
    mostrarToast('✅ Cliente ' + (esEdicion?'actualizado':'creado') + ': ' + nombreGuardado);
  }, 100);
}

function calcPreview(){
  const monto = parseFloat(document.getElementById('p-monto')?.value)||0;
  const tasa = parseFloat(document.getElementById('p-tasa')?.value)||0;
  const cuotas = parseInt(document.getElementById('p-cuotas')?.value)||1;
  const freq = parseInt(document.getElementById('p-freq')?.value)||30;
  const fi = document.getElementById('p-finicio')?.value;

  if(monto>0&&tasa>0&&fi){
    // auto-calcular fecha vencimiento
    const fv = new Date(fi+'T12:00:00');
    fv.setDate(fv.getDate() + freq*cuotas);
    document.getElementById('p-fvence').value = fv.toISOString().slice(0,10);

    const calc = calcPrestamo(monto, tasa, cuotas, freq);
    document.getElementById('preview-prestamo').style.display='block';
    document.getElementById('prev-int').textContent = fmt(calc.intTotal);
    document.getElementById('prev-total').textContent = fmt(calc.total);
    document.getElementById('prev-cuota').textContent = fmt(calc.valorCuota);
  }
}

async function guardarPrestamo(clienteId){
  if(!clienteId || clienteId==='' || clienteId==='undefined'){
    alert('Error: cliente no identificado. Vuelve a la ficha del cliente e intenta de nuevo.');
    return;
  }
  if(!puedoEscribir()){ mostrarToast('⚠️ No tienes permisos para crear préstamos'); return; }
  const monto = parseFloat(document.getElementById('p-monto').value);
  const tasa = parseFloat(document.getElementById('p-tasa').value);
  const cuotas = parseInt(document.getElementById('p-cuotas').value)||1;
  const freq = parseInt(document.getElementById('p-freq').value)||30;
  const fi = document.getElementById('p-finicio').value;
  const fv = document.getElementById('p-fvence').value;
  if(!monto||!tasa||!fi||!fv) return alert('Completa monto, tasa y fechas');
  if(monto<=0||tasa<=0) return alert('Monto y tasa deben ser positivos');

  const calc = calcPrestamo(monto, tasa, cuotas, freq);
  const ps = DB.prestamos();
  const nuevoPrestamo = {
    cliente_id:clienteId,
    monto_prestado:monto, tasa_interes_mensual:tasa,
    frecuencia_cobro:freq, num_cuotas:cuotas,
    valor_cuota:calc.valorCuota, interes_total:calc.intTotal,
    total_a_pagar:calc.total,
    fecha_inicio:fi, fecha_vencimiento:fv,
    estado:'activo', observaciones:document.getElementById('p-obs').value.trim()
  };
  if(_supabase){
    try{
      await gsWrite('prestamos','create',nuevoPrestamo);
      await syncData(true);
    } catch(e){ mostrarToast('❌ Error al crear préstamo: '+e.message); return; }
  } else {
    ps.push({id:uid(), num_credito:nextNumPrestamo(), ...nuevoPrestamo, created_at:Date.now()});
    DB.savePrestamos(ps);
  }
  const _ov = document.getElementById('overlay');
  const _dr = document.getElementById('drawer');
  const _dc = document.getElementById('drawer-content');
  if(_ov){ _ov.classList.remove('show'); _ov.style.pointerEvents='none'; _ov.style.opacity='0'; }
  if(_dr){ _dr.classList.remove('show'); }
  if(_dc){ _dc.innerHTML = ''; }
  navigate('cliente-detalle', clienteId, false);
  setTimeout(function(){ mostrarToast('✅ Préstamo creado correctamente'); }, 100);
}

async function guardarAbono(prestamoId){
  if(!puedoEscribir()){ mostrarToast('⚠️ No tienes permisos para registrar abonos'); return; }
  const monto = parseFloat(document.getElementById('a-monto').value);
  if(!monto||monto<=0){
    alert('Ingresa un monto válido mayor a cero');
    return;
  }
  const tipo = document.getElementById('a-tipo').value;
  const fecha = document.getElementById('a-fecha').value;
  const obs = document.getElementById('a-obs').value.trim();

  const nuevoAbono = {prestamo_id:prestamoId, monto, tipo_abono:tipo, fecha_abono:fecha, observaciones:obs};
  if(_supabase){
    try{
      await gsWrite('abonos','create',nuevoAbono);
      await syncData(true);
      // Verificar si el préstamo queda pagado
      const totalAb = DB.abonos().filter(a=>a.prestamo_id===prestamoId).reduce((s,a)=>s+a.monto,0);
      const p = DB.prestamos().find(x=>x.id===prestamoId);
      if(p && totalAb >= p.total_a_pagar){
        await gsWrite('prestamos','update',{id:prestamoId,estado:'pagado'});
        await syncData(true);
      }
    } catch(e){ mostrarToast('❌ Error al guardar abono: '+e.message); return; }
  } else {
    const abonos = DB.abonos();
    abonos.push({id:uid(),...nuevoAbono, created_at:Date.now()});
    DB.saveAbonos(abonos);
    const p = DB.prestamos().find(x=>x.id===prestamoId);
    const totalAb = DB.abonos().filter(a=>a.prestamo_id===prestamoId).reduce((s,a)=>s+a.monto,0);
    if(p && totalAb >= p.total_a_pagar){
      const ps = DB.prestamos();
      const idx = ps.findIndex(x=>x.id===prestamoId);
      if(idx>=0) ps[idx].estado='pagado';
      DB.savePrestamos(ps);
    }
  }

  const _ov = document.getElementById('overlay');
  const _dr = document.getElementById('drawer');
  const _dc = document.getElementById('drawer-content');
  if(_ov){ _ov.classList.remove('show'); _ov.style.pointerEvents='none'; _ov.style.opacity='0'; }
  if(_dr){ _dr.classList.remove('show'); }
  if(_dc){ _dc.innerHTML = ''; }
  navigate('prestamo-detalle', prestamoId, false);
  setTimeout(function(){ mostrarToast('✅ Abono registrado correctamente'); }, 100);
}

async function marcarPagado(prestamoId){
  if(!confirm('¿Registrar pago total del préstamo?')) return;
  const p = DB.prestamos().find(x=>x.id===prestamoId);
  const saldo = saldoPrestamo(p);
  if(_supabase){
    try{
      if(saldo>0){
        await gsWrite('abonos','create',{prestamo_id:prestamoId,monto:saldo,tipo_abono:'total',fecha_abono:today(),observaciones:'Pago total'});
      }
      await gsWrite('prestamos','update',{id:prestamoId,estado:'pagado'});
      await syncData(true);
    } catch(e){ mostrarToast('❌ Error: '+e.message); return; }
  } else {
    if(saldo>0){
      const abonos = DB.abonos();
      abonos.push({id:uid(),prestamo_id:prestamoId,monto:saldo,tipo_abono:'total',fecha_abono:today(),observaciones:'Pago total',created_at:Date.now()});
      DB.saveAbonos(abonos);
    }
    const ps = DB.prestamos();
    const idx = ps.findIndex(x=>x.id===prestamoId);
    if(idx>=0) ps[idx].estado='pagado';
    DB.savePrestamos(ps);
  }
  navigate('prestamo-detalle',prestamoId,false);
}

function compartirResumen(clienteId){
  const c = DB.clientes().find(x=>x.id===clienteId);
  const ps = DB.prestamos().filter(p=>p.cliente_id===clienteId&&['activo','mora'].includes(estadoPrestamo(p)));
  if(ps.length===0) return alert('Este cliente no tiene prestamos activos');

  const fecha = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});
  let msg = '*Estado de cuenta - ' + fecha + '*\n';
  msg += 'Cliente: ' + c.nombre + '\n';
  msg += '--------------------\n\n';

  ps.forEach(function(p){
    const saldo = saldoPrestamo(p);
    const est = estadoPrestamo(p);
    const abonos = DB.abonos()
      .filter(function(a){ return a.prestamo_id===p.id; })
      .sort(function(a,b){ return new Date(a.fecha_abono)-new Date(b.fecha_abono); });
    const totalAbonado = abonos.reduce(function(s,a){ return s+a.monto; },0);

    const estLabel = est==='mora' ? 'en Mora' : est==='pagado' ? 'Pagado' : 'al Dia';
    msg += '📋 *Prestamo ' + estLabel + '*\n';
    msg += '- Capital prestado: ' + fmt(p.monto_prestado) + '\n';
    msg += '- Tasa: ' + p.tasa_interes_mensual + '% m.v.\n';
    msg += '- Total a pagar: ' + fmt(p.total_a_pagar) + '\n';
    msg += '- Fecha inicio: ' + fmtDate(p.fecha_inicio) + '\n';
    msg += '- Vence: ' + fmtDate(p.fecha_vencimiento) + '\n';
    if(est==='mora'){
      const dias = diffDays(p.fecha_vencimiento, today());
      msg += '- EN MORA: ' + dias + ' dia' + (dias!==1?'s':'') + '\n';
    }
    msg += '\n';

    if(abonos.length > 0){
      msg += '💳 *Abonos realizados (' + abonos.length + ')*\n';
      abonos.forEach(function(a){
        const tipoLabel = a.tipo_abono==='total'?'Pago total'
          : a.tipo_abono==='capital'?'Capital'
          : a.tipo_abono==='interes'?'Interes':'Mixto';
        msg += '  * ' + fmtDate(a.fecha_abono) + ' - ' + fmt(a.monto) + ' (' + tipoLabel + ')';
        if(a.observaciones) msg += ' - ' + a.observaciones;
        msg += '\n';
      });
      msg += '- Total abonado: ' + fmt(totalAbonado) + '\n\n';
    } else {
      msg += 'Sin abonos registrados\n\n';
    }

    msg += '*Saldo pendiente: ' + fmt(saldo) + '*\n';
    msg += '--------------------\n\n';
  });

  msg += 'Cualquier duda puedes comunicarte conmigo. Feliz Dia!';

  const url = 'https://wa.me/' + c.telefono.replace(/\D/g,'') + '?text=' + encodeURIComponent(msg);
  window.open(url,'_blank');
}

function exportarDatos(){
  const datos = {
    version: 1,
    fecha_exportacion: new Date().toISOString(),
    clientes: DB.clientes(),
    prestamos: DB.prestamos(),
    abonos: DB.abonos(),
    gastos: DB.gastos(),
    capital: DB.capital(),
  };
  const json = JSON.stringify(datos, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `cartera_backup_${fecha}.json`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('✅ Backup descargado correctamente');
}

function importarDatos(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const datos = JSON.parse(e.target.result);
      if(!datos.clientes || !datos.prestamos) throw new Error('Archivo inválido');
      const total = (datos.clientes?.length||0) + (datos.prestamos?.length||0) + (datos.abonos?.length||0);
      if(!confirm(`¿Restaurar backup del ${datos.fecha_exportacion?.slice(0,10)||'archivo'}?\n\nSe cargarán:\n• ${datos.clientes?.length||0} clientes\n• ${datos.prestamos?.length||0} préstamos\n• ${datos.abonos?.length||0} abonos\n• ${datos.gastos?.length||0} gastos\n• ${datos.capital?.length||0} movimientos de capital\n\nEsto REEMPLAZA los datos actuales.`)) return;
      if(datos.clientes) DB.saveClientes(datos.clientes);
      if(datos.prestamos) DB.savePrestamos(datos.prestamos);
      if(datos.abonos) DB.saveAbonos(datos.abonos);
      if(datos.gastos) DB.saveGastos(datos.gastos);
      if(datos.capital) DB.saveCapital(datos.capital);
      closeDrawer();
      mostrarToast('✅ Datos restaurados correctamente');
      setTimeout(()=>navigate('dashboard',null,false), 600);
    } catch(err) {
      alert('Error al leer el archivo. Asegúrate de que sea un backup válido de esta app.');
    }
  };
  reader.readAsText(file);
}

// SCORE DE COMPORTAMIENTO
// ═══════════════════════════════════════
function calcScore(clienteId){
  const ps = DB.prestamos().filter(p=>p.cliente_id===clienteId);
  if(ps.length===0) return {score:0,label:'Sin historial',color:'var(--txt3)',estrellas:0};
  const todosAbonos = DB.abonos();
  let puntos = 100;
  let prestadosPagados = 0;
  let vecesEnMora = 0;
  let diasMoraTotal = 0;
  let pagosATiempo = 0;
  let totalPagos = 0;

  ps.forEach(p=>{
    const est = estadoPrestamo(p);
    if(est==='pagado') prestadosPagados++;
    // check si alguna vez estuvo en mora (fecha vencimiento < algún abono tardío)
    const abonosP = todosAbonos.filter(a=>a.prestamo_id===p.id).sort((a,b)=>new Date(a.fecha_abono)-new Date(b.fecha_abono));
    let saldoRun = p.total_a_pagar;
    abonosP.forEach(a=>{
      totalPagos++;
      const diasRetraso = diffDays(p.fecha_vencimiento, a.fecha_abono);
      if(diasRetraso > 0){
        vecesEnMora++;
        diasMoraTotal += diasRetraso;
        puntos -= Math.min(15, diasRetraso * 0.5);
      } else {
        pagosATiempo++;
        puntos += 2;
      }
      saldoRun -= a.monto;
    });
    if(est==='pagado') puntos += 10;
    if(est==='mora') puntos -= 20;
  });

  puntos = Math.max(0, Math.min(100, puntos));
  const estrellas = puntos>=85?5:puntos>=70?4:puntos>=55?3:puntos>=35?2:1;
  const label = puntos>=85?'Excelente':puntos>=70?'Bueno':puntos>=55?'Regular':puntos>=35?'Riesgoso':'Crítico';
  const color = puntos>=70?'var(--green)':puntos>=45?'var(--amber)':'var(--red)';
  return {score:Math.round(puntos), label, color, estrellas, vecesEnMora, diasMoraTotal, prestadosPagados, pagosATiempo, totalPagos};
}

// TABLA DE AMORTIZACIÓN
// ═══════════════════════════════════════
function calcAmortizacion(p){
  const cuotas = [];
  const freq = p.frecuencia_cobro || 30;
  const interesPorCuota = p.monto_prestado * (p.tasa_interes_mensual/100) * (freq/30);
  const capitalPorCuota = p.monto_prestado / p.num_cuotas;
  const abonos = DB.abonos().filter(a=>a.prestamo_id===p.id).sort((a,b)=>new Date(a.fecha_abono)-new Date(b.fecha_abono));
  let capitalAcum = 0;

  for(let i=0;i<p.num_cuotas;i++){
    const fechaCuota = new Date(p.fecha_inicio+'T12:00:00');
    fechaCuota.setDate(fechaCuota.getDate() + freq*(i+1));
    const fechaStr = fechaCuota.toISOString().slice(0,10);
    const hoy = today();
    const vencida = hoy > fechaStr;
    const abono = abonos[i] || null;
    const pagada = !!abono;
    const diasRetraso = pagada ? Math.max(0, diffDays(fechaStr, abono.fecha_abono)) : (vencida ? diffDays(fechaStr, hoy) : 0);

    cuotas.push({
      numero: i+1,
      fecha: fechaStr,
      capital: capitalPorCuota,
      interes: interesPorCuota,
      total: capitalPorCuota + interesPorCuota,
      pagada,
      vencida,
      diasRetraso,
      fechaPago: abono?.fecha_abono || null,
      montoPagado: abono?.monto || 0,
    });
  }
  return cuotas;
}

      <div style="display:flex;flex-direction:column;gap:6px">

function calcFlujoCaja(){
  const ps = DB.prestamos().filter(p=>['activo','mora'].includes(estadoPrestamo(p)));
  const clientes = DB.clientes();
  const hoy = new Date();
  const semanas = [];

  for(let w=0;w<8;w++){
    const inicio = new Date(hoy);
    inicio.setDate(inicio.getDate() + w*7);
    const fin = new Date(inicio);
    fin.setDate(fin.getDate()+6);
    const isoInicio = inicio.toISOString().slice(0,10);
    const isoFin = fin.toISOString().slice(0,10);

    const vencen = [];
    ps.forEach(p=>{
      const cuotas = calcAmortizacion(p);
      cuotas.filter(c=>!c.pagada && c.fecha>=isoInicio && c.fecha<=isoFin).forEach(c=>{
        const cli = clientes.find(x=>x.id===p.cliente_id);
        vencen.push({cliente:cli?.nombre||'—',monto:c.total,fecha:c.fecha,cuota:c.numero,prestamo_id:p.id});
      });
    });

    semanas.push({
      label: w===0?'Esta semana':w===1?'Próxima semana':`Semana ${w+1}`,
      inicio:isoInicio, fin:isoFin,
      vencen,
      total: vencen.reduce((s,v)=>s+v.monto,0)
    });
  }
  return semanas;
}

function calcRecordatorios(){
  const ps = DB.prestamos().filter(p=>['activo','mora'].includes(estadoPrestamo(p)));
  const clientes = DB.clientes();
  const hoy = today();
  const manana = new Date(); manana.setDate(manana.getDate()+1);
  const mananaStr = manana.toISOString().slice(0,10);
  const en3 = new Date(); en3.setDate(en3.getDate()+3);
  const en3Str = en3.toISOString().slice(0,10);

  const cobrosHoy=[], cobrosMañana=[], cobrosProximos=[], enMora=[];

  ps.forEach(p=>{
    const cli = clientes.find(x=>x.id===p.cliente_id);
    const est = estadoPrestamo(p);
    const saldo = saldoPrestamo(p);
    const cuotas = calcAmortizacion(p);
    const base = {nombre:cli?.nombre||'—',telefono:cli?.telefono||'',saldo,prestamo_id:p.id,cliente_id:p.cliente_id};

    if(est==='mora'){
      const dias = diffDays(p.fecha_vencimiento, hoy);
      enMora.push({...base, diasMora:dias});
    }

    cuotas.filter(c=>!c.pagada).forEach(c=>{
      if(c.fecha===hoy) cobrosHoy.push({...base, monto:c.total, fecha:c.fecha, cuota:c.numero});
      else if(c.fecha===mananaStr) cobrosMañana.push({...base, monto:c.total, fecha:c.fecha, cuota:c.numero});
      else if(c.fecha>hoy && c.fecha<=en3Str) cobrosProximos.push({...base, monto:c.total, fecha:c.fecha, cuota:c.numero});
    });
  });

  return {cobrosHoy, cobrosMañana, cobrosProximos, enMora};
}

function getMovimientosTodos(){
  const clientes = DB.clientes();
  const prestamos = DB.prestamos();
  const movs = [];

  // Abonos
  DB.abonos().forEach(function(a){
    const p = prestamos.find(function(x){ return x.id===a.prestamo_id; });
    const c = p ? clientes.find(function(x){ return x.id===p.cliente_id; }) : null;
    movs.push({
      fecha: a.fecha_abono,
      tipo: 'abono',
      tipoLabel: 'Abono',
      descripcion: (c?c.nombre:'—') + ' · ' + (a.tipo_abono==='total'?'Pago total':a.tipo_abono==='capital'?'Capital':a.tipo_abono==='interes'?'Interés':'Mixto'),
      monto: a.monto,
      signo: '+',
      color: 'var(--green)',
      ref: a.prestamo_id,
      obs: a.observaciones||''
    });
  });

  // Préstamos desembolsados
  prestamos.forEach(function(p){
    const c = clientes.find(function(x){ return x.id===p.cliente_id; });
    movs.push({
      fecha: p.fecha_inicio,
      tipo: 'prestamo',
      tipoLabel: 'Préstamo',
      descripcion: 'Préstamo a ' + (c?c.nombre:'—') + ' · ' + p.tasa_interes_mensual + '% m.v.',
      monto: p.monto_prestado,
      signo: '−',
      color: 'var(--amber)',
      ref: p.id,
      obs: p.observaciones||''
    });
  });

  // Capital
  DB.capital().forEach(function(m){
    movs.push({
      fecha: m.fecha,
      tipo: 'capital',
      tipoLabel: m.tipo==='retiro'?'Retiro':'Capital',
      descripcion: m.tipo==='retiro'?'Retiro de capital':m.tipo==='ganancia_reinvertida'?'Ganancia reinvertida':'Inyección de capital',
      monto: m.monto,
      signo: m.tipo==='retiro'?'−':'+',
      color: m.tipo==='retiro'?'var(--red)':'var(--blue)',
      ref: m.id,
      obs: m.descripcion||''
    });
  });

  // Gastos
  DB.gastos().forEach(function(g){
    movs.push({
      fecha: g.fecha,
      tipo: 'gasto',
      tipoLabel: 'Gasto',
      descripcion: g.concepto + ' · ' + g.categoria,
      monto: g.monto,
      signo: '−',
      color: 'var(--red)',
      ref: g.id,
      obs: ''
    });
  });

  return movs.sort(function(a,b){ return b.fecha.localeCompare(a.fecha) || b.tipo.localeCompare(a.tipo); });
}

function filtrarMovimientos(){
  const desde = document.getElementById('mov-desde')?.value||'';
  const hasta = document.getElementById('mov-hasta')?.value||'';
  const tipoActivo = (function(){
    let t = 'todos';
    document.querySelectorAll('#mov-tipos button').forEach(function(b){
      if(b.style.background.includes('gold')||b.style.background==='var(--gold)') t = b.dataset.tipo;
    });
    return t;
  })();

  let movs = getMovimientosTodos();
  if(desde) movs = movs.filter(function(m){ return m.fecha >= desde; });
  if(hasta) movs = movs.filter(function(m){ return m.fecha <= hasta; });
  if(tipoActivo !== 'todos'){
    const mapa = {abonos:'abono',préstamos:'prestamo',capital:'capital',gastos:'gasto'};
    const t = mapa[tipoActivo]||tipoActivo;
    movs = movs.filter(function(m){ return m.tipo===t||m.tipo.startsWith(t); });
  }

  const container = document.getElementById('mov-resultados');
  if(!container) return;

  if(movs.length===0){
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--txt3);font-size:13px">Sin movimientos en el rango seleccionado</div>';
    return;
  }

  // Totales
  const totalEntradas = movs.filter(function(m){ return m.signo==='+'; }).reduce(function(s,m){ return s+m.monto; },0);
  const totalSalidas  = movs.filter(function(m){ return m.signo==='−'; }).reduce(function(s,m){ return s+m.monto; },0);

  let html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Movimientos</div><div style="font-size:16px;font-weight:500">'+movs.length+'</div></div>' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Entradas</div><div style="font-size:14px;font-weight:500;color:var(--green)">+'+fmt(totalEntradas)+'</div></div>' +
    '<div><div style="font-size:10px;color:var(--txt3);margin-bottom:3px">Salidas</div><div style="font-size:14px;font-weight:500;color:var(--red)">−'+fmt(totalSalidas)+'</div></div>' +
  '</div>';

  // Lista agrupada por fecha
  const porFecha = {};
  movs.forEach(function(m){
    if(!porFecha[m.fecha]) porFecha[m.fecha]=[];
    porFecha[m.fecha].push(m);
  });

  html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">';
  Object.keys(porFecha).sort(function(a,b){ return b.localeCompare(a); }).forEach(function(fecha){
    html += '<div style="padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--txt2)">'+fmtDate(fecha)+'</div>';
    porFecha[fecha].forEach(function(m){
      html +=
        '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)">' +
          '<div style="width:7px;height:7px;border-radius:50%;background:'+m.color+';flex-shrink:0"></div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+m.descripcion+'</div>' +
            '<div style="font-size:11px;color:var(--txt3);margin-top:1px">'+m.tipoLabel+(m.obs?' · '+m.obs:'')+'</div>' +
          '</div>' +
          '<div style="font-size:13px;font-weight:500;color:'+m.color+';flex-shrink:0">'+m.signo+fmt(m.monto)+'</div>' +
        '</div>';
    });
  });
  html += '</div>';
  container.innerHTML = html;
}

function exportarMovimientosCSV(){
  const desde = document.getElementById('mov-desde')?.value||'';
  const hasta = document.getElementById('mov-hasta')?.value||'';
  let movs = getMovimientosTodos();
  if(desde) movs = movs.filter(function(m){ return m.fecha >= desde; });
  if(hasta) movs = movs.filter(function(m){ return m.fecha <= hasta; });

  const rows = [['Fecha','Tipo','Descripción','Monto','Entrada/Salida','Observaciones']];
  movs.forEach(function(m){
    rows.push([m.fecha, m.tipoLabel, m.descripcion, m.monto, m.signo==='+' ? 'Entrada':'Salida', m.obs]);
  });
  const csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='movimientos_'+(desde||'inicio')+'_'+(hasta||'hoy')+'.csv';
  a.click(); URL.revokeObjectURL(url);
  mostrarToast('✅ CSV descargado — ábrelo en Excel');
}

function exportarReporteExcel(tipo){
  const clientes = DB.clientes();
  const prestamos = DB.prestamos();
  let rows = [], filename = '';

  if(tipo==='clientes_activos'){
    filename = 'clientes_activos.csv';
    rows = [['Nombre','Teléfono','Tipo','Préstamos Activos','Saldo Total','Mora']];
    clientes.forEach(function(c){
      const ps = prestamos.filter(function(p){ return p.cliente_id===c.id && ['activo','mora'].includes(estadoPrestamo(p)); });
      if(ps.length===0) return;
      const saldo = ps.reduce(function(s,p){ return s+saldoPrestamo(p); },0);
      const mora = ps.some(function(p){ return estadoPrestamo(p)==='mora'; });
      rows.push([c.nombre, c.telefono||'', c.tipo_cliente, ps.length, saldo, mora?'Sí':'No']);
    });
  } else if(tipo==='clientes_mora'){
    filename = 'clientes_mora.csv';
    rows = [['Nombre','Teléfono','Préstamo','Monto Prestado','Saldo','Días Mora','Vencimiento']];
    prestamos.filter(function(p){ return estadoPrestamo(p)==='mora'; }).forEach(function(p){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      const dias = diffDays(p.fecha_vencimiento, today());
      rows.push([c?c.nombre:'—', c?c.telefono||'':'', p.id, p.monto_prestado, saldoPrestamo(p), dias, p.fecha_vencimiento]);
    });
  } else if(tipo==='cartera_completa'){
    filename = 'cartera_completa.csv';
    rows = [['Cliente','Teléfono','Monto Prestado','Tasa %','Cuotas','F. Inicio','F. Vencimiento','Total Pagar','Abonado','Saldo','Estado']];
    prestamos.forEach(function(p){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      const abonado = DB.abonos().filter(function(a){ return a.prestamo_id===p.id; }).reduce(function(s,a){ return s+a.monto; },0);
      rows.push([c?c.nombre:'—', c?c.telefono||'':'', p.monto_prestado, p.tasa_interes_mensual, p.num_cuotas, p.fecha_inicio, p.fecha_vencimiento, p.total_a_pagar, abonado, saldoPrestamo(p), estadoPrestamo(p)]);
    });
  } else if(tipo==='gastos'){
    filename = 'gastos.csv';
    rows = [['Fecha','Concepto','Categoría','Monto']];
    DB.gastos().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); }).forEach(function(g){
      rows.push([g.fecha, g.concepto, g.categoria, g.monto]);
    });
  }

  if(rows.length<=1){ mostrarToast('⚠️ Sin datos para exportar'); return; }
  const csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c||'').replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  mostrarToast('✅ '+(rows.length-1)+' registros exportados — abre en Excel');
}

function procesarCSVClientes(file){
  const reader = new FileReader();
  reader.onload = function(e){
    const text = e.target.result.replace(/^﻿/,'');
        const lines = text.split('\n').map(function(l){return l.replace(/\r$/,'');}).filter(function(l){ return l.trim(); });
    if(lines.length < 2){ mostrarToast('⚠️ Archivo vacío o sin datos'); return; }

    // Ignorar fila de instrucciones (contiene "Obligatorio" o "INSTRUCCIONES")
    const filtradas = lines.filter(function(l){ 
      return !l.toLowerCase().includes('instrucciones') && !l.toLowerCase().includes('obligatorio') &&
             !l.toLowerCase().includes('solo números') && !l.toLowerCase().includes('ej:');
    });

    const headerLine = filtradas[0].toLowerCase();
    if(!headerLine.includes('nombre')){ mostrarToast('⚠️ La primera fila debe tener los encabezados'); return; }

    // Detectar posición de cada columna por el encabezado
    const sep = filtradas[0].includes(';') && !filtradas[0].includes(',') ? ';' : ',';
    const headers = sep===';'
      ? filtradas[0].split(';').map(function(h){ return h.replace(/"/g,'').trim().toLowerCase(); })
      : (filtradas[0].match(/(".*?"|[^,]+)(?=,|$)/g)||[]).map(function(h){ return h.replace(/"/g,'').trim().toLowerCase(); });

    const col = function(name){ return headers.indexOf(name); };
    const iNombre   = col('nombre');
    const iTel      = col('telefono');
    const iTipo     = col('tipo_cliente');
    const iId       = col('identificacion');
    const iObs      = col('observaciones_cliente') >= 0 ? col('observaciones_cliente') : col('observaciones');
    const iMonto    = col('monto_prestado');
    const iTasa     = col('tasa_interes');
    const iCuotas   = col('num_cuotas');
    const iFreq     = col('frecuencia_dias');
    const iFInicio  = col('fecha_inicio');
    const iFVence   = col('fecha_vencimiento');
    const iObsP     = col('observaciones_prestamo');

    const errores = [], validosClientes = [], validosPrestamos = [];
    const tiposValidos = ['Fidelizado','R.Bajo','R.Alto','Nuevo'];

    const clean = function(s){ return (s||'').replace(/^"|"$/g,'').replace(/""/g,'"').trim(); };

    filtradas.slice(1).forEach(function(line, i){
      if(!line.trim()) return;
      const cols = sep===';'
        ? line.split(';').map(function(c){ return c.trim(); })
        : (line.match(/(".*?"|[^,]+)(?=,|$)/g)||[]);

      const nombre   = clean(cols[iNombre>=0?iNombre:0]);
      const telefono = clean(cols[iTel>=0?iTel:1]);
      const tipo     = clean(cols[iTipo>=0?iTipo:2])||'Fidelizado';
      const identi   = clean(cols[iId>=0?iId:3]);
      const obsC     = clean(cols[iObs>=0?iObs:4]);

      if(!nombre){ errores.push('Fila '+(i+2)+': nombre vacío'); return; }
      if(!tiposValidos.includes(tipo)){ errores.push('Fila '+(i+2)+': tipo "'+tipo+'" inválido'); return; }

      const clienteId = uid();
      validosClientes.push({id:clienteId, nombre, telefono, tipo_cliente:tipo, identificacion:identi, observaciones:obsC, estado:'activo', created_at:Date.now()});

      // ¿Tiene datos de préstamo?
      const monto = iMonto>=0 ? parseFloat(clean(cols[iMonto])) : 0;
      const tasa  = iTasa>=0  ? parseFloat(clean(cols[iTasa]))  : 0;
      if(monto > 0 && tasa > 0){
        const cuotas   = iCuotas>=0  ? parseInt(clean(cols[iCuotas]))||1   : 1;
        const freq     = iFreq>=0    ? parseInt(clean(cols[iFreq]))||30    : 30;
        // Normalizar fechas: acepta DD/MM/AAAA o AAAA-MM-DD
        const normFecha = function(f){
          if(!f) return '';
          if(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(f)){
            const p = f.split(/[\/\-]/);
            return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
          }
          return f;
        };
        const fInicio  = normFecha(iFInicio>=0 ? clean(cols[iFInicio]) : '') || new Date().toISOString().slice(0,10);
        const fVence   = normFecha(iFVence>=0  ? clean(cols[iFVence])  : '');
        const obsP     = iObsP>=0    ? clean(cols[iObsP])    : '';
        const calc     = calcPrestamo(monto, tasa, cuotas, freq);

        // Calcular fecha vencimiento si no viene
        let fv = fVence;
        if(!fv && fInicio){
          const d = new Date(fInicio+'T12:00:00');
          d.setDate(d.getDate() + freq*cuotas);
          fv = d.toISOString().slice(0,10);
        }

        validosPrestamos.push({
          id:uid(), cliente_id:clienteId,
          monto_prestado:monto, tasa_interes_mensual:tasa,
          frecuencia_cobro:freq, num_cuotas:cuotas,
          valor_cuota:calc.valorCuota, interes_total:calc.intTotal,
          total_a_pagar:calc.total,
          fecha_inicio:fInicio, fecha_vencimiento:fv,
          estado:'activo', observaciones:obsP,
          created_at:Date.now()
          // num_credito se asigna al importar
        });
      }
    });

    // Mostrar preview
    const preview = document.getElementById('import-preview');
    if(!preview) return;

    let html = '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px">';
    html += '<div style="font-size:13px;font-weight:500;margin-bottom:10px">Vista previa</div>';

    if(errores.length>0){
      html += '<div style="background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:8px;padding:10px;margin-bottom:10px">';
      html += '<div style="font-size:12px;font-weight:500;color:var(--red);margin-bottom:6px">⚠️ '+errores.length+' error(es):</div>';
      errores.forEach(function(er){ html += '<div style="font-size:11px;color:var(--red)">'+er+'</div>'; });
      html += '</div>';
    }

    if(validosClientes.length>0){
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
      html += '<div style="background:rgba(91,141,238,.1);border:1px solid rgba(91,141,238,.25);border-radius:8px;padding:10px;text-align:center">';
      html += '<div style="font-size:20px;font-weight:500;color:var(--blue)">'+validosClientes.length+'</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">Clientes</div></div>';
      html += '<div style="background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.25);border-radius:8px;padding:10px;text-align:center">';
      html += '<div style="font-size:20px;font-weight:500;color:var(--green)">'+validosPrestamos.length+'</div>';
      html += '<div style="font-size:11px;color:var(--txt3)">Con préstamo</div></div>';
      html += '</div>';

      html += '<div style="max-height:180px;overflow-y:auto;margin-bottom:12px">';
      validosClientes.slice(0,8).forEach(function(c,idx){
        const p = validosPrestamos.find(function(x){ return x.cliente_id===c.id; });
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">';
        html += '<span>'+c.nombre+'</span>';
        html += '<span style="color:'+(p?'var(--green)':'var(--txt3)')+';">'+(p?fmt(p.monto_prestado)+' · '+p.tasa_interes_mensual+'%':'Solo cliente')+'</span>';
        html += '</div>';
      });
      if(validosClientes.length>8) html += '<div style="font-size:11px;color:var(--txt3);padding-top:4px">...y '+(validosClientes.length-8)+' más</div>';
      html += '</div>';

      html += '<button id="btn-confirmar-import" style="width:100%;background:var(--gold);color:#1a1200;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:500;cursor:pointer">Importar '+validosClientes.length+' clientes'+(validosPrestamos.length>0?' + '+validosPrestamos.length+' préstamos':'')+'</button>';
    } else if(errores.length===0){
      html += '<div style="text-align:center;color:var(--txt3);font-size:13px;padding:16px">No se encontraron datos válidos</div>';
    }
    html += '</div>';
    preview.innerHTML = html;

    const btnConf = document.getElementById('btn-confirmar-import');
    if(btnConf){
      btnConf.addEventListener('click', async function(){
        this.disabled = true;
        this.textContent = 'Importando...';
        let okClientes = 0, okPrestamos = 0, errores2 = 0;

        if(_supabase){
          // ── Insertar clientes en Google Sheets uno a uno ──
          for(let i=0; i<validosClientes.length; i++){
            const c = validosClientes[i];
            const localId = c.id; // guardar ID temporal local
            const payload = {nombre:c.nombre, telefono:c.telefono||null,
              tipo_cliente:c.tipo_cliente, identificacion:c.identificacion||null,
              observaciones:c.observaciones||null, estado:'activo'};
            let data;
            try{ data = await gsWrite('clientes','create',payload); }
            catch(e){ errores2++; console.error('Cliente error:', e.message); continue; }
            // Reemplazar ID temporal con UUID real usando localId
            validosPrestamos.forEach(function(p){
              if(p.cliente_id === localId) p.cliente_id = data.id;
            });
            okClientes++;
          }
          // ── Insertar préstamos en Google Sheets (num_credito lo asigna el backend) ──
          if(validosPrestamos.length > 0){
            for(let i=0; i<validosPrestamos.length; i++){
              const p = validosPrestamos[i];
              if(!p.cliente_id){ errores2++; continue; }
              const payload = {cliente_id:p.cliente_id,
                monto_prestado:p.monto_prestado, tasa_interes_mensual:p.tasa_interes_mensual,
                frecuencia_cobro:p.frecuencia_cobro, num_cuotas:p.num_cuotas,
                valor_cuota:p.valor_cuota, interes_total:p.interes_total,
                total_a_pagar:p.total_a_pagar, fecha_inicio:p.fecha_inicio,
                fecha_vencimiento:p.fecha_vencimiento, estado:'activo',
                observaciones:p.observaciones||null};
              try{ await gsWrite('prestamos','create',payload); okPrestamos++; }
              catch(e){ errores2++; console.error('Préstamo error:', e.message); }
            }
          }
          // Sync cache local
          await syncData(true);
        } else {
          // ── Modo local ──
          const existentesC = DB.clientes();
          DB.saveClientes(existentesC.concat(validosClientes));
          if(validosPrestamos.length > 0){
            const existentesP = DB.prestamos();
            let nextNum = existentesP.length > 0
              ? Math.max.apply(null, existentesP.map(function(p){ return p.num_credito||0; })) + 1 : 1;
            validosPrestamos.forEach(function(p){ p.num_credito = nextNum++; });
            DB.savePrestamos(existentesP.concat(validosPrestamos));
          }
          okClientes = validosClientes.length;
          okPrestamos = validosPrestamos.length;
        }

        navigate('clientes',null,false);
        setTimeout(function(){
          let msg = '✅ '+okClientes+' clientes';
          if(okPrestamos > 0) msg += ' y '+okPrestamos+' préstamos';
          msg += ' importados';
          if(errores2 > 0) msg += ' ('+errores2+' errores)';
          mostrarToast(msg);
        },50);
      });
    }
  };
  reader.readAsText(file, 'UTF-8');
}

let _syncInProgress = false;
let _lastSync = 0;

async function syncData(force){
  if(!_supabase) return;
  const ahora = Date.now();
  if(!force && _syncInProgress) return;
  if(!force && (ahora - _lastSync) < 10000) return; // no sincronizar más de 1 vez cada 10s
  _syncInProgress = true;
  try {
    const data = await gsSyncAll();
    DB._set('clientes', data.clientes || []);
    DB._set('prestamos', data.prestamos || []);
    DB._set('abonos', data.abonos || []);
    DB._set('gastos', data.gastos || []);
    DB._set('capital_movimientos', data.capitalMovimientos || []);
    DB._set('capital_distribucion', data.capitalDistribucion || {efectivo:0,banco:0,notas:''});
    _lastSync = Date.now();
  } catch(e){ console.error('Sync error:', e); }
  finally { _syncInProgress = false; }
}
