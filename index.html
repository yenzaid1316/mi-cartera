<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="description" content="Gestion de cartera de prestamos">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mi%20Cartera%22%2C%22short_name%22%3A%22Cartera%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0d0f%22%2C%22theme_color%22%3A%22%230d0d0f%22%7D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cartera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* superficies */
  --bg:#0d0d0f; --bg2:#16161a; --bg3:#1e1e23; --bg4:#2a2a31;
  --border:#3a3a42;        /* divisiones sutiles */
  --border2:#6b6b78;       /* bordes de controles: contraste AA */
  /* texto */
  --txt:#f0ede8; --txt2:#bdb8b1; --txt3:#9a948c;
  /* semanticos */
  --gold:#c9a96e; --gold2:#e8c99a;      /* marca / capital propio */
  --green:#5cc48c; --green-d:#2d7a52;   /* cobrado / recuperado */
  --amber:#e3b23c;                       /* pendiente / en calle */
  --red:#ef7373; --red-d:#8c2b2b;       /* mora / gasto */
  --blue:#7aa5f5;                        /* neutro / referencia */
  --violet:#a98cf0;
  /* radios */
  --r0:5px; --r2:9px; --r:14px; --r3:999px;
  /* tipografia */
  --f1:11px; --f2:12px; --f3:13px; --f4:15px; --f5:17px; --f6:22px; --f7:32px;
  --shadow:0 6px 28px rgba(0,0,0,.55);
  --tap:44px;
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.5; font-weight:400;
  min-height:100dvh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:500;line-height:1.15}

/* ── NUMEROS PROTAGONISTAS ── */
.num-big{font-family:'DM Serif Display',serif;font-weight:400;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;position:relative}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(22,22,26,.94);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tap);padding:9px 2px 12px;background:none;border:none;color:var(--txt3);cursor:pointer;transition:color .18s;font-size:var(--f1);font-family:inherit;font-weight:500;letter-spacing:.01em}
.nav-btn svg{width:22px;height:22px;stroke-width:1.7}
.nav-btn.active{color:var(--gold)}
.nav-btn.active svg{stroke:var(--gold)}
.nav-dot{position:absolute;top:6px;right:50%;margin-right:-20px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--r3);background:var(--red);color:#2a0808;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}

/* ── FOCO VISIBLE (accesibilidad) ── */
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:var(--r0)}

/* ── HEADER ── */
.page-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.page-title{font-size:26px;line-height:1.1}
.page-subtitle{font-size:var(--f3);color:var(--txt2);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-sm{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi-label{font-size:var(--f2);color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:500}
.kpi-value{font-family:'DM Serif Display',serif;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:var(--f2);color:var(--txt2);margin-top:5px}
.kpi.gold{border-color:rgba(201,169,110,.32);background:rgba(201,169,110,.06)}
.kpi.green{border-color:rgba(92,196,140,.32);background:rgba(92,196,140,.06)}
.kpi.red{border-color:rgba(239,115,115,.32);background:rgba(239,115,115,.06)}
.kpi.amber{border-color:rgba(227,178,60,.32);background:rgba(227,178,60,.06)}

/* ── STAT (mini indicador reutilizable) ── */
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:11px 13px}
.stat-l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt3);margin-bottom:5px;font-weight:500}
.stat-v{font-family:'DM Serif Display',serif;font-size:var(--f5);line-height:1.1;font-variant-numeric:tabular-nums}
.stat-s{font-size:var(--f1);color:var(--txt3);margin-top:3px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── SECTIONS ── */
.section{padding:0 20px;margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.section-title{font-size:var(--f3);color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;font-weight:500}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r2);cursor:pointer;font-size:var(--f4);font-weight:500;font-family:inherit;transition:background .15s,transform .12s;padding:13px 20px;min-height:var(--tap)}
.btn-primary{background:var(--gold);color:#1a1200}
.btn-primary:active{background:var(--gold2);transform:scale(.97)}
.btn-secondary{background:var(--bg3);color:var(--txt);border:1px solid var(--border2)}
.btn-secondary:active{background:var(--bg4);transform:scale(.97)}
.btn-danger{background:rgba(239,115,115,.14);color:var(--red);border:1px solid rgba(239,115,115,.34)}
.btn-success{background:rgba(92,196,140,.14);color:var(--green);border:1px solid rgba(92,196,140,.34)}
.btn-full{width:100%;padding:14px}
.btn-sm{padding:8px 13px;font-size:var(--f2);min-height:38px}
/* area tactil ampliada sin cambiar el aspecto */
.btn-sm::after,.chip::after{content:'';position:absolute;inset:-6px;border-radius:inherit}
.btn-sm,.chip{position:relative}
.btn-icon{width:var(--tap);height:var(--tap);padding:0;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;font-family:inherit}
.btn-icon:active{background:var(--bg4)}

/* ── CHIP / FILTRO ── */
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r3);font-size:var(--f2);font-weight:500;font-family:inherit;cursor:pointer;background:var(--bg3);color:var(--txt2);border:1px solid var(--border);transition:all .15s;white-space:nowrap;min-height:36px}
.chip.active{background:rgba(201,169,110,.16);color:var(--gold);border-color:rgba(201,169,110,.45)}

/* ── FAB ── */
.fab{position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--gold);color:#1a1200;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(201,169,110,.38);z-index:99;transition:transform .18s}
.fab:active{transform:scale(.93)}
.fab svg{width:24px;height:24px;stroke-width:2.2}

/* ── LISTA ── */
.item-list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;color:inherit;min-height:var(--tap)}
.item:active{border-color:var(--border2);background:var(--bg3)}
.item-avatar{position:relative;width:42px;height:42px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:var(--f4);font-weight:500;color:var(--gold);flex-shrink:0}
.item-avatar svg.ring{position:absolute;inset:-3px;width:48px;height:48px;transform:rotate(-90deg)}
.item-body{flex:1;min-width:0}
.item-name{font-size:var(--f4);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-detail{font-size:var(--f3);color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{text-align:right;flex-shrink:0}
.item-amount{font-size:var(--f4);font-weight:500;font-variant-numeric:tabular-nums}
.item-status{font-size:var(--f2);margin-top:3px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r3);font-size:var(--f2);font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge-green{background:rgba(92,196,140,.14);color:var(--green)}
.badge-red{background:rgba(239,115,115,.14);color:var(--red)}
.badge-amber{background:rgba(227,178,60,.14);color:var(--amber)}
.badge-blue{background:rgba(122,165,245,.14);color:var(--blue)}
.badge-gray{background:var(--bg3);color:var(--txt2)}
.badge-plain::before{display:none}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:var(--f3);color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);color:var(--txt);font-size:16px;font-family:inherit;padding:13px 14px;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;min-height:var(--tap)}
.form-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.16)}
.form-input::placeholder{color:var(--txt3)}
.form-input.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,115,115,.14)}
select.form-input{cursor:pointer}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:var(--f1);color:var(--txt3);margin-top:5px}
.form-err{font-size:var(--f2);color:var(--red);margin-top:5px;display:none}
.form-err.show{display:block}

/* ── MODAL / DRAWER ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;opacity:0;pointer-events:none!important;transition:opacity .25s;backdrop-filter:blur(4px)}
.overlay.show{opacity:1!important;pointer-events:all!important}
.drawer{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--bg2);border-radius:22px 22px 0 0;z-index:201;transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.drawer.show{transform:translateX(-50%) translateY(0)}
.drawer-handle{width:38px;height:4px;background:var(--bg4);border-radius:var(--r3);margin:12px auto 4px}
.drawer-title{font-size:23px;padding:8px 20px 16px;font-weight:500}
.drawer-body{padding:0 20px}

.divider{height:1px;background:var(--border);margin:16px 0}

/* ── SEARCH ── */
.search-bar{position:relative;margin:12px 20px}
.search-bar input{padding-left:42px;background:var(--bg3);border:1px solid var(--border2)}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--txt3);pointer-events:none}

/* ── BANNER CAPITAL ── */
.capital-banner{margin:14px 20px 0;background:linear-gradient(140deg,rgba(201,169,110,.15),rgba(201,169,110,.03));border:1px solid rgba(201,169,110,.3);border-radius:var(--r);padding:17px 18px}
.capital-label{font-size:var(--f1);color:var(--gold);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px;font-weight:600}
.capital-amount{font-family:'DM Serif Display',serif;font-size:var(--f7);color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}

/* ── DETALLE ── */
.detail-hero{padding:20px;background:var(--bg2);border-bottom:1px solid var(--border);margin-bottom:16px}
.detail-name{font-size:27px;margin-bottom:4px;font-weight:500}
.detail-meta{font-size:var(--f3);color:var(--txt2)}

/* ── TOGGLE ── */
.toggle-group{display:flex;background:var(--bg3);border-radius:var(--r2);padding:3px;gap:2px;margin-bottom:16px}
.toggle-btn{flex:1;padding:11px 6px;border:none;border-radius:6px;background:none;color:var(--txt2);font-size:var(--f3);font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;min-height:40px}
.toggle-btn.active{background:var(--bg2);color:var(--txt);border:1px solid var(--border2)}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 24px}
.empty-icon{width:54px;height:54px;margin:0 auto 14px;opacity:.32}
.empty-title{font-size:var(--f5);color:var(--txt2);margin-bottom:6px}
.empty-sub{font-size:var(--f3);color:var(--txt3);margin-bottom:18px;max-width:34ch;margin-left:auto;margin-right:auto}

/* ── SKELETON ── */
@keyframes shimmer{0%{background-position:-380px 0}100%{background-position:380px 0}}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:760px 100%;animation:shimmer 1.3s linear infinite;border-radius:var(--r2)}
.sk-row{height:66px;margin-bottom:8px;border-radius:var(--r)}

/* ── ALERT ── */
.alert{border-radius:var(--r2);padding:12px 14px;margin-bottom:10px;font-size:var(--f3);display:flex;align-items:flex-start;gap:9px;line-height:1.45}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.alert-red{background:rgba(239,115,115,.09);border:1px solid rgba(239,115,115,.26);color:var(--red)}
.alert-green{background:rgba(92,196,140,.09);border:1px solid rgba(92,196,140,.26);color:var(--green)}
.alert-amber{background:rgba(227,178,60,.09);border:1px solid rgba(227,178,60,.26);color:var(--amber)}
.alert-blue{background:rgba(122,165,245,.09);border:1px solid rgba(122,165,245,.26);color:var(--blue)}

/* ── MOVIMIENTO ── */
.mov-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.mov-item:last-child{border-bottom:none}
.mov-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mov-ic svg{width:14px;height:14px;stroke-width:2}
.mov-ic.green{background:rgba(92,196,140,.14);color:var(--green)}
.mov-ic.red{background:rgba(239,115,115,.14);color:var(--red)}
.mov-ic.amber{background:rgba(227,178,60,.14);color:var(--amber)}
.mov-ic.gold{background:rgba(201,169,110,.14);color:var(--gold)}
.mov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mov-dot.green{background:var(--green)}.mov-dot.red{background:var(--red)}.mov-dot.amber{background:var(--amber)}
.mov-info{flex:1;min-width:0}
.mov-desc{font-size:var(--f4);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-date{font-size:var(--f2);color:var(--txt3);margin-top:1px}
.mov-monto{font-size:var(--f4);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── BARRA DE PROGRESO ── */
.prog{background:rgba(255,255,255,.07);border-radius:var(--r3);height:6px;overflow:hidden}
.prog-f{height:100%;border-radius:var(--r3);transition:width .5s ease}
.prog-head{display:flex;justify-content:space-between;font-size:var(--f1);color:var(--txt3);margin-bottom:5px}

/* ── ESTADO DE CONEXION ── */
#netbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:150;font-size:var(--f2);text-align:center;padding:6px 12px;display:none;font-weight:500}
#netbar.show{display:block}
#netbar.off{background:rgba(239,115,115,.92);color:#2a0808}
#netbar.pend{background:rgba(227,178,60,.92);color:#2a1e00}

/* ── ANIMACIONES ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease forwards}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:var(--r3)}

/* ── ESCRITORIO ── */
@media(min-width:900px){
  body{background:radial-gradient(1100px 600px at 50% -10%,#17171c 0%,var(--bg) 60%)}
  #app{max-width:520px;box-shadow:0 0 0 1px var(--border),0 30px 90px rgba(0,0,0,.6);min-height:100dvh}
  #navbar{max-width:520px}
  .drawer{max-width:520px}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="netbar" role="status" aria-live="polite"></div>
<div id="app">
  <div id="screen" role="main"></div>
  <nav id="navbar" aria-label="Navegacion principal">
    <button class="nav-btn active" onclick="navigate('dashboard')" id="nav-dashboard" aria-label="Inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="navigate('recordatorios')" id="nav-recordatorios" aria-label="Cobros pendientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="nav-cobros-badge"></span>
      Cobros
    </button>
    <button class="nav-btn" onclick="navigate('clientes')" id="nav-clientes" aria-label="Clientes y prestamos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
      Clientes
    </button>
    <button class="nav-btn" onclick="navigate('capital')" id="nav-capital" aria-label="Capital y gastos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
      Capital
    </button>
    <button class="nav-btn" onclick="navigate('mas')" id="nav-mas" aria-label="Mas opciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      Más
    </button>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Panel" tabindex="-1">
  <div class="drawer-handle"></div>
  <div id="drawer-content"></div>
</div>

<script>
// ═══════════════════════════════════════
// GOOGLE SHEETS BACKEND (Apps Script)
// ═══════════════════════════════════════
//
//   SEGURIDAD — LÉEME
//  Esta clave viaja dentro del archivo: cualquiera que abra el HTML puede verla.
//  Antes de compartir la app con alguien (o subirla a un hosting):
//    1. Cambia SECRET en el Apps Script por una contraseña NUEVA y larga,
//       que no uses en ningún otro servicio.
//    2. Vuelve a implementar el Apps Script (Nueva versión).
//    3. Pega aquí la clave nueva y la URL nueva.
//  Desde la v2 la clave ya NO viaja en la dirección web (antes quedaba
//  registrada en el historial del navegador): ahora va dentro del POST.
//
const GS_URL    = "https://script.google.com/macros/s/AKfycbzggkYkCi4PACSwZzgFomADEpkdMkoNWu9OBA62EoT84wiY3gL0wW_U-KGDX9-qSgHj2Q/exec";
const GS_SECRET = "Ymls1316*";   // debe ser IDÉNTICA a SECRET en el Apps Script

async function gsSyncAll(){
  const ctrl = new AbortController();
  const to = setTimeout(function(){ ctrl.abort(); }, 25000);
  try{
    // POST en vez de GET: la clave deja de quedar en la URL/historial.
    const res = await fetch(GS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({secret:GS_SECRET, action:'syncAll'}),
      signal: ctrl.signal
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error de sincronización');
    return json.data;
  } catch(e){
    if(e.name === 'AbortError') throw new Error('El servidor tardó demasiado');
    // Compatibilidad: si el backend todavía es la versión vieja, reintenta por GET
    if(/desconocida|Unexpected|JSON/i.test(e.message||'')){
      const r2 = await fetch(GS_URL + '?secret=' + encodeURIComponent(GS_SECRET) + '&action=syncAll');
      const j2 = await r2.json();
      if(!j2.ok) throw new Error(j2.error || 'Error de sincronización');
      return j2.data;
    }
    throw e;
  } finally { clearTimeout(to); }
}

async function gsWrite(table, action, data){
  if(!navigator.onLine) throw new Error('Sin conexión');
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 25000);
  try{
    const res = await fetch(GS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS en Apps Script
      body: JSON.stringify({secret:GS_SECRET, table, action, data}),
      signal: ctrl.signal
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Error al guardar');
    return json.data;
  } catch(e){
    if(e.name==='AbortError') throw new Error('El servidor tardó demasiado');
    throw e;
  } finally { clearTimeout(to); }
}

// COLA OFFLINE — ninguna escritura se pierde por falta de señal
// ═══════════════════════════════════════
const COLA_KEY = 'cola_pendientes';
function colaLeer(){ try{ return JSON.parse(localStorage.getItem(COLA_KEY)||'[]'); }catch(e){ return []; } }
function colaGuardar(c){ try{ localStorage.setItem(COLA_KEY, JSON.stringify(c)); }catch(e){} }
function colaEncolar(table, action, data){
  const c = colaLeer();
  c.push({id:uid(), table, action, data, ts:Date.now()});
  colaGuardar(c); pintarNetbar();
  return c.length;
}
let _colaCorriendo = false;
async function colaProcesar(){
  if(_colaCorriendo || !navigator.onLine) return 0;
  let c = colaLeer();
  if(!c.length) return 0;
  _colaCorriendo = true;
  let ok=0, quedan=[];
  for(const item of c){
    try{ await gsWrite(item.table, item.action, item.data); ok++; }
    catch(e){ quedan.push(item); }
  }
  colaGuardar(quedan);
  _colaCorriendo = false;
  pintarNetbar();
  if(ok){ await syncData(true); toastOk(ok+' cambio'+(ok>1?'s':'')+' pendiente'+(ok>1?'s':'')+' enviado'+(ok>1?'s':'')); }
  return ok;
}
/** Escribe en la nube; si no hay señal lo deja en cola y avisa. Devuelve {ok, encolado, data}. */
async function guardarRemoto(table, action, data, etiqueta){
  try{
    const r = await gsWrite(table, action, data);
    invalidarCache();
    return {ok:true, encolado:false, data:r};
  }catch(e){
    const sinRed = !navigator.onLine || /networkerror|failed to fetch|sin conexión|tardó/i.test(e.message||'');
    if(sinRed){
      colaEncolar(table, action, data);
      mostrarToast('Sin conexión — "'+(etiqueta||'el cambio')+'" se enviará al recuperar señal');
      return {ok:false, encolado:true, error:e};
    }
    toastErr(e.message||'No se pudo guardar');
    return {ok:false, encolado:false, error:e};
  }
}

let _syncEstado = {ultimo:0, error:null, cargando:false};
function haceCuanto(ts){
  if(!ts) return 'nunca';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s < 60) return 'hace un momento';
  if(s < 3600) return 'hace '+Math.floor(s/60)+' min';
  if(s < 86400) return 'hace '+Math.floor(s/3600)+' h';
  return 'hace '+Math.floor(s/86400)+' días';
}
function pintarNetbar(){
  const bar = document.getElementById('netbar');
  if(!bar) return;
  const pend = colaLeer().length;
  if(!navigator.onLine){
    bar.className='show off';
    bar.innerHTML = ico('wifiOff',13)+' Sin conexión'+(pend?' · '+pend+' pendiente'+(pend>1?'s':''):'')+' · datos '+haceCuanto(_syncEstado.ultimo);
  } else if(pend){
    bar.className='show pend';
    bar.innerHTML = ico('clock',13)+' '+pend+' cambio'+(pend>1?'s':'')+' por enviar';
  } else {
    bar.className=''; bar.innerHTML='';
  }
  const et = document.getElementById('sync-estado');
  if(et) et.textContent = navigator.onLine ? 'Actualizado '+haceCuanto(_syncEstado.ultimo) : 'Sin conexión';
}
window.addEventListener('online', function(){ pintarNetbar(); colaProcesar(); });
window.addEventListener('offline', pintarNetbar);
setInterval(pintarNetbar, 30000);

  // ── LocalStorage helpers (caché) ──────────────────
  _get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } },
  _set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } },

  // ── CLIENTES ─────────────────────────────────────────────────

  // ── PRÉSTAMOS ────────────────────────────────────────────────

  // ── ABONOS ───────────────────────────────────────────────────

  distribucion(){ return this._get('capital_distribucion')||{efectivo:0,banco:0,notas:''}; },
  async saveDistribucion(d){
    const current = this.distribucion();
    const payload = {...current, ...d};
    const r = await guardarRemoto('capitalDistribucion', payload.id?'update':'create', payload, 'distribución de capital');
    if(r.ok){ this._set('capital_distribucion', r.data && r.data.id ? r.data : payload); return true; }
    if(r.encolado){ this._set('capital_distribucion', payload); return true; }
    return false;
  },

  // ── COMPAT: sync helpers para código existente ───────────────
  clientes(){ return this._get('clientes')||[]; },
  prestamos(){ return this._get('prestamos')||[]; },
  abonos(){ return this._get('abonos')||[]; },
  gastos(){ return this._get('gastos')||[]; },
  capital(){ return this._get('capital_movimientos')||[]; },
  saveClientes(d){ return this._set('clientes',d); },
  savePrestamos(d){ return this._set('prestamos',d); },
  saveAbonos(d){ return this._set('abonos',d); },
  saveGastos(d){ return this._set('gastos',d); },
  saveCapital(d){ return this._set('capital_movimientos',d); },

  // ── CIERRES ──────────────────────────────────────────────
  cierres(){ return this._get('cierres_financieros')||[]; },
  saveCierres(d){ return this._set('cierres_financieros',d); },
  // Los cierres ahora también viajan a la nube (antes solo vivían en este navegador)
  async guardarCierre(c){
    const r = await guardarRemoto('cierres','create', c, 'cierre financiero');
    const lista = this.cierres();
    lista.push(r.ok && r.data && r.data.id ? r.data : {...c, id:uid(), _pendiente:!r.ok});
    this._set('cierres_financieros', lista);
    return r.ok || r.encolado;
  },
  async eliminarCierre(id){
    const r = await guardarRemoto('cierres','delete', {id}, 'eliminación del cierre');
    if(r.ok || r.encolado) this._set('cierres_financieros', this.cierres().filter(c=>c.id!==id));
    return r.ok || r.encolado;
  },

  test(){
    try{ localStorage.setItem('_test','1'); localStorage.removeItem('_test'); return true; }
    catch(e){ return false; }
  }
};

function ico(name, size, extra){
  const p = ICO_PATHS[name] || ICO_PATHS.info;
  const sz = size || 16;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '+(extra||'')+'>'+p+'</svg>';
}
// Mini-gráficos SVG
function sparkline(vals, color, w, h){
  const W=w||120, H=h||34;
  if(!vals || vals.length<2) return '<svg width="100%" height="'+H+'"></svg>';
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rg=(mx-mn)||1;
  const pts = vals.map((v,i)=>[ (i/(vals.length-1))*W, H-4-((v-mn)/rg)*(H-8) ]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = d+' L'+W+' '+H+' L0 '+H+' Z';
  const id = 'sg'+Math.abs(vals.length*97+Math.round(mx));
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block" aria-hidden="true">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="2.6" fill="'+color+'"/></svg>';
}
function donut(segmentos, size){
  const S = size||118, R = S/2-11, C = 2*Math.PI*R;
  const tot = segmentos.reduce((s,x)=>s+Math.max(0,x.valor),0);
  if(tot<=0) return '<svg width="'+S+'" height="'+S+'"><circle cx="'+S/2+'" cy="'+S/2+'" r="'+R+'" fill="none" stroke="var(--bg4)" stroke-width="13"/></svg>';
  let off=0, arcs='';
  segmentos.forEach(function(sg){
    const frac = Math.max(0,sg.valor)/tot, len = frac*C;
    if(len<=0) return;
    arcs += '<circle cx="'+S/2+'" cy="'+S/2+'" r="'+R+'" fill="none" stroke="'+sg.color+'" stroke-width="13" '+
            'stroke-dasharray="'+(len-1.5>0?len-1.5:len)+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" stroke-linecap="butt"/>';
    off += len;
  });
  return '<svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" aria-hidden="true" style="transform:rotate(-90deg)">'+
    '<circle cx="'+S/2+'" cy="'+S/2+'" r="'+R+'" fill="none" stroke="var(--bg3)" stroke-width="13"/>'+arcs+'</svg>';
}
function anilloProgreso(pct, color){
  const R=21, C=2*Math.PI*R, p=Math.max(0,Math.min(100,pct||0));
  return '<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="'+R+'" fill="none" stroke="var(--bg4)" stroke-width="2.5"/>'+
    '<circle cx="24" cy="24" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="'+(C*p/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg>';
}

// Fecha local de Bogotá desplazada n días — reemplaza los toISOString() que causaban desfase nocturno
function fechaMas(dias, base){
  const d = new Date((base||today())+'T12:00:00');
  d.setDate(d.getDate() + (dias||0));
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function escJs(v){ return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r?\n/g,' '); }
// Lee cifras en formato colombiano: 1.500.000 · 1.500.000,50 · 1,5 · $ 200.000
function parseNum(v){
  if(typeof v === 'number') return isFinite(v)?v:0;
  if(v===null||v===undefined) return NaN;
  let t = String(v).trim().replace(/[^\d.,\-]/g,'');
  if(!t) return NaN;
  const hasC = t.includes(','), hasP = t.includes('.');
  if(hasC && hasP){                       // 1.500.000,50  ó  1,500,000.50
    t = t.lastIndexOf(',') > t.lastIndexOf('.')
      ? t.replace(/\./g,'').replace(',', '.')
      : t.replace(/,/g,'');
  } else if(hasC){                        // 1.500,50 ó 1,500
    const dec = t.split(',')[1] || '';
    t = dec.length === 3 && !/^0/.test(dec) ? t.replace(/,/g,'') : t.replace(',', '.');
  } else if(hasP){                        // 1.500.000 ó 1500.50
    const parts = t.split('.');
    const dec = parts[parts.length-1];
    t = (parts.length > 2 || (dec.length === 3 && parts[0] !== '0')) ? t.replace(/\./g,'') : t;
  }
  const n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}
const TOL = 1; // tolerancia de 1 peso: evita saldos fantasma por redondeo

function nextNumPrestamo(){
  const ps = DB.prestamos();
  if(!ps.length) return 1;
  return Math.max.apply(null, ps.map(p=>Number(p.num_credito)||0)) + 1;
}

function calcPrestamo(monto, tasa, cuotas, frecDias){
  // Interés FIJO sobre el capital inicial, prorrateado al período de cada cuota.
  // Convención del negocio: 1 mes = 4 semanas (semanal), 2 quincenas (quincenal) o 1 mes calendario (mensual).
  const freq  = Number(frecDias)||30;
  const nc    = Math.max(1, Number(cuotas)||1);
  const periodosPorMes = freq===7 ? 4 : freq===15 ? 2 : freq===30 ? 1 : (30/freq);
  const intPorCuota = monto * (tasa/100) / periodosPorMes;
  const intTotal    = intPorCuota * nc;
  const total       = monto + intTotal;
  const valorCuota  = total / nc;
  const intMensual  = monto * (tasa/100);
  // Tasa efectiva real sobre saldo decreciente (referencia interna, no se le cobra al cliente)
  const saldoProm   = monto * (nc + 1) / (2 * nc);
  const tasaEfMes   = saldoProm > 0 ? (intPorCuota / saldoProm) * periodosPorMes * 100 : 0;
  return {intMensual, intPorCuota, intTotal, total, valorCuota, tasaEfMes};
}

// MOTOR DE CÁLCULO  —  base: tabla de cuotas + reparto de abonos por monto
// ═══════════════════════════════════════
let _cacheCalc = {v:'', map:{}};
function _cacheKey(){
  return (localStorage.getItem('prestamos')||'').length + ':' +
         (localStorage.getItem('abonos')||'').length + ':' + today();
}
function _memo(id, fn){
  const v = _cacheKey();
  if(_cacheCalc.v !== v){ _cacheCalc = {v:v, map:{}}; }
  if(!(id in _cacheCalc.map)) _cacheCalc.map[id] = fn();
  return _cacheCalc.map[id];
}
function invalidarCache(){ _cacheCalc = {v:'', map:{}}; }

let _abonosPorPrestamo = null, _abonosVer = '';
function abonosDe(prestamoId){
  const v = _cacheKey();
  if(_abonosVer !== v){
    _abonosVer = v; _abonosPorPrestamo = {};
    DB.abonos().forEach(a=>{
      (_abonosPorPrestamo[a.prestamo_id] = _abonosPorPrestamo[a.prestamo_id] || []).push(a);
    });
    Object.keys(_abonosPorPrestamo).forEach(k=>{
      _abonosPorPrestamo[k].sort((x,y)=>String(x.fecha_abono||'').localeCompare(String(y.fecha_abono||'')));
    });
  }
  return _abonosPorPrestamo[prestamoId] || [];
}

/**
 * Corazón del sistema. Genera la tabla de cuotas y reparte los abonos EN CASCADA
 * por monto acumulado (no por índice), separando interés y capital en cada uno.
 */
function planPrestamo(p){
  if(!p || !p.id) return {cuotas:[], abonos:[], interesCobrado:0, capitalRecuperado:0, abonado:0, saldo:0, cuotasVencidas:0, montoVencido:0, diasAtraso:0, proximaCuota:null, semanasMora:0, tasaSemanalMora:0, recargoMora:0};
  return _memo('plan:'+p.id, function(){
    const freq   = Number(p.frecuencia_cobro)||30;
    const nc     = Math.max(1, Number(p.num_cuotas)||1);
    const monto  = Number(p.monto_prestado)||0;
    const totalP = Number(p.total_a_pagar) || monto;
    const intTot = Number(p.interes_total) || Math.max(0, totalP - monto);
    const intPorCuota = intTot / nc;
    const capPorCuota = monto / nc;
    const hoy = today();

    const cuotas = [];
    for(let i=0;i<nc;i++){
      cuotas.push({
        numero:i+1,
        fecha: fechaMas(freq*(i+1), p.fecha_inicio),
        capital: capPorCuota, interes: intPorCuota, total: capPorCuota+intPorCuota,
        pagadoCapital:0, pagadoInteres:0, pagado:0,
        pagada:false, parcial:false, vencida:false, diasRetraso:0, fechaPago:null
      });
    }

    // Reparto en cascada: cada abono paga primero interés y luego capital de la cuota más antigua pendiente
    const abonos = abonosDe(p.id).map(a=>({...a, aInteres:0, aCapital:0, aExceso:0}));
    let ci = 0;
    abonos.forEach(a=>{
      let disp = Math.max(0, Number(a.monto)||0);
      while(disp > TOL && ci < cuotas.length){
        const c = cuotas[ci];
        const faltaInt = Math.max(0, c.interes - c.pagadoInteres);
        const aplInt = Math.min(disp, faltaInt);
        c.pagadoInteres += aplInt; a.aInteres += aplInt; disp -= aplInt;
        const faltaCap = Math.max(0, c.capital - c.pagadoCapital);
        const aplCap = Math.min(disp, faltaCap);
        c.pagadoCapital += aplCap; a.aCapital += aplCap; disp -= aplCap;
        c.pagado = c.pagadoInteres + c.pagadoCapital;
        if(c.pagado >= c.total - TOL){ c.pagada = true; c.fechaPago = a.fecha_abono || null; ci++; }
        else { c.parcial = c.pagado > 0; break; }
      }
      a.aExceso = disp > TOL ? disp : 0;   // pagó de más: queda registrado, no se pierde
    });

    cuotas.forEach(c=>{
      c.vencida = !c.pagada && c.fecha < hoy;
      c.diasRetraso = c.pagada
        ? Math.max(0, diffDays(c.fecha, c.fechaPago || c.fecha))
        : (c.vencida ? diffDays(c.fecha, hoy) : 0);
    });

    const abonado = abonos.reduce((t,a)=>t+(Number(a.monto)||0),0);
    const interesCobrado = Math.min(intTot, abonos.reduce((t,a)=>t+a.aInteres,0));
    const capitalRecuperado = Math.min(monto, abonos.reduce((t,a)=>t+a.aCapital,0));
    const vencidas = cuotas.filter(c=>c.vencida);
    const prox = cuotas.find(c=>!c.pagada);
    const saldoFinal = Math.max(0, totalP - abonado);

    // Recargo por mora — SOLO informativo, no se resta del saldo real ni entra en la cascada de abonos.
    // Solo aplica cuando ya venció el préstamo COMPLETO (no por una cuota intermedia vencida).
    // Base: saldo total pendiente. Tasa: la misma del préstamo, por semana (1 mes = 4 semanas, igual que calcPrestamo).
    const diasVencidoTotal = (p.fecha_vencimiento && hoy > p.fecha_vencimiento) ? diffDays(p.fecha_vencimiento, hoy) : 0;
    const semanasMora = Math.floor(diasVencidoTotal / 7);
    const tasaSemanalMora = (Number(p.tasa_interes_mensual)||0) / 100 / 4;
    const recargoMora = (saldoFinal > TOL && semanasMora > 0) ? saldoFinal * tasaSemanalMora * semanasMora : 0;

    return {
      cuotas, abonos,
      interesCobrado, capitalRecuperado, abonado,
      excesoPagado: abonos.reduce((t,a)=>t+a.aExceso,0),
      saldo: saldoFinal,
      capitalPendiente: Math.max(0, monto - capitalRecuperado),
      interesPendiente: Math.max(0, intTot - interesCobrado),
      cuotasVencidas: vencidas.length,
      montoVencido: vencidas.reduce((t,c)=>t+(c.total-c.pagado),0),
      diasAtraso: vencidas.length ? Math.max.apply(null, vencidas.map(c=>c.diasRetraso)) : 0,
      proximaCuota: prox || null,
      semanasMora, tasaSemanalMora, recargoMora
    };
  });
}

// Compatibilidad: la tabla de amortización ahora sale del plan real
function calcAmortizacion(p){
  return planPrestamo(p).cuotas.map(c=>({
    numero:c.numero, fecha:c.fecha, capital:c.capital, interes:c.interes, total:c.total,
    pagada:c.pagada, parcial:c.parcial, vencida:c.vencida, diasRetraso:c.diasRetraso,
    fechaPago:c.fechaPago, montoPagado:c.pagado, saldoCuota:Math.max(0,c.total-c.pagado)
  }));
}

function estadoPrestamo(p){
  if(!p) return 'activo';
  if(p.estado === 'anulado') return 'anulado';
  const pl = planPrestamo(p);
  if(p.estado === 'pagado' || pl.saldo <= TOL) return 'pagado';
  if(pl.cuotasVencidas > 0) return 'mora';   // por CUOTA vencida, no por vencimiento final
  return 'activo';
}

function saldoPrestamo(p){ return planPrestamo(p).saldo; }
function moraInfo(p){
  const pl = planPrestamo(p);
  return {cuotas:pl.cuotasVencidas, monto:pl.montoVencido, dias:pl.diasAtraso};
}

// ── Movimiento de caja real ──────────────────────────────
function capitalDisponible(){
  return _memo('capital', function(){
    const movs = DB.capital();
    const inyectado = movs.reduce((s,m)=> m.tipo==='retiro' ? s-(Number(m.monto)||0) : s+(Number(m.monto)||0), 0);
    const gastosTotal = DB.gastos().reduce((s,g)=>s+(Number(g.monto)||0),0);

    let desembolsado=0, cobrado=0, interesesCobrados=0, capitalRecuperado=0, capitalEnCalle=0;
    DB.prestamos().forEach(p=>{
      if(p.estado === 'anulado') return;
      const pl = planPrestamo(p);
      desembolsado      += Number(p.monto_prestado)||0;
      cobrado           += pl.abonado;
      interesesCobrados += pl.interesCobrado;
      capitalRecuperado += pl.capitalRecuperado;
      if(estadoPrestamo(p)==='activo' || estadoPrestamo(p)==='mora') capitalEnCalle += pl.capitalPendiente;
    });

    // Caja real: lo que entró menos lo que salió. Ya NO ignora los abonos recibidos.
    const libre = inyectado + cobrado - desembolsado - gastosTotal;
    const patrimonio = inyectado + interesesCobrados - gastosTotal;   // capital propio total
    const pctUtilizado = (capitalEnCalle + Math.max(0,libre)) > 0
      ? Math.min(100, Math.round((capitalEnCalle/(capitalEnCalle+Math.max(0,libre)))*100)) : 0;

    return {
      total:inyectado, inyectado, interesesCobrados, capitalRecuperado,
      baseCapital:patrimonio, patrimonio,
      prestado:capitalEnCalle, capitalEnCalle, desembolsado, cobrado,
      gastosTotal, libre, deficit: libre < 0, pctUtilizado
    };
  });
}

function resumenCartera(){
  return _memo('resumen', function(){
    const ps = DB.prestamos();
    const clientes = DB.clientes();
    const hoy = today();
    const mesPrefijo = hoy.slice(0,7);   // 'YYYY-MM' — comparación por texto, sin problemas de zona horaria

    let capitalActivo=0, capitalMora=0, interesesCobrados=0, interesesPendientes=0;
    let countActivo=0, countMora=0, countPagado=0, totalPrestado=0, totalRecuperado=0;
    let capitalRecuperado=0, cuotasVencidas=0, montoVencido=0;
    let interesesMes=0, abonosMes=0, capitalMes=0;
    const saldosPorCliente={}, abonosPorCliente={}, proximos7=[];

    ps.forEach(p=>{
      if(p.estado==='anulado') return;
      const est = estadoPrestamo(p);
      const pl  = planPrestamo(p);
      totalPrestado     += Number(p.monto_prestado)||0;
      totalRecuperado   += pl.abonado;
      capitalRecuperado += pl.capitalRecuperado;
      interesesCobrados += pl.interesCobrado;

      if(est==='activo'){ capitalActivo += pl.capitalPendiente; countActivo++; }
      if(est==='mora'){
        capitalMora += pl.capitalPendiente; countMora++;
        cuotasVencidas += pl.cuotasVencidas; montoVencido += pl.montoVencido;
      }
      if(est==='pagado') countPagado++;
      else interesesPendientes += pl.interesPendiente;

      if(est==='activo'||est==='mora'){
        saldosPorCliente[p.cliente_id] = (saldosPorCliente[p.cliente_id]||0) + pl.saldo;
        pl.cuotas.filter(c=>!c.pagada && c.fecha>=hoy && diffDays(hoy,c.fecha)<=7)
          .forEach(c=>proximos7.push({prestamo:p, cuota:c}));
      }

      pl.abonos.forEach(a=>{
        if(String(a.fecha_abono||'').slice(0,7) === mesPrefijo){
          abonosMes    += Number(a.monto)||0;
          interesesMes += a.aInteres;
          capitalMes   += a.aCapital;
          abonosPorCliente[p.cliente_id] = (abonosPorCliente[p.cliente_id]||0) + (Number(a.monto)||0);
        }
      });
    });

    const gastosTotal = DB.gastos().reduce((s,g)=>s+(Number(g.monto)||0),0);
    const gastosMes = DB.gastos()
      .filter(g=>String(g.fecha||'').slice(0,7)===mesPrefijo)
      .reduce((s,g)=>s+(Number(g.monto)||0),0);

    // UTILIDAD = intereses efectivamente cobrados − gastos.  El capital devuelto NO es ganancia.
    const utilidadNeta = interesesCobrados - gastosTotal;
    const utilidadMes  = interesesMes - gastosMes;
    const flujoMes     = abonosMes - gastosMes;   // caja del mes, distinto de utilidad

    const carteraViva  = capitalActivo + capitalMora;   // ambos son capital pendiente: comparables
    const pctMora = carteraViva>0 ? +((capitalMora/carteraViva)*100).toFixed(1) : 0;
    const tasaRecuperacion = totalPrestado>0 ? Math.min(100, Math.round((capitalRecuperado/totalPrestado)*100)) : 0;
    const rendMes = carteraViva>0 ? +((interesesMes/carteraViva)*100).toFixed(1) : 0;
    const cap = capitalDisponible();
    const roi = cap.inyectado>0 ? +((interesesCobrados/cap.inyectado)*100).toFixed(1) : 0;

    const top3 = Object.entries(saldosPorCliente).sort((a,b)=>b[1]-a[1]).slice(0,3)
      .map(([cid,saldo])=>({nombre:(clientes.find(c=>c.id===cid)||{}).nombre||'—', saldo, id:cid}));
    const mejor = Object.entries(abonosPorCliente).sort((a,b)=>b[1]-a[1])[0];
    const clientesActivos = new Set(ps.filter(p=>['activo','mora'].includes(estadoPrestamo(p))).map(p=>p.cliente_id)).size;

    return {
      capitalActivo, capitalMora, carteraViva,
      interesesCobrados, interesesCausados:interesesCobrados, interesesPendientes, interesesMes,
      countActivo, countMora, countPagado, cuotasVencidas, montoVencido,
      gastosTotal, gastosMes, utilidadNeta, utilidadMes, flujoMes,
      pctMora, tasaRecuperacion, roi, rendMes,
      totalPrestado, totalRecuperado, capitalRecuperado, capitalMes,
      top3,
      mejorPagadorNombre: mejor ? ((clientes.find(c=>c.id===mejor[0])||{}).nombre||'—') : null,
      mejorPagadorMonto: mejor ? mejor[1] : 0,
      proximos7, clientesActivos, abonosMes
    };
  });
}

let currentPage = 'dashboard';
let pageHistory = [];

const NAV_DE_PAGINA = {
  dashboard:'dashboard',
  recordatorios:'recordatorios',
  clientes:'clientes', prestamos:'clientes', 'cliente-detalle':'clientes',
  'prestamo-detalle':'clientes', 'nuevo-cliente':'clientes', 'editar-cliente':'clientes',
  'editar-prestamo':'clientes', importar:'clientes', importar_abonos:'clientes',
  capital:'capital', gastos:'capital', movimientos:'capital',
  mas:'mas', flujo:'mas', cierres:'mas'
};
let _ultimoData = null;

function navigate(page, data=null, pushHistory=true){
  if(pushHistory && currentPage !== page) pageHistory.push({page:currentPage, data:_ultimoData});
  if(pageHistory.length > 40) pageHistory.shift();
  currentPage = page; _ultimoData = data;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-' + (NAV_DE_PAGINA[page] || page));
  if(nb) nb.classList.add('active');
  const screen = document.getElementById('screen');
  if(screen) screen.scrollTop = 0;
  try{ history.pushState({p:page}, ''); }catch(e){}

  syncData(false).then(function(ok){ if(ok) refrescarPantalla(); });

  const pages = {
    dashboard: renderDashboard, clientes: renderClientes, prestamos: renderPrestamos,
    capital: renderCapital, gastos: renderGastos, flujo: renderFlujoCaja,
    recordatorios: renderRecordatorios, movimientos: renderMovimientos,
    importar: renderImportarClientes, importar_abonos: renderImportarAbonos,
    cierres: renderCierres, mas: renderMas
  };
  if(page === 'cliente-detalle') renderClienteDetalle(data);
  else if(page === 'prestamo-detalle') renderPrestamoDetalle(data);
  else if(page === 'nuevo-cliente') renderFormCliente(null);
  else if(page === 'editar-cliente') renderFormCliente(data);
  else if(page === 'editar-prestamo') renderFormPrestamo(data);
  else if(pages[page]) pages[page]();
  actualizarBadgeCobros();
}

/** Repinta la pantalla actual conservando su contexto (tras sincronizar o guardar) */
function refrescarPantalla(){
  const p = currentPage, d = _ultimoData;
  const drawerAbierto = document.getElementById('drawer').classList.contains('show');
  if(drawerAbierto) return;   // no repintar debajo de un panel abierto
  navigate(p, d, false);
}

function actualizarBadgeCobros(){
  const el = document.getElementById('nav-cobros-badge');
  if(!el) return;
  let n = 0;
  try{ const r = calcRecordatorios(); n = r.cobrosHoy.length + r.enMora.length; }catch(e){}
  el.className = n>0 ? 'nav-dot' : '';
  el.textContent = n>0 ? (n>99?'99+':String(n)) : '';
}

function goBack(){
  const prev = pageHistory.pop();
  if(prev && prev.page) navigate(prev.page, prev.data, false);
  else navigate('dashboard', null, false);
}

function conectarSyncManual(){
  const btn = document.getElementById('btn-sync-manual');
  if(!btn || btn._on) return;
  btn._on = true;
  btn.addEventListener('click', async function(){
    const svg = this.querySelector('svg');
    if(svg) svg.style.animation = 'spin .9s linear infinite';
    await colaProcesar();
    const ok = await syncData(true);
    if(svg) svg.style.animation = '';
    if(ok){ refrescarPantalla(); toastOk('Datos actualizados'); }
    else toastErr(_syncEstado.error==='offline'?'Sin conexión':'No se pudo sincronizar');
  });
}

function openDrawer(html){
  const dc = document.getElementById('drawer-content');
  const ov = document.getElementById('overlay');
  const dr = document.getElementById('drawer');
  dc.innerHTML = html;
  ov.style.opacity = ''; ov.style.pointerEvents = '';   // limpia estilos inline previos
  ov.classList.add('show'); dr.classList.add('show');
  dr.scrollTop = 0;
  setTimeout(function(){
    const f = dr.querySelector('input,select,textarea,button');
    if(f && !('ontouchstart' in window)) f.focus();
  }, 320);
}
function closeDrawer(){
  const ov = document.getElementById('overlay');
  const dr = document.getElementById('drawer');
  if(ov){ ov.classList.remove('show'); ov.style.opacity=''; ov.style.pointerEvents=''; }
  if(dr){ dr.classList.remove('show'); }
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.getElementById('drawer').classList.contains('show')) closeDrawer();
});

function serieCapital(dias){
  // Reconstruye el saldo de caja diario de los últimos N días
  const n = dias || 30;
  const eventos = [];
  DB.capital().forEach(m=>eventos.push({f:m.fecha, v:(m.tipo==='retiro'?-1:1)*(Number(m.monto)||0)}));
  DB.gastos().forEach(g=>eventos.push({f:g.fecha, v:-(Number(g.monto)||0)}));
  DB.prestamos().forEach(p=>{ if(p.estado!=='anulado') eventos.push({f:p.fecha_inicio, v:-(Number(p.monto_prestado)||0)}); });
  DB.abonos().forEach(a=>eventos.push({f:a.fecha_abono, v:(Number(a.monto)||0)}));
  const hoy = today();
  const desde = fechaMas(-(n-1), hoy);
  let base = 0;
  eventos.forEach(e=>{ if(e.f && e.f < desde) base += e.v; });
  const serie = [];
  for(let d=0; d<n; d++){
    const f = fechaMas(d-(n-1), hoy);
    eventos.forEach(e=>{ if(e.f === f) base += e.v; });
    serie.push(base);
  }
  return serie;
}

function buildClientesList(query){
  // Solo construye y retorna el HTML de la lista — no toca el input
  // Filtrar clientes eliminados (estado inactivo)
  let clientes = DB.clientes().filter(function(c){ return c.estado !== 'inactivo'; });
  if(query) clientes = clientes.filter(function(c){
    return c.nombre.toLowerCase().includes(query.toLowerCase()) ||
           (c.telefono||'').includes(query);
  });

  if(clientes.length === 0){
    return '<div class="empty">' +
      '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="1.2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>' +
      '<div class="empty-title">Sin resultados</div>' +
      '<div class="empty-sub">' + (query ? 'Ningún cliente coincide' : 'Toca el botón + para agregar') + '</div>' +
    '</div>';
  }

  let html = '<div class="item-list">';
  clientes.forEach(function(c){
    const ps = DB.prestamos().filter(function(p){ return p.cliente_id===c.id; });
    const activos = ps.filter(function(p){ return ['activo','mora'].includes(estadoPrestamo(p)); });
    const saldoTotal = activos.reduce(function(s,p){ return s+saldoPrestamo(p); },0);
    const hasMora = activos.some(function(p){ return estadoPrestamo(p)==='mora'; });
    const badge = hasMora
      ? '<span class="badge badge-red">Mora</span>': activos.length > 0
        ? '<span class="badge badge-amber">Activo</span>': '<span class="badge badge-gray">Al día</span>';
    html +=
      '<div class="item" data-cid="' + c.id + '">' +
        '<div class="item-avatar">' + initials(c.nombre) + '</div>' +
        '<div class="item-body">' +
          '<div class="item-name">' + esc(c.nombre) + '</div>' +
          '<div class="item-detail">' + (c.telefono||'Sin teléfono') + ' · ' + c.tipo_cliente + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="item-amount" style="color:' + (saldoTotal>0?'var(--txt)':'var(--txt3)') + '">' + fmt(saldoTotal) + '</div>' +
          '<div class="item-status">' + badge + '</div>' +
        '</div>' +
      '</div>';
  });
  return html + '</div>';
}

var _prestFiltroActual = 'todos';
var _prestQueryActual  = '';

function filtrarListaPrestamos(query){
  if(query !== undefined) _prestQueryActual = query;
  const q = (_prestQueryActual||'').toLowerCase();
  const ps = DB.prestamos();
  const clientes = DB.clientes();
  const colores = {activo:'var(--amber)',mora:'var(--red)',pagado:'var(--green)',anulado:'var(--txt3)'};
  const labels  = {activo:'Activo',mora:'Mora',pagado:'Pagado',anulado:'Anulado'};

  let lista = ps.filter(function(p){
    if(_prestFiltroActual !== 'todos'){
      const mapa = {activos:'activo',mora:'mora',pagados:'pagado'};
      if(estadoPrestamo(p) !== (mapa[_prestFiltroActual]||_prestFiltroActual)) return false;
    }
    if(q){
      const c = clientes.find(function(x){ return x.id===p.cliente_id; });
      if(!c || !c.nombre.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const listaEl = document.getElementById('prest-lista');
  const countEl = document.getElementById('prest-count');
  if(!listaEl) return;
  if(countEl) countEl.textContent = lista.length + ' resultado' + (lista.length!==1?'s':'');

  if(lista.length === 0){
    listaEl.innerHTML = '<div class="empty"><div class="empty-title">Sin resultados</div><div class="empty-sub">'+(q?'Ningún préstamo coincide con "'+q+'"':'Sin préstamos en este estado')+'</div></div>';
    return;
  }

  let htmlL = '<div class="item-list">';
  lista.forEach(function(p){
    const c   = clientes.find(function(x){ return x.id===p.cliente_id; });
    const est = estadoPrestamo(p);
    const saldo = saldoPrestamo(p);
    const col = colores[est]||'var(--txt3)';
    const lbl = labels[est]||est;
    const diasMora = est==='mora' ? diffDays(p.fecha_vencimiento, today()) : 0;
    const moraStr = diasMora > 0 ? ' · <span style="color:var(--red)">'+diasMora+'d mora</span>' : '';
    htmlL +=
      '<div class="item" data-pid="' + p.id + '">' +
        '<div class="item-avatar">' + initials(c?.nombre||'?') + '</div>' +
        '<div class="item-body">' +
          '<div class="item-name">' + (p.num_credito?'<span style="color:var(--txt3);font-size:12px">#'+p.num_credito+' </span>':'') + esc(c?.nombre||'Cliente eliminado') + '</div>' +
          '<div class="item-detail">' + fmt(p.monto_prestado) + ' · ' + p.tasa_interes_mensual + '% · ' + fmtDate(p.fecha_vencimiento) + moraStr + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="item-amount" style="color:' + (est==='pagado'?'var(--txt3)':'var(--txt)') + '">' + fmt(saldo) + '</div>' +
          '<div class="item-status"><span class="badge" style="background:'+col+'22;color:'+col+'">'+lbl+'</span></div>' +
        '</div>' +
      '</div>';
  });
  htmlL += '</div>';
  listaEl.innerHTML = htmlL;
  document.querySelectorAll('#prest-lista .item[data-pid]').forEach(function(el){
    el.addEventListener('click', function(){ navigate('prestamo-detalle', this.getAttribute('data-pid')); });
  });
}

function renderFormCliente(id){
  const fab = document.querySelector('.fab');
  if(fab) fab.remove();
  const c = id ? DB.clientes().find(x=>x.id===id) : null;
  const esEdicion = !!c;

  const screen = document.getElementById('screen');
  screen.innerHTML = '';

  // Header
  const header = document.createElement('div');
  header.style.cssText = 'padding:16px 20px 0;display:flex;align-items:center;gap:12px;margin-bottom:8px';
  header.innerHTML =
    '<button id="btn-back-form" style="width:44px;height:44px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>'+
    '</button>'+
    '<h1 style="font-size:24px;font-weight:400">'+(esEdicion?'Editar cliente':'Nuevo cliente')+'</h1>';
  screen.appendChild(header);
  document.getElementById('btn-back-form').addEventListener('click', function(){ navigate('clientes'); });

  // Form container
  const form = document.createElement('div');
  form.style.cssText = 'padding:16px 20px';

  // Campo nombre
  function campo(labelTxt, inputId, tipo, placeholder, valor, extra){
    const g = document.createElement('div');
    g.style.marginBottom = '16px';
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em';
    lbl.textContent = labelTxt;
    g.appendChild(lbl);
    let inp;
    if(tipo === 'select'){
      inp = document.createElement('select');
      const opts = extra || [];
      opts.forEach(function(o){
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        if(o === (valor || opts[0])) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if(tipo === 'textarea'){
      inp = document.createElement('textarea');
      inp.placeholder = placeholder;
      inp.textContent = valor || '';
      inp.style.minHeight = '80px';
      inp.style.resize = 'vertical';
    } else {
      inp = document.createElement('input');
      inp.type = tipo;
      inp.placeholder = placeholder;
      inp.value = valor || '';
    }
    inp.id = inputId;
    inp.style.cssText = 'width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--txt);font-size:15px;padding:12px 14px;box-sizing:border-box';
    g.appendChild(inp);
    return g;
  }

  form.appendChild(campo('Nombre completo *', 'f-nombre', 'text', 'Ej: María García', c?.nombre));
  form.appendChild(campo('Teléfono', 'f-tel', 'tel', '310 000 0000', c?.telefono));

  // Row 2 campos
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px';
  const tipoGrp = campo('Tipo cliente', 'f-tipo', 'select', '', c?.tipo_cliente||'Fidelizado', ['Fidelizado','R.Bajo','R.Alto','Nuevo']);
  tipoGrp.style.margin = '0';
  const idGrp = campo('Identificación', 'f-id', 'text', 'CC / NIT', c?.identificacion);
  idGrp.style.margin = '0';
  row.appendChild(tipoGrp);
  row.appendChild(idGrp);
  form.appendChild(row);

  form.appendChild(campo('Observaciones', 'f-obs', 'textarea', 'Notas sobre el cliente...', c?.observaciones));

  // Botón guardar
  const btn = document.createElement('button');
  btn.textContent = esEdicion ? 'Guardar cambios' : 'Crear cliente';
  btn.style.cssText = 'width:100%;background:var(--gold);color:#1a1200;border:none;border-radius:8px;font-size:15px;font-weight:500;padding:14px;cursor:pointer;margin-top:8px';

  btn.addEventListener('click', async function(){
    if(this.disabled) return;
    const nombre = document.getElementById('f-nombre').value.trim();
    if(!nombre) return campoError('f-nombre','El nombre del cliente es obligatorio');
    const tel = document.getElementById('f-tel').value.trim();
    if(tel && tel.replace(/\D/g,'').length < 7) return campoError('f-tel','El teléfono parece incompleto');

    // Validación de duplicados: antes vivía en una rama muerta y nunca se ejecutaba
    if(!esEdicion){
      const activos = DB.clientes().filter(x=>x.estado !== 'inactivo');
      const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
      const n0 = norm(nombre);
      const exacto = activos.find(x=>norm(x.nombre) === n0);
      if(exacto) return campoError('f-nombre','Ya existe un cliente con ese nombre');
      const cedula = document.getElementById('f-id').value.trim();
      if(cedula){
        const mismaCC = activos.find(x=>String(x.identificacion||'').trim() === cedula);
        if(mismaCC) return campoError('f-id','Esa identificación ya está registrada en "'+mismaCC.nombre+'"');
      }
      const similar = activos.find(x=>norm(x.nombre).slice(0,6) === n0.slice(0,6) && norm(x.nombre) !== n0);
      if(similar && !confirm('Posible duplicado: ya existe "'+similar.nombre+'".\n\n¿Crear "'+nombre+'" de todas formas?')) return;
    }

    this.disabled = true; this.textContent = 'Guardando...';
    const datos = {
      nombre: nombre, telefono: tel,
      tipo_cliente: document.getElementById('f-tipo').value,
      identificacion: document.getElementById('f-id').value.trim(),
      observaciones: document.getElementById('f-obs').value.trim(),
    };
    const r = esEdicion
      ? await guardarRemoto('clientes','update',{...datos,id},'cliente '+nombre)
      : await guardarRemoto('clientes','create',datos,'cliente '+nombre);
    if(!r.ok && !r.encolado){ reactivar(this, esEdicion?'Guardar cambios':'Crear cliente'); return; }
    if(r.ok){ if(!esEdicion && r.data && r.data.id) id = r.data.id; await syncData(true); }
    if(esEdicion && id) navigate('cliente-detalle', id, false);
    else navigate('clientes', null, false);
    if(r.ok) setTimeout(()=>toastOk('Cliente '+(esEdicion?'actualizado':'creado')+': '+nombre), 80);
  });

  form.appendChild(btn);
  screen.appendChild(form);

  // Focus en nombre
  setTimeout(function(){ 
    const n = document.getElementById('f-nombre');
    if(n) n.focus();
  }, 100);
}

function calcPreview(){
  const monto = parseFloat(document.getElementById('p-monto')?.value)||0;
  const tasa = parseFloat(document.getElementById('p-tasa')?.value)||0;
  const cuotas = parseInt(document.getElementById('p-cuotas')?.value)||1;
  const freq = parseInt(document.getElementById('p-freq')?.value)||30;
  const fi = document.getElementById('p-finicio')?.value;

  if(monto>0&&tasa>0&&fi){
    // auto-calcular fecha vencimiento
    const fv = new Date(fi+'T12:00:00');
    fv.setDate(fv.getDate() + freq*cuotas);
    document.getElementById('p-fvence').value = fv.toISOString().slice(0,10);

    const calc = calcPrestamo(monto, tasa, cuotas, freq);
    document.getElementById('preview-prestamo').style.display='block';
    document.getElementById('prev-int').textContent = fmt(calc.intTotal);
    document.getElementById('prev-total').textContent = fmt(calc.total);
    document.getElementById('prev-cuota').textContent = fmt(calc.valorCuota);
  }
}

async function guardarPrestamo(clienteId){
  if(!clienteId || clienteId==='' || clienteId==='undefined') return toastErr('Cliente no identificado. Vuelve a su ficha e intenta de nuevo.');
  const monto  = parseNum(document.getElementById('p-monto').value);
  const tasa   = parseNum(document.getElementById('p-tasa').value);
  const cuotas = parseInt(document.getElementById('p-cuotas').value, 10);
  const freq   = parseInt(document.getElementById('p-freq').value, 10) || 30;
  const fi     = document.getElementById('p-finicio').value;
  const fv     = document.getElementById('p-fvence').value;

  if(!isFinite(monto) || monto <= 0)  return campoError('p-monto','Ingresa un monto válido mayor a cero');
  if(!isFinite(tasa)  || tasa  <= 0)  return campoError('p-tasa','Ingresa una tasa válida mayor a cero');
  if(tasa > 100)                      return campoError('p-tasa','La tasa parece muy alta. Revisa el valor.');
  if(!isFinite(cuotas)|| cuotas < 1 || cuotas > 60) return campoError('p-cuotas','El número de cuotas debe estar entre 1 y 60');
  if(!fi)                             return campoError('p-finicio','Falta la fecha de inicio');
  if(!fv)                             return campoError('p-fvence','Falta la fecha de vencimiento');
  if(fv <= fi)                        return campoError('p-fvence','El vencimiento debe ser posterior al inicio');

  const cap = capitalDisponible();
  if(monto > cap.libre){
    if(!confirm('Este préstamo ('+fmt(monto)+') supera tu capital libre ('+fmt(cap.libre)+').\n\n¿Registrarlo de todos modos?')) return;
  }

  const btn = document.getElementById('btn-guardar-prestamo');
  if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Guardando...'; }

  const calc = calcPrestamo(monto, tasa, cuotas, freq);
  const nuevo = {
    cliente_id:clienteId, monto_prestado:monto, tasa_interes_mensual:tasa,
    frecuencia_cobro:freq, num_cuotas:cuotas,
    valor_cuota:calc.valorCuota, interes_total:calc.intTotal, total_a_pagar:calc.total,
    fecha_inicio:fi, fecha_vencimiento:fv, estado:'activo',
    observaciones:(document.getElementById('p-obs').value||'').trim()
  };
  const r = await guardarRemoto('prestamos','create',nuevo,'préstamo nuevo');
  if(!r.ok && !r.encolado){ reactivar(btn,'Crear préstamo'); return; }
  if(r.ok) await syncData(true);
  cerrarDrawerLimpio();
  navigate('cliente-detalle', clienteId, false);
  if(r.ok) setTimeout(()=>toastOk('Préstamo creado'), 120);
}

async function guardarAbono(prestamoId){
  const p = DB.prestamos().find(x=>x.id===prestamoId);
  if(!p) return toastErr('El préstamo ya no existe. Sincroniza y vuelve a intentar.');
  const monto = parseNum(document.getElementById('a-monto').value);
  const fecha = document.getElementById('a-fecha').value;
  if(!isFinite(monto) || monto <= 0) return campoError('a-monto','Ingresa un monto válido mayor a cero');
  if(!fecha)                         return campoError('a-fecha','Falta la fecha del abono');
  if(fecha > today())                return campoError('a-fecha','La fecha no puede ser futura');

  const saldo = saldoPrestamo(p);
  if(monto > saldo + TOL){
    const exceso = monto - saldo;
    if(!confirm('El abono ('+fmt(monto)+') supera el saldo pendiente ('+fmt(saldo)+').\n\nQuedará un saldo a favor de '+fmt(exceso)+'.\n\n¿Registrarlo así?')) {
      return reactivar(document.getElementById('btn-guardar-abono'),'Registrar abono');
    }
  }

  const btn = document.getElementById('btn-guardar-abono');
  if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Guardando...'; }

  const nuevo = {
    prestamo_id:prestamoId, monto,
    tipo_abono:document.getElementById('a-tipo').value,
    fecha_abono:fecha,
    observaciones:(document.getElementById('a-obs').value||'').trim()
  };
  const r = await guardarRemoto('abonos','create',nuevo,'abono de '+fmt(monto));
  if(!r.ok && !r.encolado){ reactivar(btn,'Registrar abono'); return; }

  if(r.ok){
    await syncData(true);
    const p2 = DB.prestamos().find(x=>x.id===prestamoId);
    if(p2 && saldoPrestamo(p2) <= TOL && p2.estado !== 'pagado'){
      await guardarRemoto('prestamos','update',{id:prestamoId,estado:'pagado'},'cierre del préstamo');
      await syncData(true);
    }
  }
  cerrarDrawerLimpio();
  navigate('prestamo-detalle', prestamoId, false);
  if(r.ok){
    setTimeout(()=>toastOk('Abono registrado'), 120);
    const p3 = DB.prestamos().find(x=>x.id===prestamoId);
    if(p3) setTimeout(()=>ofrecerRecibo(prestamoId, monto, fecha), 700);
  }
}

function enviarRecibo(prestamoId, monto, fecha){
  const p = DB.prestamos().find(x=>x.id===prestamoId); if(!p) return;
  const c = DB.clientes().find(x=>x.id===p.cliente_id); if(!c) return;
  const pl = planPrestamo(p);
  const prox = pl.proximaCuota;
  const tel = String(c.telefono||'').replace(/\D/g,'');
  const txt =
    'RECIBO DE PAGO\n'+
    '-------------------------\n'+
    'Cliente: '+c.nombre+'\n'+
    (p.num_credito?'Credito: #'+p.num_credito+'\n':'')+
    'Fecha: '+fmtDate(fecha)+'\n'+
    'Abono recibido: '+fmt(monto)+'\n'+
    '-------------------------\n'+
    'Saldo pendiente: '+fmt(pl.saldo)+'\n'+
    (prox? 'Proxima cuota: '+fmt(prox.total-prox.pagado)+' el '+fmtDate(prox.fecha)
         : 'PRESTAMO CANCELADO. Gracias por su cumplimiento.')+
    '\n\nGracias por su pago.';
  closeDrawer();

      {prestamo_id:prestamoId, monto:saldo, tipo_abono:'total', fecha_abono:today(), observaciones:'Pago total'},

    ? 'Este préstamo tiene '+pl.abonos.length+' abono(s) registrados por '+fmt(pl.abonado)+'.\nTambién se eliminarán.\n\n': '';

async function guardarCapital(tipoForzado){
  const monto = parseNum(document.getElementById('cap-monto').value);
  if(!isFinite(monto) || monto <= 0) return campoError('cap-monto','Ingresa un monto válido mayor a cero');
  const fecha = document.getElementById('cap-fecha').value;
  if(!fecha) return campoError('cap-fecha','Falta la fecha');
  // El select de origen ahora SÍ se respeta (antes se descartaba siempre)
  const sel = document.getElementById('cap-tipo');
  const tipo = tipoForzado === 'retiro' ? 'retiro' : (sel && sel.value ? sel.value : 'ingreso');
  const desc = (document.getElementById('cap-desc')||{}).value ? document.getElementById('cap-desc').value.trim() : '';

  if(tipo === 'retiro'){
    const cap = capitalDisponible();
    if(monto > cap.libre){
      if(!confirm('Vas a retirar '+fmt(monto)+' pero solo tienes '+fmt(cap.libre)+' libre.\n\nEsto dejará la caja en negativo. ¿Continuar?')) return;
    }
  }
  const btn = document.getElementById(tipoForzado==='retiro' ? 'btn-retirar-cap' : 'btn-inyectar-cap');
  if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Guardando...'; }

  const r = await guardarRemoto('capitalMovimientos','create',{monto, tipo, fecha, descripcion:desc},
                                (tipo==='retiro'?'retiro':'inyección')+' de '+fmt(monto));
  if(!r.ok && !r.encolado){ reactivar(btn, tipoForzado==='retiro'?'Confirmar retiro':'Confirmar inyección'); return; }
  if(r.ok) await syncData(true);
  cerrarDrawerLimpio();
  navigate('capital', null, false);
  if(r.ok) setTimeout(()=>toastOk(tipo==='retiro'?'Retiro registrado':'Capital registrado'), 100);
}

async function guardarGasto(){
  const monto = parseNum(document.getElementById('g-monto').value);
  const concepto = document.getElementById('g-concepto').value.trim();
  const fecha = document.getElementById('g-fecha').value;
  if(!isFinite(monto) || monto <= 0) return campoError('g-monto','Ingresa un monto válido mayor a cero');
  if(!concepto)                      return campoError('g-concepto','Escribe en qué gastaste');
  if(!fecha)                         return campoError('g-fecha','Falta la fecha');
  if(fecha > today())                return campoError('g-fecha','La fecha no puede ser futura');

  const cap = capitalDisponible();
  if(monto > cap.libre && cap.libre >= 0){
    if(!confirm('Este gasto ('+fmt(monto)+') supera tu capital libre ('+fmt(cap.libre)+').\n\n¿Registrarlo igual?')) return;
  }
  const btn = document.getElementById('btn-guardar-gasto');
  if(btn){ if(btn.disabled) return; btn.disabled = true; btn.textContent = 'Guardando...'; }

  const r = await guardarRemoto('gastos','create',
    {monto, concepto, categoria:document.getElementById('g-cat').value, fecha}, 'gasto de '+fmt(monto));
  if(!r.ok && !r.encolado){ reactivar(btn,'Registrar'); return; }
  if(r.ok) await syncData(true);
  cerrarDrawerLimpio();
  navigate('gastos', null, false);
  if(r.ok) setTimeout(()=>toastOk('Gasto registrado'), 100);
}

function pdfCrear(alturaMM){
  const {jsPDF} = window.jspdf;
  return new jsPDF({unit:'mm', format:[PDF_W, Math.max(alturaMM,60)]});
}

function pdfHeader(doc, titulo, subtitulo){
  doc.setFillColor.apply(doc, PDF_COL.dark);
  doc.rect(0, 0, PDF_W, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text(titulo, 8, 12);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor.apply(doc, PDF_COL.subtitle);
  doc.text(subtitulo, 8, 18);
  return 30;
}

function pdfFila(doc, y, label, valor, alterna){
  if(alterna){
    doc.setFillColor.apply(doc, PDF_COL.altRow);
    doc.rect(0, y-4.5, PDF_W, 7, 'F');
  }
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor.apply(doc, PDF_COL.labelTxt);
  doc.text(label, 8, y);
  doc.setTextColor.apply(doc, PDF_COL.valueTxt);
  doc.text(String(valor), PDF_W-8, y, {align:'right'});
  return y+7;
}

function pdfSeccionTitulo(doc, y, texto){
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor.apply(doc, PDF_COL.goldLabel);
  doc.text(texto.toUpperCase(), 8, y);
  return y+6;
}

function pdfFilaTabla(doc, y, col1, col2, col3){
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor.apply(doc, PDF_COL.labelTxt);
  doc.text(col1, 8, y);
  if(col2) doc.text(col2, 38, y);
  doc.setTextColor.apply(doc, PDF_COL.valueTxt);
  doc.text(col3, PDF_W-8, y, {align:'right'});
  doc.setDrawColor.apply(doc, PDF_COL.border);
  doc.setLineWidth(0.15);
  doc.line(8, y+2.3, PDF_W-8, y+2.3);
  return y+7.5;
}

function pdfCajaSaldo(doc, y, label, valor){
  const h = 16;
  doc.setFillColor.apply(doc, PDF_COL.dark);
  doc.roundedRect(8, y, PDF_W-16, h, 2, 2, 'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(224,217,204);
  doc.text(label, 12, y+10);
  doc.setFontSize(14);
  doc.setTextColor.apply(doc, PDF_COL.gold);
  doc.text(String(valor), PDF_W-12, y+10.5, {align:'right'});
  return y+h+6;
}

async function compartirArchivo(blob, filename){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  } catch(e){
    if(e.name === 'AbortError') return; // el usuario cerró el menú de compartir
    console.error('Share error:', e);
  }
  // Fallback: descargar el archivo para compartirlo manualmente
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  mostrarToast('PDF descargado — ábrelo y compártelo por WhatsApp');
}

async function compartirResumenPDF(clienteId){
  const c = DB.clientes().find(x=>x.id===clienteId);
  const ps = DB.prestamos().filter(p=>p.cliente_id===clienteId&&['activo','mora'].includes(estadoPrestamo(p)));
  if(ps.length===0) return alert('Este cliente no tiene prestamos activos');

  const fecha = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});

  const bloques = ps.map(function(p){
    const abonos = DB.abonos().filter(a=>a.prestamo_id===p.id).sort((a,b)=>new Date(a.fecha_abono)-new Date(b.fecha_abono));
    let h = 6 + 4*7;
    if(abonos.length>0) h += 6 + abonos.length*7.5 + 3;
    h += 22 + 3;
    return {p, abonos, h};
  });
  let alturaEstimada = 30 + 12 + 10;
  bloques.forEach(function(b){ alturaEstimada += b.h; });

  const doc = pdfCrear(alturaEstimada);
  let y = pdfHeader(doc, 'Estado de cuenta', fecha);

  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor.apply(doc, PDF_COL.labelTxt);
  doc.text('CLIENTE', 8, y);
  doc.setFontSize(11);
  doc.setTextColor.apply(doc, PDF_COL.valueTxt);
  doc.text(c.nombre, 8, y+6);
  y += 12;

  bloques.forEach(function(b){
    const p = b.p;
    const est = estadoPrestamo(p);
    const estLabel = est==='mora' ? 'En mora' : 'Al dia';
    y = pdfSeccionTitulo(doc, y, 'Prestamo - '+estLabel);
    y = pdfFila(doc, y, 'Capital prestado', fmt(p.monto_prestado), false);
    y = pdfFila(doc, y, 'Tasa', p.tasa_interes_mensual+'% fijo mensual', true);
    y = pdfFila(doc, y, 'Total a pagar', fmt(p.total_a_pagar), false);
    y = pdfFila(doc, y, 'Vence', fmtDate(p.fecha_vencimiento), true);
    if(b.abonos.length>0){
      y += 3;
      y = pdfSeccionTitulo(doc, y, 'Abonos realizados');
      b.abonos.forEach(function(a){
        const tipoLabel = a.tipo_abono==='total'?'Pago total': a.tipo_abono==='capital'?'Capital': a.tipo_abono==='interes'?'Interes':'Mixto';
        y = pdfFilaTabla(doc, y, fmtDateCorta(a.fecha_abono), tipoLabel, fmt(a.monto));
      });
    }
    const saldo = saldoPrestamo(p);
    y += 3;
    y = pdfCajaSaldo(doc, y, 'Saldo pendiente', fmt(saldo));
  });

  const blob = doc.output('blob');
  await compartirArchivo(blob, 'estado_cuenta_'+c.nombre.replace(/\s+/g,'_')+'.pdf');
}

function compartirResumen(clienteId){
  const c = DB.clientes().find(x=>x.id===clienteId);
  const ps = DB.prestamos().filter(p=>p.cliente_id===clienteId&&['activo','mora'].includes(estadoPrestamo(p)));
  if(ps.length===0) return alert('Este cliente no tiene prestamos activos');

  const fecha = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});
  let msg = '*Estado de cuenta - ' + fecha + '*\n';
  msg += 'Cliente: ' + c.nombre + '\n';
  msg += '--------------------\n\n';

  ps.forEach(function(p){
    const saldo = saldoPrestamo(p);
    const est = estadoPrestamo(p);
    const abonos = DB.abonos()
      .filter(function(a){ return a.prestamo_id===p.id; })
      .sort(function(a,b){ return new Date(a.fecha_abono)-new Date(b.fecha_abono); });
    const totalAbonado = abonos.reduce(function(s,a){ return s+a.monto; },0);

    const estLabel = est==='mora' ? 'en Mora' : est==='pagado' ? 'Pagado' : 'al Dia';
    msg += '*Prestamo ' + estLabel + '*\n';
    msg += '- Capital prestado: ' + fmt(p.monto_prestado) + '\n';
    msg += '- Tasa: ' + p.tasa_interes_mensual + '% fijo mensual\n';
    msg += '- Total a pagar: ' + fmt(p.total_a_pagar) + '\n';
    msg += '- Fecha inicio: ' + fmtDate(p.fecha_inicio) + '\n';
    msg += '- Vence: ' + fmtDate(p.fecha_vencimiento) + '\n';
    if(est==='mora'){
      const dias = diffDays(p.fecha_vencimiento, today());
      msg += '- EN MORA: ' + dias + ' dia' + (dias!==1?'s':'') + '\n';
    }
    msg += '\n';

    if(abonos.length > 0){
      msg += '*Abonos realizados (' + abonos.length + ')*\n';
      abonos.forEach(function(a){
        const tipoLabel = a.tipo_abono==='total'?'Pago total': a.tipo_abono==='capital'?'Capital': a.tipo_abono==='interes'?'Interes':'Mixto';
        msg += '* ' + fmtDate(a.fecha_abono) + ' - ' + fmt(a.monto) + ' (' + tipoLabel + ')';
        if(a.observaciones) msg += ' - ' + a.observaciones;
        msg += '\n';
      });
      msg += '- Total abonado: ' + fmt(totalAbonado) + '\n\n';
    } else {
      msg += 'Sin abonos registrados\n\n';
    }

    msg += '*Saldo pendiente: ' + fmt(saldo) + '*\n';
    msg += '--------------------\n\n';
  });

  msg += 'Cualquier duda puedes comunicarte conmigo. Feliz Dia!';

  const url = 'https://wa.me/' + c.telefono.replace(/\D/g,'') + '?text=' + encodeURIComponent(msg);
  window.open(url,'_blank');
}
